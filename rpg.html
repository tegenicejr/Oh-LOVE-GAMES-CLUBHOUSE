<!DOCTYPE html>
<html lang="ja">

  <meta charset="UTF-8">

  <title>Oh LOVE QUEST - 8bit Retro JRPG</title>

  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      touch-action: manipulation;
    }
    body {
      background-color: #050508;
      color: #ffffff;
      font-family: 'DotGothic16', monospace;
      margin: 0;
      padding: 0;
      overflow-x: hidden;
    }
    /* DQ2 Classic Window Style */
    .dq-box {
      background-color: #000000;
      border: 3px solid #ffffff;
      border-radius: 4px;
      box-shadow: inset 0 0 0 2px #000000, 0 4px 10px rgba(0,0,0,0.8);
      position: relative;
    }
    .dq-cursor {
      display: inline-block;
      width: 0;
      height: 0;
      border-top: 5px solid transparent;
      border-bottom: 5px solid transparent;
      border-left: 9px solid #ffffff;
      vertical-align: middle;
      margin-right: 6px;
    }
    /* CRT Scanlines */
    .crt-overlay::after {
      content: " ";
      display: block;
      position: absolute;
      top: 0; left: 0; bottom: 0; right: 0;
      background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.35) 50%),
                  radial-gradient(circle, rgba(0,0,0,0) 70%, rgba(0,0,0,0.6) 100%);
      background-size: 100% 3px, 100% 100%;
      pointer-events: none;
      z-index: 50;
    }
    /* Virtual Controller D-Pad & Action Buttons */
    .v-btn {
      background: #1c1c24;
      border: 2px solid #555566;
      border-radius: 8px;
      box-shadow: 0 4px #0a0a0f;
      color: #ffffff;
      active:scale(0.95);
      touch-action: manipulation;
    }
    .v-btn:active {
      transform: translateY(2px);
      box-shadow: 0 2px #0a0a0f;
      background: #2a2a38;
    }
  </style>
</head>

  <script>
    // Web Audio API Retro Chiptune Sound Synthesizer
    class RetroAudioEngine {
      constructor() {
        this.ctx = null;
        this.bgmNode = null;
        this.currentTrack = null;
        this.bgmTimer = null;
        this.isEnabled = false;
        this.step = 0;
      }

      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }

      toggleAudio() {
        this.init();
        this.isEnabled = !this.isEnabled;
        if (!this.isEnabled) {
          this.stopBgm();
          return false;
        } else {
          return true;
        }
      }

      // Generate 8-bit Pulse/Square wave beep
      playTone(freq, duration = 0.1, type = 'square', gainVal = 0.08) {
        if (!this.isEnabled || !this.ctx) return;
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = type;
          osc.frequency.setValueAtTime(freq, this.ctx.currentTime);

          gain.gain.setValueAtTime(gainVal, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.0001, this.ctx.currentTime + duration);

          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + duration);
        } catch (e) {}
      }

      // DQ-like Text Dialogue Blip sound
      playTextBlip() {
        this.playTone(420, 0.04, 'square', 0.04);
      }

      // Menu Cursor Move SE
      playCursorSE() {
        this.playTone(330, 0.05, 'square', 0.06);
      }

      // Confirm / Enter SE
      playConfirmSE() {
        this.playTone(660, 0.07, 'square', 0.08);
      }

      // Player Attack Hit SE
      playHitSE() {
        if (!this.isEnabled || !this.ctx) return;
        const now = this.ctx.currentTime;
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(220, now);
        osc.frequency.exponentialRampToValueAtTime(40, now + 0.15);
        gain.gain.setValueAtTime(0.15, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        osc.start(now);
        osc.stop(now + 0.15);
      }

      // Critical Hit / Fanfare
      playCriticalSE() {
        this.playTone(880, 0.08, 'square', 0.12);
        setTimeout(() => this.playTone(1174, 0.15, 'square', 0.15), 80);
      }

      // Spell Casting SE
      playSpellSE() {
        if (!this.isEnabled || !this.ctx) return;
        const freqs = [350, 440, 523, 659, 784, 1046];
        freqs.forEach((f, idx) => {
          setTimeout(() => this.playTone(f, 0.06, 'sine', 0.1), idx * 40);
        });
      }

      // Inn / Church Fanfare
      playInnJingle() {
        const jingle = [
          { f: 523.25, d: 0.18 },
          { f: 587.33, d: 0.18 },
          { f: 659.25, d: 0.18 },
          { f: 698.46, d: 0.18 },
          { f: 783.99, d: 0.4 },
          { f: 659.25, d: 0.2 },
          { f: 783.99, d: 0.6 }
        ];
        jingle.forEach((n, idx) => {
          setTimeout(() => this.playTone(n.f, n.d, 'square', 0.1), idx * 180);
        });
      }

      // Victory Fanfare
      playVictoryFanfare() {
        this.stopBgm();
        const notes = [
          { f: 523, d: 0.1 }, { f: 523, d: 0.1 }, { f: 523, d: 0.1 },
          { f: 523, d: 0.28 }, { f: 415, d: 0.28 }, { f: 466, d: 0.28 },
          { f: 523, d: 0.45 }
        ];
        notes.forEach((n, idx) => {
          setTimeout(() => this.playTone(n.f, n.d, 'triangle', 0.12), idx * 140);
        });
      }

      // Background Music Loops (Field & Battle)
      startBgm(type) {
        if (!this.isEnabled) return;
        this.stopBgm();
        this.currentTrack = type;
        this.step = 0;

        if (type === 'field') {
          // Classic Dragon Quest Field Melody (Arpeggiated)
          const fieldMelody = [
            261.63, 329.63, 392.00, 523.25,
            392.00, 329.63, 261.63, 196.00,
            220.00, 261.63, 329.63, 440.00,
            329.63, 261.63, 220.00, 196.00
          ];
          this.bgmTimer = setInterval(() => {
            if (!this.isEnabled) return;
            const note = fieldMelody[this.step % fieldMelody.length];
            this.playTone(note, 0.2, 'square', 0.04);
            // Bass support note
            if (this.step % 4 === 0) {
              this.playTone(note * 0.5, 0.25, 'triangle', 0.07);
            }
            this.step++;
          }, 260);

        } else if (type === 'battle') {
          // Fast-paced DQ2 Battle Bassline
          const battleBass = [
            146.83, 146.83, 293.66, 146.83,
            164.81, 164.81, 329.63, 164.81,
            174.61, 174.61, 349.23, 174.61,
            164.81, 164.81, 329.63, 164.81
          ];
          this.bgmTimer = setInterval(() => {
            if (!this.isEnabled) return;
            const note = battleBass[this.step % battleBass.length];
            this.playTone(note, 0.12, 'sawtooth', 0.05);
            if (this.step % 2 === 0) {
              this.playTone(note * 2, 0.08, 'square', 0.03);
            }
            this.step++;
          }, 150);
        }
      }

      stopBgm() {
        if (this.bgmTimer) {
          clearInterval(this.bgmTimer);
          this.bgmTimer = null;
        }
        this.currentTrack = null;
      }
    }

    // Procedural 16x16 Tile Drawing Routine
    function drawTile(tileType, px, py) {
      switch(tileType) {
        case TILE_GRASS:
          ctx.fillStyle = "#388c28";
          ctx.fillRect(px, py, 16, 16);
          ctx.fillStyle = "#2c7020";
          ctx.fillRect(px + 4, py + 2, 2, 4);
          ctx.fillRect(px + 10, py + 8, 2, 4);
          break;
        case TILE_FOREST:
          ctx.fillStyle = "#1e5218";
          ctx.fillRect(px, py, 16, 16);
          ctx.fillStyle = "#12360e";
          ctx.fillRect(px + 2, py + 2, 12, 12);
          ctx.fillStyle = "#2e7a24";
          ctx.fillRect(px + 4, py + 4, 8, 8);
          break;
        case TILE_MOUNTAIN:
          ctx.fillStyle = "#8a663e";
          ctx.fillRect(px, py, 16, 16);
          ctx.fillStyle = "#634728";
          ctx.beginPath();
          ctx.moveTo(px + 8, py + 2);
          ctx.lineTo(px + 14, py + 14);
          ctx.lineTo(px + 2, py + 14);
          ctx.fill();
          ctx.fillStyle = "#e0d8c0";
          ctx.fillRect(px + 7, py + 2, 2, 3);
          break;
        case TILE_WATER:
          ctx.fillStyle = "#184299";
          ctx.fillRect(px, py, 16, 16);
          ctx.fillStyle = "#2b67d9";
          ctx.fillRect(px + 2, py + 4, 6, 2);
          ctx.fillRect(px + 8, py + 10, 6, 2);
          break;
        case TILE_TOWN:
          ctx.fillStyle = "#388c28";
          ctx.fillRect(px, py, 16, 16);
          ctx.fillStyle = "#c24434"; // Red roof
          ctx.fillRect(px + 2, py + 2, 12, 6);
          ctx.fillStyle = "#ded6c5"; // Walls
          ctx.fillRect(px + 3, py + 8, 10, 6);
          ctx.fillStyle = "#5c331e"; // Door
          ctx.fillRect(px + 7, py + 10, 3, 4);
          break;
        case TILE_DUNGEON:
          ctx.fillStyle = "#8a663e";
          ctx.fillRect(px, py, 16, 16);
          ctx.fillStyle = "#111118";
          ctx.fillRect(px + 4, py + 4, 8, 10);
          break;
        case TILE_CASTLE:
          ctx.fillStyle = "#388c28";
          ctx.fillRect(px, py, 16, 16);
          ctx.fillStyle = "#ffffff";
          ctx.fillRect(px + 1, py + 3, 14, 11);
          ctx.fillStyle = "#000000";
          ctx.fillRect(px + 6, py + 8, 4, 6);
          ctx.fillStyle = "#00f0ff";
          ctx.fillRect(px + 3, py + 5, 2, 3);
          ctx.fillRect(px + 11, py + 5, 2, 3);
          break;
        case TILE_FLOOR:
          ctx.fillStyle = "#8f8b82";
          ctx.fillRect(px, py, 16, 16);
          ctx.strokeStyle = "#5e5b55";
          ctx.strokeRect(px, py, 16, 16);
          break;
        case TILE_CAVE:
          ctx.fillStyle = "#2e2b3b";
          ctx.fillRect(px, py, 16, 16);
          ctx.fillStyle = "#1d1a26";
          ctx.fillRect(px + 3, py + 3, 3, 3);
          ctx.fillRect(px + 10, py + 9, 3, 3);
          break;
        case TILE_CHEST:
          ctx.fillStyle = "#2e2b3b";
          ctx.fillRect(px, py, 16, 16);
          ctx.fillStyle = "#c99628";
          ctx.fillRect(px + 3, py + 4, 10, 9);
          ctx.fillStyle = "#000000";
          ctx.fillRect(px + 3, py + 7, 10, 2);
          break;
      }
    }

    // World & Viewport Camera Rendering
    function renderWorld() {
      ctx.fillStyle = "#000000";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      let currentMap = worldMap;
      let mapW = MAP_WIDTH;
      let mapH = MAP_HEIGHT;

      if (currentMapId === "town") {
        currentMap = townMap;
        mapW = 16; mapH = 16;
      } else if (currentMapId === "dungeon") {
        currentMap = dungeonMap;
        mapW = 16; mapH = 16;
      }

      // Camera centered on Billie
      const viewTilesX = 16; // 256 / 16
      const viewTilesY = 14; // 224 / 16

      const startCol = Math.max(0, Math.min(mapW - viewTilesX, playerX - Math.floor(viewTilesX / 2)));
      const startRow = Math.max(0, Math.min(mapH - viewTilesY, playerY - Math.floor(viewTilesY / 2)));

      for (let r = 0; r < viewTilesY; r++) {
        for (let c = 0; c < viewTilesX; c++) {
          const mapTileX = startCol + c;
          const mapTileY = startRow + r;
          if (mapTileX < mapW && mapTileY < mapH) {
            const tile = currentMap[mapTileY * mapW + mapTileX];
            drawTile(tile, c * 16, r * 16);
          }
        }
      }

      // Render NPCs if in town or dungeon
      const npcs = currentMapId === "town" ? townNPCs : currentMapId === "dungeon" ? dungeonNPCs : [];
      npcs.forEach(npc => {
        // If companion already joined, don't show on map
        if (npc.isCompanion === "mike" && party[1].joined) return;
        if (npc.isCompanion === "tre" && party[2].joined) return;

        const screenX = (npc.x - startCol) * 16;
        const screenY = (npc.y - startRow) * 16;
        if (screenX >= 0 && screenX < canvas.width && screenY >= 0 && screenY < canvas.height) {
          const type = npc.isCompanion === "mike" ? 1 : npc.isCompanion === "tre" ? 2 : 3;
          drawHeroSprite(screenX, screenY, 2, 0, type);
        }
      });

      // Render Billie and Following Party Members (DQ2 Party Trail)
      const heroScreenX = (playerX - startCol) * 16;
      const heroScreenY = (playerY - startRow) * 16;
      drawHeroSprite(heroScreenX, heroScreenY, playerDir, 0, 0);

      // Follower 1: Mike (if joined)
      if (party[1].joined) {
        let offsetX = playerDir === 1 ? -14 : playerDir === 3 ? 14 : 0;
        let offsetY = playerDir === 2 ? -14 : playerDir === 0 ? 14 : 0;
        drawHeroSprite(heroScreenX + offsetX, heroScreenY + offsetY, playerDir, 0, 1);
      }

      // Follower 2: Tre (if joined)
      if (party[2].joined) {
        let offsetX = playerDir === 1 ? -26 : playerDir === 3 ? 26 : 0;
        let offsetY = playerDir === 2 ? -26 : playerDir === 0 ? 26 : 0;
        drawHeroSprite(heroScreenX + offsetX, heroScreenY + offsetY, playerDir, 0, 2);
      }
    }

    // Trigger Random Combat
    function startBattle(monsterTemplate = null) {
      if (inBattle) return;

      audio.stopBgm();
      audio.playSpellSE();

      // Screen Flash / Transition Effect
      let flashCount = 0;
      const flashInterval = setInterval(() => {
        canvas.style.filter = flashCount % 2 === 0 ? "invert(1)" : "none";
        flashCount++;
        if (flashCount > 5) {
          clearInterval(flashInterval);
          canvas.style.filter = "none";
          initBattleArena(monsterTemplate);
        }
      }, 70);
    }

      currentEnemySleeping = false;
      currentEnemy.draw(mCtx);
      setBattleMessage(`${currentEnemy.name}が あらわれた！`, "コマンドを えらんでください。");
      audio.startBgm('battle');
    }

    function updateCmdCursor() {
      for (let i = 0; i < 4; i++) {
        const item = document.getElementById(`cmdItem${i}`);
        const cursor = item.querySelector('.dq-cursor');
        if (i === selectedCmdIndex) {
          cursor.classList.remove('invisible');
        } else {
          cursor.classList.add('invisible');
        }
      }
    }

    // Flash Enemy on Hit
    function flashEnemy() {
      let f = 0;
      const flashTimer = setInterval(() => {
        monsterCanvas.style.opacity = f % 2 === 0 ? "0" : "1";
        f++;
        if (f > 4) {
          clearInterval(flashTimer);
          monsterCanvas.style.opacity = "1";
        }
      }, 60);
    }

    // Execute Player Attack
    function executePlayerAttack(hero) {
      audio.playHitSE();
      flashEnemy();

      const isCrit = Math.random() < 0.15;
      let dmg = Math.max(1, Math.floor(hero.atk * (isCrit ? 2.0 : 1.0) - currentEnemy.def * 0.5 + (Math.random() * 4 - 2)));
      currentEnemy.hp -= dmg;

      if (isCrit) {
        audio.playCriticalSE();
        setBattleMessage(`かいしんの いちげき！`, `${currentEnemy.name}に ${dmg}の ダメージ！`);
      } else {
        setBattleMessage(`${hero.name}の こうげき！`, `${currentEnemy.name}に ${dmg}の ダメージ！`);
      }

      checkBattleState();
    }

    // Enemy Attack Phase
    function enemyTurn() {
      if (currentEnemy.hp <= 0) return;

      setTimeout(() => {
        if (currentEnemySleeping) {
          if (Math.random() < 0.4) {
            currentEnemySleeping = false;
            setBattleMessage(`${currentEnemy.name}は めをさました！`);
          } else {
            setBattleMessage(`${currentEnemy.name}は 心地よく眠っている…`);
            return;
          }
        }

        // Pick living party target
        const livingParty = party.filter(h => h.joined && h.hp > 0);
        if (livingParty.length === 0) return;
        const target = livingParty[Math.floor(Math.random() * livingParty.length)];

        audio.playHitSE();
        let dmg = Math.max(1, Math.floor(currentEnemy.atk - target.def * 0.5 + (Math.random() * 3 - 1)));
        target.hp = Math.max(0, target.hp - dmg);
        updatePartyStatusUI();

        setBattleMessage(`${currentEnemy.name}の こうげき！`, `${target.name}は ${dmg}の ダメージをうけた！`);

        // Check Party wipe
        if (party[0].hp <= 0) {
          setTimeout(() => {
            audio.stopBgm();
            setBattleMessage(`ビリーたちは ぜんめつした…`, "すべてが めのまえが まっくらに なった…");
            setTimeout(() => {
              // Revive at castle
              alert("ビリーたちは城で目を覚ました。愛の力でやり直そう！");
              party[0].hp = party[0].maxHp;
              if (party[1].joined) party[1].hp = party[1].maxHp;
              if (party[2].joined) party[2].hp = party[2].maxHp;
              playerX = 2;
              playerY = 3;
              currentMapId = "world";
              endBattle();
            }, 2000);
          }, 1200);
        }
      }, 1000);
    }

    function checkBattleState() {
      if (currentEnemy.hp <= 0) {
        setTimeout(() => {
          audio.playVictoryFanfare();
          gold += currentEnemy.gold;
          setBattleMessage(`${currentEnemy.name}を たおした！`, `${currentEnemy.exp}の経験値と ${currentEnemy.gold}Gを かくとく！`);

          // Distribute exp
          party.forEach(hero => {
            if (hero.joined && hero.hp > 0) {
              hero.exp += currentEnemy.exp;
              if (hero.exp >= hero.lv * 20) {
                hero.lv++;
                hero.maxHp += 8;
                hero.hp = hero.maxHp;
                hero.maxMp += 4;
                hero.mp = hero.maxMp;
                hero.atk += 4;
                hero.def += 3;
                setTimeout(() => {
                  setBattleMessage(`${hero.name}は レベルが ${hero.lv}に あがった！`, "ちからと HPが 上昇した！");
                }, 1200);
              }
            }
          });

          // Check if Boss Overlord Defeated
          if (currentEnemy.name === "アンチ・LOVE魔王") {
            setTimeout(() => {
              alert("🎉【CONGRATULATIONS!!】\nアンチ・LOVE魔王を撃破した！\n世界に愛とロックンロールの光が永遠に取り戻された！\nあなたの冒険は大勝利で幕を閉じた！");
            }, 2500);
          }

          setTimeout(() => {
            endBattle();
          }, 2600);
        }, 800);
      } else {
        // Next Enemy Attack
        enemyTurn();
      }
    }

    function endBattle() {
      inBattle = false;
      dom.battleHud.classList.add('hidden');
      dom.battleSubBox.classList.add('hidden');
      audio.startBgm('field');
      renderWorld();
    }

    // Open Magic/Skill Submenu
    function openSpellSubMenu() {
      const hero = party[0]; // Billy
      dom.battleSubBox.innerHTML = '';
      hero.spells.forEach(spell => {
        const item = document.createElement('div');
        item.className = "cursor-pointer p-1 hover:bg-gray-800 flex justify-between";
        item.innerHTML = `<span>${spell.name}</span><span class="text-cyan-300">M${spell.mp}</span>`;
        item.onclick = () => {
          if (hero.mp < spell.mp) {
            setBattleMessage("MPが たりない！");
            return;
          }
          hero.mp -= spell.mp;
          updatePartyStatusUI();
          dom.battleSubBox.classList.add('hidden');
          audio.playSpellSE();

          if (spell.type === "heal") {
            hero.hp = Math.min(hero.maxHp, hero.hp + spell.power);
            updatePartyStatusUI();
            setBattleMessage(`${hero.name}は ${spell.name}を となえた！`, `HPが ${spell.power} かいふくした！`);
            enemyTurn();
          } else if (spell.type === "attack") {
            flashEnemy();
            currentEnemy.hp -= spell.power;
            setBattleMessage(`${hero.name}の ${spell.name}！`, `爆音が敵を直撃！ ${spell.power}の ダメージ！`);
            checkBattleState();
          } else if (spell.type === "sleep") {
            currentEnemySleeping = true;
            setBattleMessage(`${hero.name}は ${spell.name}を 奏でた！`, `${currentEnemy.name}は 眠ってしまった！`);
            enemyTurn();
          }
        };
        dom.battleSubBox.appendChild(item);
      });
      dom.battleSubBox.classList.remove('hidden');
    }

    // Command Selection Trigger
    function handleConfirmAction() {
      audio.playConfirmSE();
      if (inBattle) {
        if (!dom.battleSubBox.classList.contains('hidden')) return;

        if (selectedCmdIndex === 0) {
          // たたかう
          executePlayerAttack(party[0]);
        } else if (selectedCmdIndex === 1) {
          // じゅもん
          openSpellSubMenu();
        } else if (selectedCmdIndex === 2) {
          // どうぐ (Punk Herb / Soda)
          party[0].hp = Math.min(party[0].maxHp, party[0].hp + 20);
          updatePartyStatusUI();
          audio.playSpellSE();
          setBattleMessage("ビリーは ギターピックソーダを 飲んだ！", "HPが 20 かいふくした！");
          enemyTurn();
        } else if (selectedCmdIndex === 3) {
          // にげる
          if (Math.random() < 0.6) {
            setBattleMessage("ビリーたちは にげだした！");
            setTimeout(endBattle, 800);
          } else {
            setBattleMessage("しかし まわりこまれてしまった！");
            enemyTurn();
          }
        }
      } else {
        // Field Interact / Talk
        interactWithWorld();
      }
    }

    // World Map Dialogue & Interaction Logic
    let isDialogueActive = false;
    function showDialogue(text) {
      isDialogueActive = true;
      dom.dialogueBox.classList.remove('hidden');
      dom.diagText.innerText = text;
      audio.playTextBlip();
    }
    function closeDialogue() {
      isDialogueActive = false;
      dom.dialogueBox.classList.add('hidden');
      renderWorld();
    }

    function interactWithWorld() {
      if (isDialogueActive) {
        closeDialogue();
        return;
      }

      // Check facing tile for NPCs
      let targetX = playerX;
      let targetY = playerY;
      if (playerDir === 0) targetY--;
      if (playerDir === 1) targetX++;
      if (playerDir === 2) targetY++;
      if (playerDir === 3) targetX--;

      const npcs = currentMapId === "town" ? townNPCs : currentMapId === "dungeon" ? dungeonNPCs : [];
      const npc = npcs.find(n => n.x === targetX && n.y === targetY);

      if (npc) {
        if (npc.isInn) {
          if (gold >= 10) {
            gold -= 10;
            party.forEach(h => { h.hp = h.maxHp; h.mp = h.maxMp; });
            audio.playInnJingle();
            showDialogue("「ゆっくり おやすみ…。\n…おはよう！ HPとMPが 全快したぞ！」");
          } else {
            showDialogue("「おや、ゴールドが 足りないようだね。」");
          }
          return;
        }

        if (npc.isCompanion === "mike" && !party[1].joined) {
          party[1].joined = true;
          audio.playVictoryFanfare();
          showDialogue(npc.text);
          updatePartyStatusUI();
          return;
        }

        if (npc.isCompanion === "tre" && !party[2].joined) {
          party[2].joined = true;
          audio.playVictoryFanfare();
          showDialogue(npc.text);
          updatePartyStatusUI();
          return;
        }

        showDialogue(`「${npc.text}」`);
        return;
      }

      // Chest check in Dungeon
      if (currentMapId === "dungeon" && targetX === 7 && targetY === 13) {
        showDialogue("宝箱を あけた！\n『伝説のエレキギター・Blue』を 手に入れた！\nビリーの こうげきりょくが 10 上昇した！");
        party[0].atk += 10;
        audio.playCriticalSE();
        return;
      }

      showDialogue("しかし なにも みつからなかった。");
    }

    // Tile Movement and Map Transitions
    function movePlayer(dx, dy, dir) {
      if (inBattle || isDialogueActive) return;
      playerDir = dir;

      let mapW = currentMapId === "world" ? MAP_WIDTH : 16;
      let mapH = currentMapId === "world" ? MAP_HEIGHT : 16;
      let mapData = currentMapId === "world" ? worldMap : currentMapId === "town" ? townMap : dungeonMap;

      const nextX = playerX + dx;
      const nextY = playerY + dy;

      if (nextX < 0 || nextX >= mapW || nextY < 0 || nextY >= mapH) return;

      const tile = mapData[nextY * mapW + nextX];

      // Passable tiles: Grass, Forest, Floor, Cave, Stairs, Town entrance
      if (tile === TILE_MOUNTAIN || tile === TILE_WATER) {
        audio.playTone(180, 0.04, 'triangle');
        return;
      }

      // NPC collision check
      const npcs = currentMapId === "town" ? townNPCs : currentMapId === "dungeon" ? dungeonNPCs : [];
      if (npcs.some(n => n.x === nextX && n.y === nextY && !(n.isCompanion === "mike" && party[1].joined) && !(n.isCompanion === "tre" && party[2].joined))) {
        audio.playTone(180, 0.04, 'triangle');
        return;
      }

      playerX = nextX;
      playerY = nextY;
      stepCount++;
      audio.playTone(280, 0.03, 'square', 0.02);

      // Check Gateways & Map Transitions
      if (currentMapId === "world") {
        if (tile === TILE_TOWN) {
          // Enter Town
          currentMapId = "town";
          playerX = 7; playerY = 14; playerDir = 0;
          dom.locationBadge.innerText = "[ロックン・タウン]";
          renderWorld();
          return;
        } else if (tile === TILE_DUNGEON) {
          // Enter Cave of Love
          currentMapId = "dungeon";
          playerX = 7; playerY = 14; playerDir = 0;
          dom.locationBadge.innerText = "[愛と虚無の洞窟]";
          renderWorld();
          return;
        }
      } else if (currentMapId === "town" || currentMapId === "dungeon") {
        if (tile === TILE_GRASS) {
          // Exit back to Overworld
          if (currentMapId === "town") {
            playerX = 11; playerY = 6;
          } else {
            playerX = 28; playerY = 3;
          }
          currentMapId = "world";
          playerDir = 2;
          dom.locationBadge.innerText = "[フィールド]";
          renderWorld();
          return;
        }
      }

      // Boss Encounter tile in Dungeon deepest chamber (x: 8, y: 3)
      if (currentMapId === "dungeon" && playerX === 8 && playerY === 3) {
        startBattle(MONSTERS[3]); // Anti-Love Overlord
        return;
      }

      // Random Combat Encount Check on Overworld & Dungeon
      if (currentMapId === "world" || currentMapId === "dungeon") {
        const encounterRate = currentMapId === "dungeon" ? 0.12 : (tile === TILE_FOREST ? 0.09 : 0.05);
        if (Math.random() < encounterRate && stepCount > 4) {
          stepCount = 0;
          startBattle();
          return;
        }
      }

      renderWorld();
    }

    // Keyboard Handler
    window.addEventListener('keydown', (e) => {
      audio.init();
      switch(e.key) {
        case "ArrowUp": case "w": case "W":
          if (inBattle) {
            selectedCmdIndex = (selectedCmdIndex + 3) % 4;
            updateCmdCursor();
            audio.playCursorSE();
          } else movePlayer(0, -1, 0);
          break;
        case "ArrowDown": case "s": case "S":
          if (inBattle) {
            selectedCmdIndex = (selectedCmdIndex + 1) % 4;
            updateCmdCursor();
            audio.playCursorSE();
          } else movePlayer(0, 1, 2);
          break;
        case "ArrowLeft": case "a": case "A":
          if (!inBattle) movePlayer(-1, 0, 3);
          break;
        case "ArrowRight": case "d": case "D":
          if (!inBattle) movePlayer(1, 0, 1);
          break;
        case "z": case "Z": case "Enter": case " ":
          handleConfirmAction();
          break;
        case "x": case "X": case "Escape":
          audio.playConfirmSE();
          if (isDialogueActive) closeDialogue();
          if (!dom.battleSubBox.classList.contains('hidden')) dom.battleSubBox.classList.add('hidden');
          break;
      }
    });

    // Touch Virtual D-Pad
    document.getElementById('vUp').addEventListener('touchstart', (e) => { e.preventDefault(); audio.init(); if (inBattle) { selectedCmdIndex = (selectedCmdIndex + 3) % 4; updateCmdCursor(); } else movePlayer(0, -1, 0); });
    document.getElementById('vDown').addEventListener('touchstart', (e) => { e.preventDefault(); audio.init(); if (inBattle) { selectedCmdIndex = (selectedCmdIndex + 1) % 4; updateCmdCursor(); } else movePlayer(0, 1, 2); });
    document.getElementById('vLeft').addEventListener('touchstart', (e) => { e.preventDefault(); audio.init(); if (!inBattle) movePlayer(-1, 0, 3); });
    document.getElementById('vRight').addEventListener('touchstart', (e) => { e.preventDefault(); audio.init(); if (!inBattle) movePlayer(1, 0, 1); });

    document.getElementById('vBtnA').addEventListener('touchstart', (e) => { e.preventDefault(); audio.init(); handleConfirmAction(); });
    document.getElementById('vBtnB').addEventListener('touchstart', (e) => {
      e.preventDefault();
      audio.init();
      if (isDialogueActive) closeDialogue();
      if (!dom.battleSubBox.classList.contains('hidden')) dom.battleSubBox.classList.add('hidden');
    });

    // Audio ON/OFF Button
    dom.btnSoundToggle.onclick = () => {
      const on = audio.toggleAudio();
      dom.btnSoundToggle.innerText = on ? "🔊 BGM: ON" : "🔇 BGM: OFF";
      dom.btnSoundToggle.classList.toggle('bg-green-800', on);
      if (on) audio.startBgm(inBattle ? 'battle' : 'field');
    };

    // Save Game to LocalStorage
    dom.btnQuickSave.onclick = () => {
      const saveData = {
        playerX, playerY, playerDir, currentMapId, gold,
        party: party.map(p => ({
          hp: p.hp, maxHp: p.maxHp, mp: p.mp, maxMp: p.maxMp,
          atk: p.atk, def: p.def, lv: p.lv, exp: p.exp, joined: p.joined
        }))
      };
      localStorage.setItem('OH_LOVE_QUEST_SAVE', JSON.stringify(saveData));
      audio.playInnJingle();
      alert("【ぼうけんのしょ】に きろくしました！\n次回アクセス時もここから再開できます。");
    };

    // Load Game from LocalStorage
    function loadGame() {
      const raw = localStorage.getItem('OH_LOVE_QUEST_SAVE');
      if (raw) {
        try {
          const data = JSON.parse(raw);
          playerX = data.playerX;
          playerY = data.playerY;
          playerDir = data.playerDir;
          currentMapId = data.currentMapId;
          gold = data.gold;
          data.party.forEach((saved, idx) => {
            Object.assign(party[idx], saved);
          });
        } catch(e) {}
      }
    }

    // Initialize Game Engine on Window Load
    window.addEventListener('load', () => {
      loadGame();
      updatePartyStatusUI();
      renderWorld();
      dom.locationBadge.innerText = currentMapId === "town" ? "[ロックン・タウン]" : currentMapId === "dungeon" ? "[愛と虚無の洞窟]" : "[フィールド]";
    });
  </script>
</body>
</html>
