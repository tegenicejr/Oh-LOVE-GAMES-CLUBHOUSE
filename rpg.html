<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Oh LOVE QUEST</title>
  <style>
    :root {
      --bg-desk: #110c08;
      --felt-dark: #122c19;
      --felt-light: #1c4528;
      --board-rim: #362214;
      --brass-gold: #d4a359;
      --brass-glow: rgba(212, 163, 89, 0.45);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: var(--bg-desk);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", sans-serif;
      color: #fff;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .viewport {
      width: 100%;
      min-height: 100%;
      padding: calc(14px + env(safe-area-inset-top)) 8px calc(60px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      align-items: center;
      background: radial-gradient(circle at 50% 20%, #2b1a10 0%, var(--bg-desk) 100%);
      position: relative;
    }

    .topbar {
      width: 100%;
      max-width: 440px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding: 0 4px;
    }
    .stat-badge {
      background: rgba(0, 0, 0, 0.65);
      border: 1.5px solid #442d1c;
      border-radius: 14px;
      padding: 5px 12px;
      font-size: 0.85rem;
      font-weight: 700;
      color: #d1c1b2;
      display: flex;
      align-items: center;
      gap: 5px;
      box-shadow: inset 0 2px 5px rgba(0,0,0,0.8);
    }
    .stat-val {
      color: var(--brass-gold);
      font-size: 1.05rem;
      font-weight: 900;
      font-feature-settings: "tnum";
    }

    .table-felt {
      position: relative;
      width: 100%;
      max-width: 440px;
      background: radial-gradient(circle at 50% 35%, var(--felt-light) 0%, var(--felt-dark) 100%);
      border: 8px solid var(--board-rim);
      border-radius: 20px;
      padding: 16px 12px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.95), inset 0 2px 4px rgba(255,255,255,0.1), inset 0 0 35px rgba(0,0,0,0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    /* ゲーム画面枠（マップ or バトル） */
    .screen-view {
      width: 320px;
      height: 320px;
      background: #000;
      border: 3px solid #4d3320;
      border-radius: 12px;
      position: relative;
      overflow: hidden;
      box-shadow: 0 10px 20px rgba(0,0,0,0.8);
    }

    /* フィールドマップ (10x10) */
    .map-grid {
      display: grid;
      grid-template-columns: repeat(10, 32px);
      grid-template-rows: repeat(10, 32px);
      width: 320px;
      height: 320px;
    }
    .map-cell {
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.25rem;
    }
    .tile-grass { background: #1c3b24; }
    .tile-forest { background: #0f2415; }
    .tile-mountain { background: #3a2a1d; }
    .tile-castle { background: #4a1515; }

    /* バトル画面 */
    .battle-view {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at 50% 40%, #2c1a14 0%, #0d0705 100%);
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: space-around;
      padding: 16px;
      z-index: 50;
    }
    .battle-view.active { display: flex; }
    .enemy-sprite {
      font-size: 4rem;
      filter: drop-shadow(0 6px 12px rgba(0,0,0,0.8));
      transition: transform 0.1s ease;
    }
    .enemy-sprite.hit {
      animation: hitShake 0.2s ease-in-out;
    }
    @keyframes hitShake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-10px); }
      75% { transform: translateX(10px); }
    }
    .enemy-hp-bar {
      width: 140px;
      height: 8px;
      background: #331f13;
      border: 1px solid #5a3d28;
      border-radius: 4px;
      overflow: hidden;
      margin-top: 4px;
    }
    .enemy-hp-fill {
      height: 100%;
      background: #e74c3c;
      width: 100%;
      transition: width 0.2s ease;
    }

    /* メッセージウィンドウ */
    .msg-window {
      width: 100%;
      max-width: 320px;
      height: 64px;
      background: rgba(14, 9, 6, 0.95);
      border: 2px solid #583c27;
      border-radius: 10px;
      padding: 8px 12px;
      font-size: 0.85rem;
      line-height: 1.4;
      color: #ede2d5;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.7);
    }

    /* コントローラー (十字キー / バトルコマンド) */
    .control-panel {
      width: 100%;
      max-width: 320px;
      min-height: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* フィールド用十字キー */
    .d-pad {
      display: grid;
      grid-template-columns: repeat(3, 44px);
      grid-template-rows: repeat(3, 44px);
      gap: 4px;
    }
    .d-btn {
      background: linear-gradient(145deg, #2c1c12, #1a0f08);
      border: 1.5px solid #4d3320;
      color: var(--brass-gold);
      border-radius: 8px;
      font-size: 1.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(0,0,0,0.6);
    }
    .d-btn:active { transform: scale(0.92); }

    /* バトルコマンドボタン */
    .battle-commands {
      display: none;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      width: 100%;
    }
    .battle-commands.active { display: grid; }
    .cmd-btn {
      background: linear-gradient(180deg, #3a2215, #221208);
      border: 2px solid var(--brass-gold);
      border-radius: 10px;
      color: #fff;
      padding: 10px;
      font-size: 0.9rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 0 4px 8px rgba(0,0,0,0.6);
    }
    .cmd-btn:active { transform: scale(0.95); }
  </style>
</head>
<body>

  <div class="viewport">
    <div class="topbar">
      <div class="stat-badge">LV <span id="stat-lv" class="stat-val">1</span></div>
      <div class="stat-badge">HP <span id="stat-hp" class="stat-val">30/30</span></div>
      <div class="stat-badge">MP <span id="stat-mp" class="stat-val">10/10</span></div>
      <div class="stat-badge">EXP <span id="stat-exp" class="stat-val">0</span></div>
    </div>

    <div class="table-felt">
      <!-- 画面表示エリア -->
      <div class="screen-view">
        <div id="map-grid" class="map-grid"></div>

        <!-- バトルオーバーレイ -->
        <div id="battle-view" class="battle-view">
          <div style="text-align:center;">
            <div id="enemy-sprite" class="enemy-sprite">👾</div>
            <div style="font-weight:800; font-size:0.95rem; margin-top:4px;" id="enemy-name">スライム</div>
            <div class="enemy-hp-bar">
              <div id="enemy-hp-fill" class="enemy-hp-fill"></div>
            </div>
          </div>
        </div>
      </div>

      <!-- メッセージ枠 -->
      <div class="msg-window" id="msg-window">
        魔王の城を目指せ！草むらや森を探索してレベルを上げよう。
      </div>

      <!-- コントローラー枠 -->
      <div class="control-panel">
        <!-- 移動用十字キー -->
        <div class="d-pad" id="d-pad">
          <div></div>
          <button class="d-btn" onclick="movePlayer(0, -1)">▲</button>
          <div></div>
          <button class="d-btn" onclick="movePlayer(-1, 0)">◀</button>
          <div style="background:#20140b; border-radius:6px;"></div>
          <button class="d-btn" onclick="movePlayer(1, 0)">▶</button>
          <div></div>
          <button class="d-btn" onclick="movePlayer(0, 1)">▼</button>
          <div></div>
        </div>

        <!-- バトル用コマンド -->
        <div class="battle-commands" id="battle-commands">
          <button class="cmd-btn" onclick="battleAction('attack')">⚔️ こうげき</button>
          <button class="cmd-btn" onclick="battleAction('magic')">🔥 まほう (4MP)</button>
          <button class="cmd-btn" onclick="battleAction('heal')">💖 ホイミ (3MP)</button>
          <button class="cmd-btn" onclick="battleAction('run')">🏃 にげる</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    let audioCtx = null;
    function getAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }
    window.addEventListener('pointerdown', () => getAudio(), { once: true });

    function playTone(freq, type = 'square', duration = 0.08) {
      try {
        const ctx = getAudio();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        gain.gain.setValueAtTime(0.18, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + duration + 0.01);
      } catch(e) {}
    }

    // プレイヤーデータ
    const player = {
      x: 1, y: 8,
      lv: 1,
      hp: 30, maxHp: 30,
      mp: 10, maxMp: 10,
      atk: 10,
      exp: 0, nextExp: 15
    };

    // 10x10 マップ (0: 草, 1: 森, 2: 山, 3: 城/ボス, 4: 宝箱)
    const map = [
      [2, 2, 2, 2, 2, 2, 2, 2, 3, 2],
      [2, 1, 1, 1, 2, 1, 1, 2, 0, 2],
      [2, 1, 4, 1, 2, 1, 1, 0, 0, 2],
      [2, 1, 1, 1, 0, 0, 1, 1, 0, 2],
      [2, 2, 0, 2, 2, 0, 2, 2, 0, 2],
      [2, 0, 0, 0, 2, 0, 0, 1, 1, 2],
      [2, 0, 1, 0, 0, 0, 0, 1, 4, 2],
      [2, 0, 1, 1, 0, 1, 0, 0, 0, 2],
      [2, 0, 0, 0, 0, 1, 1, 0, 0, 2],
      [2, 2, 2, 2, 2, 2, 2, 2, 2, 2],
    ];

    let gameState = 'field'; // 'field' | 'battle'
    let currentEnemy = null;

    const ENEMIES = [
      { name: 'スライム', sprite: '💧', hp: 16, atk: 6, exp: 6 },
      { name: 'ゴブリン', sprite: '👺', hp: 28, atk: 10, exp: 14 },
      { name: 'ドラゴン', sprite: '🐲', hp: 55, atk: 18, exp: 35 },
      { name: '魔王', sprite: '😈', hp: 120, atk: 25, exp: 999, isBoss: true }
    ];

    window.addEventListener('DOMContentLoaded', () => {
      renderMap();
      updateUI();
      window.addEventListener('keydown', handleKey);
    });

    function showMsg(text) {
      document.getElementById('msg-window').innerHTML = text;
    }

    function updateUI() {
      document.getElementById('stat-lv').textContent = player.lv;
      document.getElementById('stat-hp').textContent = `${player.hp}/${player.maxHp}`;
      document.getElementById('stat-mp').textContent = `${player.mp}/${player.maxMp}`;
      document.getElementById('stat-exp').textContent = `${player.exp}/${player.nextExp}`;
    }

    function renderMap() {
      const grid = document.getElementById('map-grid');
      grid.innerHTML = '';
      for (let y = 0; y < 10; y++) {
        for (let x = 0; x < 10; x++) {
          const cell = document.createElement('div');
          cell.className = 'map-cell';
          const type = map[y][x];

          if (type === 0) cell.classList.add('tile-grass');
          else if (type === 1) cell.classList.add('tile-forest');
          else if (type === 2) cell.classList.add('tile-mountain');
          else if (type === 3) cell.classList.add('tile-castle');
          else if (type === 4) cell.classList.add('tile-grass');

          if (x === player.x && y === player.y) {
            cell.textContent = '🧙‍♂️';
          } else if (type === 3) {
            cell.textContent = '🏰';
          } else if (type === 4) {
            cell.textContent = '🎁';
          }
          grid.appendChild(cell);
        }
      }
    }

    function movePlayer(dx, dy) {
      if (gameState !== 'field') return;
      const nx = player.x + dx;
      const ny = player.y + dy;

      if (nx < 0 || nx >= 10 || ny < 0 || ny >= 10) return;
      if (map[ny][nx] === 2) {
        playTone(150, 'sawtooth');
        showMsg('険しい山だ！通れない。');
        return;
      }

      player.x = nx;
      player.y = ny;
      playTone(300, 'square', 0.04);
      renderMap();

      // 宝箱イベント
      if (map[ny][nx] === 4) {
        map[ny][nx] = 0;
        player.maxHp += 10;
        player.hp = player.maxHp;
        player.maxMp += 5;
        player.mp = player.maxMp;
        player.atk += 5;
        playTone(600, 'sine', 0.15);
        showMsg('宝箱を開けた！「英雄の腕輪」を手に入れた！ステータスがアップし全回復！');
        updateUI();
        renderMap();
        return;
      }

      // ボス城突入
      if (map[ny][nx] === 3) {
        startBattle(ENEMIES[3]);
        return;
      }

      // ランダムエンカウント (森は確率高め)
      const encChance = (map[ny][nx] === 1) ? 0.35 : 0.15;
      if (Math.random() < encChance) {
        const pool = (map[ny][nx] === 1) ? [0, 1, 2] : [0, 1];
        const chosen = pool[Math.floor(Math.random() * pool.length)];
        startBattle(ENEMIES[chosen]);
      }
    }

    function startBattle(enemyTemplate) {
      gameState = 'battle';
      currentEnemy = { ...enemyTemplate, currentHp: enemyTemplate.hp };

      document.getElementById('battle-view').classList.add('active');
      document.getElementById('d-pad').style.display = 'none';
      document.getElementById('battle-commands').classList.add('active');

      document.getElementById('enemy-sprite').textContent = currentEnemy.sprite;
      document.getElementById('enemy-name').textContent = currentEnemy.name;
      updateEnemyHpUI();

      playTone(220, 'sawtooth', 0.2);
      showMsg(`${currentEnemy.name} があらわれた！`);
    }

    function updateEnemyHpUI() {
      const pct = Math.max(0, (currentEnemy.currentHp / currentEnemy.hp) * 100);
      document.getElementById('enemy-hp-fill').style.width = pct + '%';
    }

    function battleAction(action) {
      if (gameState !== 'battle') return;

      if (action === 'attack') {
        const dmg = Math.floor(player.atk * (0.9 + Math.random() * 0.3));
        currentEnemy.currentHp -= dmg;
        playTone(450, 'sawtooth');
        shakeEnemy();
        showMsg(`あなたの攻撃！ ${currentEnemy.name} に ${dmg} のダメージ！`);
      } else if (action === 'magic') {
        if (player.mp < 4) {
          showMsg('MPが足りない！');
          return;
        }
        player.mp -= 4;
        updateUI();
        const dmg = Math.floor(player.atk * 1.8);
        currentEnemy.currentHp -= dmg;
        playTone(650, 'sine', 0.15);
        shakeEnemy();
        showMsg(`メラの呪文を放った！ ${currentEnemy.name} に ${dmg} の大ダメージ！`);
      } else if (action === 'heal') {
        if (player.mp < 3) {
          showMsg('MPが足りない！');
          return;
        }
        player.mp -= 3;
        player.hp = Math.min(player.maxHp, player.hp + 25);
        updateUI();
        playTone(550, 'sine', 0.15);
        showMsg('ホイミ！傷が癒えてHPが25回復した！');
      } else if (action === 'run') {
        if (currentEnemy.isBoss) {
          showMsg('魔王の前からは逃げられない！');
        } else if (Math.random() < 0.6) {
          playTone(350, 'square');
          endBattle('うまく逃げ切れた！');
          return;
        } else {
          showMsg('逃げ切れなかった！');
        }
      }

      updateEnemyHpUI();

      // 敵撃破チェック
      if (currentEnemy.currentHp <= 0) {
        setTimeout(winBattle, 500);
        return;
      }

      // 敵のターン
      setTimeout(enemyTurn, 700);
    }

    function shakeEnemy() {
      const sp = document.getElementById('enemy-sprite');
      sp.classList.add('hit');
      setTimeout(() => sp.classList.remove('hit'), 200);
    }

    function enemyTurn() {
      if (gameState !== 'battle') return;
      const dmg = Math.max(1, Math.floor(currentEnemy.atk * (0.8 + Math.random() * 0.4)));
      player.hp = Math.max(0, player.hp - dmg);
      updateUI();
      playTone(180, 'sawtooth', 0.15);

      if (player.hp <= 0) {
        showMsg(`${currentEnemy.name} の痛恨の一撃！ ${dmg} のダメージを受けた…あなたは倒れてしまった。`);
        setTimeout(() => {
          alert('ゲームオーバー！宿屋で目覚めました。');
          player.hp = player.maxHp;
          player.mp = player.maxMp;
          player.x = 1; player.y = 8;
          endBattle('体勢を立て直して再出発しよう。');
        }, 800);
      } else {
        showMsg(`${currentEnemy.name} の攻撃！ ${dmg} のダメージを受けた！`);
      }
    }

    function winBattle() {
      playTone(880, 'sine', 0.25);
      if (currentEnemy.isBoss) {
        alert('🎉 魔王を討伐した！世界に平和が訪れた！【GAME CLEAR】');
        location.reload();
        return;
      }

      player.exp += currentEnemy.exp;
      let msg = `${currentEnemy.name} を倒した！ ${currentEnemy.exp} の経験値を獲得！`;

      if (player.exp >= player.nextExp) {
        player.lv++;
        player.maxHp += 8;
        player.hp = player.maxHp;
        player.maxMp += 4;
        player.mp = player.maxMp;
        player.atk += 4;
        player.exp -= player.nextExp;
        player.nextExp = Math.floor(player.nextExp * 1.5);
        msg += ` レベルが ${player.lv} に上がった！`;
      }

      updateUI();
      endBattle(msg);
    }

    function endBattle(afterMsg) {
      gameState = 'field';
      currentEnemy = null;
      document.getElementById('battle-view').classList.remove('active');
      document.getElementById('battle-commands').classList.remove('active');
      document.getElementById('d-pad').style.display = 'grid';
      showMsg(afterMsg);
      renderMap();
    }

    function handleKey(e) {
      if (gameState === 'field') {
        if (e.key === 'ArrowUp' || e.key === 'w') movePlayer(0, -1);
        if (e.key === 'ArrowDown' || e.key === 's') movePlayer(0, 1);
        if (e.key === 'ArrowLeft' || e.key === 'a') movePlayer(-1, 0);
        if (e.key === 'ArrowRight' || e.key === 'd') movePlayer(1, 0);
      }
    }
  </script>
</body>
</html>
