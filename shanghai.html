<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>上海 (Shanghai / Mahjong Solitaire)</title>
  <style>
    :root {
      --bg-desk: #110c08;
      --felt-dark: #122c19;
      --felt-light: #1c4528;
      --board-rim: #362214;
      --brass-gold: #d4a359;
      --brass-glow: rgba(212, 163, 89, 0.45);
      --tile-w: 36px;
      --tile-h: 48px;
      --unit-x: 18px; /* tile-w / 2 */
      --unit-y: 24px; /* tile-h / 2 */
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: var(--bg-desk);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", sans-serif;
      color: #fff;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .viewport {
      width: 100%;
      min-height: 100%;
      padding: calc(14px + env(safe-area-inset-top)) 6px calc(60px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      align-items: center;
      background: radial-gradient(circle at 50% 20%, #2b1a10 0%, var(--bg-desk) 100%);
      position: relative;
    }

    .topbar {
      width: 100%;
      max-width: 680px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 12px;
      padding: 0 4px;
    }
    .topbar-upper {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }
    .tool-btn {
      background: linear-gradient(145deg, #2c1c12 0%, #1c1109 100%);
      border: 1.5px solid #4d3320;
      color: var(--brass-gold);
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.7), inset 0 1px 1px rgba(255,255,255,0.15);
      transition: transform 0.12s, border-color 0.12s;
    }
    .tool-btn:hover { border-color: var(--brass-gold); transform: translateY(-2px); }
    .tool-btn:active { transform: scale(0.92); }

    .topbar-lower {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 2px;
      flex-wrap: wrap;
      gap: 6px;
    }
    .stats-group {
      display: flex;
      gap: 8px;
      align-items: center;
    }
    .stat-badge {
      background: rgba(0, 0, 0, 0.65);
      border: 1.5px solid #442d1c;
      border-radius: 14px;
      padding: 5px 12px;
      font-size: 0.85rem;
      font-weight: 700;
      color: #d1c1b2;
      display: flex;
      align-items: center;
      gap: 5px;
      box-shadow: inset 0 2px 5px rgba(0,0,0,0.8);
      white-space: nowrap;
    }
    .stat-val {
      color: var(--brass-gold);
      font-size: 1.15rem;
      font-weight: 900;
      font-feature-settings: "tnum";
    }

    .table-felt {
      position: relative;
      width: 100%;
      max-width: 680px;
      background: radial-gradient(circle at 50% 35%, var(--felt-light) 0%, var(--felt-dark) 100%);
      border: 8px solid var(--board-rim);
      border-radius: 20px;
      padding: 18px 8px 30px;
      box-shadow: 0 24px 60px rgba(0,0,0,0.95), inset 0 2px 4px rgba(255,255,255,0.1), inset 0 0 35px rgba(0,0,0,0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: auto;
      touch-action: manipulation;
    }

    /* 3D牌ピラミッドステージ */
    .shanghai-stage {
      position: relative;
      width: calc(30 * var(--unit-x)); /* 540px */
      height: calc(18 * var(--unit-y)); /* 432px */
      margin: 10px auto;
    }

    @media (max-width: 580px) {
      :root {
        --tile-w: 26px;
        --tile-h: 36px;
        --unit-x: 13px;
        --unit-y: 18px;
      }
    }

    /* リアル立体麻雀牌 */
    .mj-tile {
      position: absolute;
      width: var(--tile-w);
      height: var(--tile-h);
      background: linear-gradient(180deg, #ffffff 0%, #faf6ec 60%, #e6dccb 100%);
      border-radius: 5px;
      border-top: 1px solid #ffffff;
      border-left: 1px solid #ffffff;
      border-right: 2px solid #b3a48e;
      border-bottom: 4px solid #7a6b57;
      box-shadow: 0 4px 8px rgba(0,0,0,0.5), inset 0 1px 1px #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      font-family: "Hiragino Mincho ProN", "Yu Mincho", "MS PMincho", serif;
      font-weight: 900;
      transition: transform 0.12s, box-shadow 0.12s, filter 0.12s;
    }

    .mj-tile.blocked {
      filter: brightness(0.68) saturate(0.85);
      cursor: not-allowed;
    }

    .mj-tile.selected {
      transform: translateY(-5px) !important;
      border-color: var(--brass-gold);
      box-shadow: 0 10px 18px rgba(0,0,0,0.7), 0 0 12px var(--brass-glow) !important;
      z-index: 9999 !important;
    }

    .mj-tile.hinted {
      animation: hintPulse 0.75s infinite alternate ease-in-out;
      box-shadow: 0 0 12px #2ecc71 !important;
    }
    @keyframes hintPulse {
      from { transform: translateY(0); }
      to { transform: translateY(-4px); }
    }

    /* 牌の図柄文字 */
    .tile-glyph {
      font-size: calc(var(--tile-w) * 0.58);
      line-height: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }
    .color-man { color: #c0392b; }
    .color-pin { color: #2980b9; }
    .color-sou { color: #27ae60; }
    .color-chun { color: #c0392b; }
    .color-hatsu { color: #1e824c; }
    .color-haku { color: #2c3e50; }
    .color-wind { color: #1e272e; }

    .ranking-container {
      width: 100%;
      max-width: 680px;
      margin-top: 20px;
      background: rgba(22, 14, 9, 0.85);
      border: 2px solid #3d2919;
      border-radius: 16px;
      padding: 14px 16px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.8);
    }
    .ranking-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1.5px solid #4a3422;
      padding-bottom: 8px;
      margin-bottom: 10px;
    }
    .ranking-title {
      font-size: 0.95rem;
      font-weight: 800;
      color: var(--brass-gold);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .ranking-list {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 6px 14px;
    }
    @media (max-width: 480px) {
      .ranking-list { grid-template-columns: 1fr; }
    }
    .ranking-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0,0,0,0.3);
      padding: 5px 10px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-feature-settings: "tnum";
    }
    .ranking-rank { font-weight: 800; color: #8c7664; width: 28px; }
    .ranking-rank.top1 { color: #f1c40f; }
    .ranking-rank.top2 { color: #bdc3c7; }
    .ranking-rank.top3 { color: #e67e22; }
    .ranking-time { font-weight: 800; color: #f5ebe1; }
    .ranking-date { color: #7d6b5c; font-size: 0.72rem; }
    .ranking-empty {
      text-align: center;
      color: #7d6b5c;
      font-size: 0.82rem;
      padding: 12px 0;
      grid-column: span 2;
    }

    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.82);
      backdrop-filter: blur(5px);
      z-index: 99999;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.active { display: flex; }
    .modal-sheet {
      background: #20140c;
      border: 3px solid #4d3320;
      border-radius: 20px;
      padding: 22px;
      width: 88%;
      max-width: 440px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.95);
      color: #ede2d5;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
    }
    .modal-title {
      text-align: center;
      color: var(--brass-gold);
      font-size: 1.25rem;
      font-weight: 800;
      margin-bottom: 14px;
    }
    .modal-body {
      overflow-y: auto;
      font-size: 0.86rem;
      line-height: 1.6;
      color: #c9b9aa;
      margin-bottom: 16px;
      padding-right: 6px;
    }
    .modal-close-btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(180deg, #d4a359, #aa782e);
      border: none;
      border-radius: 12px;
      color: #140c06;
      font-weight: 900;
      font-size: 0.95rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="viewport">
    <div class="topbar">
      <div class="topbar-upper">
        <div class="tool-btn" onclick="restartGame()" title="最初から">🔄</div>
        <div class="tool-btn" onclick="undoMove()" title="1手戻す">↩️</div>
        <div class="tool-btn" onclick="getHint()" title="ヒント">💡</div>
        <div class="tool-btn" onclick="toggleRulesModal(true)" title="あそびかた">📖</div>
      </div>

      <div class="topbar-lower">
        <div class="stats-group">
          <div class="stat-badge">残り <span id="stat-remaining" class="stat-val">144</span></div>
          <div class="stat-badge">取れる手 <span id="stat-pairs" class="stat-val">0</span></div>
        </div>
        <div class="stats-group">
          <div class="stat-badge">⏱️ <span id="stat-timer" class="stat-val">00:00</span></div>
          <div class="stat-badge" style="color:var(--brass-gold);">古典ピラミッド</div>
        </div>
      </div>
    </div>

    <!-- フェルト卓 -->
    <div class="table-felt">
      <div class="shanghai-stage" id="shanghai-stage"></div>
    </div>

    <!-- ランキングボード -->
    <div class="ranking-container">
      <div class="ranking-header">
        <div class="ranking-title">🏆 クリアタイム TOP 10</div>
      </div>
      <div id="ranking-list" class="ranking-list"></div>
    </div>
  </div>

  <!-- ルールモーダル -->
  <div id="modal-rules" class="modal-overlay">
    <div class="modal-sheet">
      <div class="modal-title">📖 上海のあそびかた</div>
      <div class="modal-body">
        <p>山型に積み上げられた144枚の麻雀牌から、同じ絵柄の牌を2枚選んで消していき、すべて取り除くパズルゲームです。</p>
        <br>
        <b style="color:var(--brass-gold);">【牌を取れる条件】</b>
        <ul style="padding-left:18px; margin:6px 0;">
          <li><b>上に牌が乗っていないこと</b>（完全にフリーな状態）。</li>
          <li><b>左右のどちらかが空いていること</b>（左または右に隣接する牌がない）。</li>
        </ul>
        <br>
        <b style="color:var(--brass-gold);">【ヒントと詰み】</b>
        <ul style="padding-left:18px; margin:6px 0;">
          <li>取れる手が見つからない時は「💡」ヒントボタンを押すとペアを教えてくれます。</li>
          <li>取れる手がなくなったら（詰み）、1手戻すか最初から配り直してください。</li>
        </ul>
      </div>
      <button class="modal-close-btn" onclick="toggleRulesModal(false)">閉じる</button>
    </div>
  </div>

  <script>
    let audioCtx = null;
    function getAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }
    window.addEventListener('pointerdown', () => getAudio(), { once: true });

    function playTileClickSound() {
      try {
        const ctx = getAudio();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(480, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(160, ctx.currentTime + 0.04);
        gain.gain.setValueAtTime(0.2, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.04);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.05);
      } catch(e) {}
    }

    function playMatchSound() {
      try {
        const ctx = getAudio();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, ctx.currentTime);
        osc.frequency.setValueAtTime(880, ctx.currentTime + 0.05);
        gain.gain.setValueAtTime(0.18, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.14);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.15);
      } catch(e) {}
    }

    function playFanfareSound() {
      try {
        const ctx = getAudio();
        [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.08);
          gain.gain.setValueAtTime(0.2, ctx.currentTime + idx * 0.08);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + idx * 0.08 + 0.25);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + idx * 0.08);
          osc.stop(ctx.currentTime + idx * 0.08 + 0.26);
        });
      } catch(e) {}
    }

    // 牌定義（34種 × 4 = 136 + 季節花4 = 140 ... 正式上海は144枚）
    const TILE_TYPES = [
      { id: 'm1', label: '一萬', color: 'color-man' }, { id: 'm2', label: '二萬', color: 'color-man' },
      { id: 'm3', label: '三萬', color: 'color-man' }, { id: 'm4', label: '四萬', color: 'color-man' },
      { id: 'm5', label: '五萬', color: 'color-man' }, { id: 'm6', label: '六萬', color: 'color-man' },
      { id: 'm7', label: '七萬', color: 'color-man' }, { id: 'm8', label: '八萬', color: 'color-man' },
      { id: 'm9', label: '九萬', color: 'color-man' },
      { id: 'p1', label: '①', color: 'color-pin' }, { id: 'p2', label: '②', color: 'color-pin' },
      { id: 'p3', label: '③', color: 'color-pin' }, { id: 'p4', label: '④', color: 'color-pin' },
      { id: 'p5', label: '⑤', color: 'color-pin' }, { id: 'p6', label: '⑥', color: 'color-pin' },
      { id: 'p7', label: '⑦', color: 'color-pin' }, { id: 'p8', label: '⑧', color: 'color-pin' },
      { id: 'p9', label: '⑨', color: 'color-pin' },
      { id: 's1', label: '1索', color: 'color-sou' }, { id: 's2', label: '2索', color: 'color-sou' },
      { id: 's3', label: '3索', color: 'color-sou' }, { id: 's4', label: '4索', color: 'color-sou' },
      { id: 's5', label: '5索', color: 'color-sou' }, { id: 's6', label: '6索', color: 'color-sou' },
      { id: 's7', label: '7索', color: 'color-sou' }, { id: 's8', label: '8索', color: 'color-sou' },
      { id: 's9', label: '9索', color: 'color-sou' },
      { id: 'ton', label: '東', color: 'color-wind' }, { id: 'nan', label: '南', color: 'color-wind' },
      { id: 'sha', label: '西', color: 'color-wind' }, { id: 'pei', label: '北', color: 'color-wind' },
      { id: 'haku', label: '白', color: 'color-haku' }, { id: 'hatsu', label: '發', color: 'color-hatsu' },
      { id: 'chun', label: '中', color: 'color-chun' },
      { id: 'f1', label: '春', color: 'color-man' }, { id: 'f2', label: '夏', color: 'color-sou' }
    ];

    // 上海（Turtle / ピラミッド配置: 144枚の座標 [x, y, z]）
    // 各牌は幅2単位(36px)、高さ2単位(48px)
    function getShanghaiLayout() {
      const pos = [];
      // Layer 0: ベース（87枚）
      for (let x = 2; x <= 24; x += 2) {
        pos.push([x, 1, 0], [x, 13, 0]);
      }
      for (let x = 6; x <= 20; x += 2) {
        pos.push([x, 3, 0], [x, 11, 0]);
      }
      for (let x = 4; x <= 22; x += 2) {
        pos.push([x, 5, 0], [x, 9, 0]);
      }
      for (let x = 2; x <= 24; x += 2) {
        pos.push([x, 7, 0]);
      }
      // 左右の飛び出た牌
      pos.push([0, 7, 0], [26, 7, 0], [28, 7, 0]);

      // Layer 1 (36枚: 6x6)
      for (let x = 8; x <= 18; x += 2) {
        for (let y = 4; y <= 10; y += 2) {
          pos.push([x, y, 1]);
        }
      }

      // Layer 2 (16枚: 4x4)
      for (let x = 10; x <= 16; x += 2) {
        for (let y = 5; y <= 9; y += 2) {
          pos.push([x, y, 2]);
        }
      }

      // Layer 3 (4枚: 2x2)
      for (let x = 12; x <= 14; x += 2) {
        for (let y = 6; y <= 8; y += 2) {
          pos.push([x, y, 3]);
        }
      }

      // Layer 4 (頂点 1枚)
      pos.push([13, 7, 4]);

      return pos.slice(0, 144);
    }

    let tiles = []; // { id, x, y, z, type, elem }
    let selectedTile = null;
    let historyStack = [];
    let timerInterval = null;
    let secondsElapsed = 0;

    window.addEventListener('DOMContentLoaded', () => {
      initGame();
    });

    function startTimer() {
      stopTimer();
      secondsElapsed = 0;
      updateTimerUI();
      timerInterval = setInterval(() => {
        secondsElapsed++;
        updateTimerUI();
      }, 1000);
    }

    function stopTimer() {
      if (timerInterval) clearInterval(timerInterval);
      timerInterval = null;
    }

    function updateTimerUI() {
      const m = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
      const s = String(secondsElapsed % 60).padStart(2, '0');
      document.getElementById('stat-timer').textContent = `${m}:${s}`;
    }

    function initGame() {
      const layout = getShanghaiLayout();

      // 144枚の牌デッキ生成（4枚ずつのペア）
      let deck = [];
      TILE_TYPES.forEach(t => {
        deck.push(t, t, t, t);
      });
      deck = deck.slice(0, 144);
      deck.sort(() => Math.random() - 0.5);

      tiles = layout.map((pos, idx) => ({
        uid: idx,
        x: pos[0],
        y: pos[1],
        z: pos[2],
        type: deck[idx],
        removed: false
      }));

      selectedTile = null;
      historyStack = [];

      renderBoard();
      updatePlayableStates();
      renderRanking();
      startTimer();
    }

    // 牌がオープン（取れる）状態か判定
    function isTileFree(t) {
      if (t.removed) return false;

      // 1. 上に重なる牌があるか (z + 1 で |dx| < 2 かつ |dy| < 2)
      const hasOnTop = tiles.some(other => 
        !other.removed &&
        other.z > t.z &&
        Math.abs(other.x - t.x) < 2 &&
        Math.abs(other.y - t.y) < 2
      );
      if (hasOnTop) return false;

      // 2. 左または右が塞がれているか
      // 同一レイヤー (z) で、左右隣接 (|dy| < 2 かつ dx = -2 または dx = +2)
      const hasLeft = tiles.some(other =>
        !other.removed &&
        other.z === t.z &&
        other.x === t.x - 2 &&
        Math.abs(other.y - t.y) < 2
      );

      const hasRight = tiles.some(other =>
        !other.removed &&
        other.z === t.z &&
        other.x === t.x + 2 &&
        Math.abs(other.y - t.y) < 2
      );

      return (!hasLeft || !hasRight);
    }

    function updatePlayableStates() {
      let openTiles = [];
      tiles.forEach(t => {
        if (!t.removed) {
          const free = isTileFree(t);
          if (free) openTiles.push(t);
          const el = document.getElementById(`tile-${t.uid}`);
          if (el) el.classList.toggle('blocked', !free);
        }
      });

      // 残り取れるペア数を算出
      let pairs = 0;
      for (let i = 0; i < openTiles.length; i++) {
        for (let j = i + 1; j < openTiles.length; j++) {
          if (openTiles[i].type.id === openTiles[j].type.id) {
            pairs++;
          }
        }
      }

      const remaining = tiles.filter(t => !t.removed).length;
      document.getElementById('stat-remaining').textContent = remaining;
      document.getElementById('stat-pairs').textContent = pairs;

      if (remaining === 0) {
        stopTimer();
        playFanfareSound();
        saveRankingRecord(secondsElapsed);
        renderRanking();
        setTimeout(() => {
          const m = String(Math.floor(secondsElapsed / 60)).padStart(2, '0');
          const s = String(secondsElapsed % 60).padStart(2, '0');
          alert(`🎉 壮観！すべての牌を取り除きました！完全クリア！\nタイム: ${m}:${s}`);
        }, 300);
      } else if (pairs === 0) {
        setTimeout(() => alert('⚠️ 取れる手がなくなりました（手詰まり）。1手戻すか最初からやり直してください。'), 200);
      }
    }

    function renderBoard() {
      const stage = document.getElementById('shanghai-stage');
      stage.innerHTML = '';

      tiles.forEach(t => {
        if (t.removed) return;

        const el = document.createElement('div');
        el.className = 'mj-tile';
        el.id = `tile-${t.uid}`;

        // 3D階層表現（上に行くほどシャドウを強調し右上にオフセット）
        const offsetX = t.z * 3;
        const offsetY = -t.z * 3;
        el.style.left = `calc(${t.x} * var(--unit-x) + ${offsetX}px)`;
        el.style.top = `calc(${t.y} * var(--unit-y) + ${offsetY}px)`;
        el.style.zIndex = t.z * 100 + t.y;

        el.innerHTML = `<span class="tile-glyph ${t.type.color}">${t.type.label}</span>`;
        el.onclick = () => onTileClick(t);

        stage.appendChild(el);
      });
    }

    function onTileClick(tile) {
      if (!isTileFree(tile)) return;

      playTileClickSound();

      if (!selectedTile) {
        selectedTile = tile;
        document.getElementById(`tile-${tile.uid}`).classList.add('selected');
        return;
      }

      if (selectedTile.uid === tile.uid) {
        document.getElementById(`tile-${tile.uid}`).classList.remove('selected');
        selectedTile = null;
        return;
      }

      // ペアマッチ判定
      if (selectedTile.type.id === tile.type.id) {
        historyStack.push([selectedTile.uid, tile.uid]);
        playMatchSound();

        selectedTile.removed = true;
        tile.removed = true;

        const el1 = document.getElementById(`tile-${selectedTile.uid}`);
        const el2 = document.getElementById(`tile-${tile.uid}`);
        if (el1) el1.remove();
        if (el2) el2.remove();

        selectedTile = null;
        updatePlayableStates();
      } else {
        document.getElementById(`tile-${selectedTile.uid}`).classList.remove('selected');
        selectedTile = tile;
        document.getElementById(`tile-${tile.uid}`).classList.add('selected');
      }
    }

    function undoMove() {
      if (historyStack.length === 0) return;
      const [id1, id2] = historyStack.pop();

      const t1 = tiles.find(t => t.uid === id1);
      const t2 = tiles.find(t => t.uid === id2);
      if (t1) t1.removed = false;
      if (t2) t2.removed = false;

      selectedTile = null;
      renderBoard();
      updatePlayableStates();
      playTileClickSound();
    }

    function getHint() {
      document.querySelectorAll('.mj-tile.hinted').forEach(el => el.classList.remove('hinted'));

      const freeTiles = tiles.filter(t => isTileFree(t));
      for (let i = 0; i < freeTiles.length; i++) {
        for (let j = i + 1; j < freeTiles.length; j++) {
          if (freeTiles[i].type.id === freeTiles[j].type.id) {
            const el1 = document.getElementById(`tile-${freeTiles[i].uid}`);
            const el2 = document.getElementById(`tile-${freeTiles[j].uid}`);
            if (el1) el1.classList.add('hinted');
            if (el2) el2.classList.add('hinted');
            return;
          }
        }
      }
      alert('取れるペアがありません！');
    }

    function saveRankingRecord(timeSec) {
      let records = [];
      try {
        records = JSON.parse(localStorage.getItem('ranking_shanghai')) || [];
      } catch(e) { records = []; }

      const d = new Date();
      const dateStr = `${d.getMonth() + 1}/${d.getDate()}`;
      records.push({ time: timeSec, date: dateStr });
      records.sort((a, b) => a.time - b.time);
      records = records.slice(0, 10);

      try {
        localStorage.setItem('ranking_shanghai', JSON.stringify(records));
      } catch(e) {}
    }

    function renderRanking() {
      const container = document.getElementById('ranking-list');
      container.innerHTML = '';

      let records = [];
      try {
        records = JSON.parse(localStorage.getItem('ranking_shanghai')) || [];
      } catch(e) { records = []; }

      if (records.length === 0) {
        container.innerHTML = `<div class="ranking-empty">まだ記録がありません。クリアしてランクインを目指そう！</div>`;
        return;
      }

      records.forEach((rec, idx) => {
        const item = document.createElement('div');
        item.className = 'ranking-item';
        const rankClass = idx === 0 ? 'top1' : idx === 1 ? 'top2' : idx === 2 ? 'top3' : '';
        const m = String(Math.floor(rec.time / 60)).padStart(2, '0');
        const s = String(rec.time % 60).padStart(2, '0');
        item.innerHTML = `
          <div style="display:flex; align-items:center; gap:8px;">
            <span class="ranking-rank ${rankClass}">${idx + 1}位</span>
            <span class="ranking-time">${m}:${s}</span>
          </div>
          <span class="ranking-date">${rec.date}</span>
        `;
        container.appendChild(item);
      });
    }

    function toggleRulesModal(show) {
      document.getElementById('modal-rules').classList.toggle('active', show);
    }
    function restartGame() {
      if (confirm('牌を積み直して新しく配りますか？')) initGame();
    }
  </script>
</body>
</html>
