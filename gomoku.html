<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>五目並べ (Gomoku)</title>
  <style>
    :root {
      --bg-desk: #110c08;
      --felt-dark: #122c19;
      --felt-light: #1c4528;
      --board-rim: #362214;
      --board-wood: #c48b48;
      --brass-gold: #d4a359;
      --brass-glow: rgba(212, 163, 89, 0.45);
    }
    * {
      box-sizing: border-box;
      margin: 0; padding: 0;
      user-select: none; -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100%; height: 100%;
      background: var(--bg-desk);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", sans-serif;
      color: #fff;
      overflow-x: hidden; overflow-y: auto;
    }
    .viewport {
      width: 100%; min-height: 100%;
      padding: calc(12px + env(safe-area-inset-top)) 8px calc(60px + env(safe-area-inset-bottom));
      display: flex; flex-direction: column; align-items: center;
      background: radial-gradient(circle at 50% 20%, #2b1a10 0%, var(--bg-desk) 100%);
    }
    .topbar {
      width: 100%; max-width: 440px;
      display: flex; flex-direction: column; gap: 8px;
      margin-bottom: 8px; padding: 0 4px;
    }
    .topbar-upper {
      display: flex; justify-content: flex-end; gap: 10px;
    }
    .tool-btn {
      background: linear-gradient(145deg, #2c1c12 0%, #1c1109 100%);
      border: 1.5px solid #4d3320;
      color: var(--brass-gold);
      width: 38px; height: 38px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem; cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.7);
    }
    .tool-btn:active { transform: scale(0.92); }
    .topbar-lower {
      display: flex; justify-content: space-between; align-items: center; padding: 0 2px;
    }
    .player-badges { display: flex; gap: 8px; }
    .role-badge {
      background: rgba(0, 0, 0, 0.7);
      border: 1.5px solid #442d1c;
      border-radius: 14px;
      padding: 5px 12px;
      font-size: 0.85rem; font-weight: 800; color: #d1c1b2;
      display: flex; align-items: center; gap: 6px;
    }
    .role-badge.turn-active {
      border-color: var(--brass-gold);
      box-shadow: 0 0 12px var(--brass-glow);
    }
    .stone-icon {
      width: 14px; height: 14px; border-radius: 50%;
    }
    .stone-icon.black {
      background: radial-gradient(circle at 35% 30%, #444, #111 70%, #000);
      border: 1px solid #555;
    }
    .stone-icon.white {
      background: radial-gradient(circle at 35% 30%, #fff, #ddd 70%, #bbb);
      border: 1px solid #eee;
    }
    .diff-badge {
      background: rgba(0,0,0,0.6);
      border: 1.5px solid #442d1c;
      border-radius: 12px;
      padding: 4px 10px;
      font-size: 0.78rem; color: var(--brass-gold); font-weight: 800;
    }
    .table-felt {
      position: relative;
      width: 100%; max-width: 440px;
      background: radial-gradient(circle at 50% 35%, var(--felt-light) 0%, var(--felt-dark) 100%);
      border: 6px solid var(--board-rim);
      border-radius: 20px;
      padding: 14px 10px 18px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.95), inset 0 0 35px rgba(0,0,0,0.85);
      display: flex; flex-direction: column; align-items: center; gap: 12px;
    }
    .turn-announcer {
      font-size: 0.95rem; font-weight: 800; color: #ede2d5; min-height: 24px;
    }
    /* 碁盤フレーム (13×13盤) */
    .goban-frame {
      width: 100%; max-width: 380px; aspect-ratio: 1;
      background: radial-gradient(circle at 50% 30%, #dfa561 0%, #a46f33 100%);
      border: 4px solid #4a3017;
      border-radius: 14px;
      box-shadow: 0 14px 30px rgba(0,0,0,0.85), inset 0 1px 2px rgba(255,255,255,0.4);
      padding: 10px;
    }
    #goban-svg {
      width: 100%; height: 100%; display: block;
    }
    .grid-line { stroke: #4e3215; stroke-width: 1.2; }
    .star-point { fill: #4e3215; }
    .hit-cell { fill: transparent; cursor: pointer; }
    .stone {
      cursor: pointer;
      filter: drop-shadow(0 3px 4px rgba(0,0,0,0.6));
    }
    .stone.win-stone {
      stroke: var(--brass-gold);
      stroke-width: 2.5;
      filter: drop-shadow(0 0 6px var(--brass-gold));
    }
    .modal-overlay {
      display: none; position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.82); z-index: 99999;
      align-items: center; justify-content: center;
    }
    .modal-overlay.active { display: flex; }
    .modal-sheet {
      background: #20140c; border: 3px solid #4d3320;
      border-radius: 20px; padding: 22px; width: 88%; max-width: 440px;
      color: #ede2d5;
    }
    .modal-title {
      text-align: center; color: var(--brass-gold);
      font-size: 1.25rem; font-weight: 800; margin-bottom: 14px;
    }
    .setting-item {
      display: flex; justify-content: space-between; align-items: center;
      padding: 12px 0; border-bottom: 1px solid #332014; font-size: 0.9rem;
    }
    .theme-select {
      background: #2c1a10; color: #fff; border: 1.5px solid var(--brass-gold);
      padding: 6px 12px; border-radius: 10px; font-weight: 700; outline: none;
    }
    .modal-close-btn {
      width: 100%; padding: 12px;
      background: linear-gradient(180deg, #d4a359, #aa782e);
      border: none; border-radius: 12px; color: #140c06;
      font-weight: 900; font-size: 0.95rem; cursor: pointer; margin-top: 14px;
    }
  </style>
</head>
<body>
  <div class="viewport">
    <div class="topbar">
      <div class="topbar-upper">
        <div class="tool-btn" onclick="toggleSettingsModal(true)">⚙️</div>
        <div class="tool-btn" onclick="initGame()">🔄</div>
        <div class="tool-btn" onclick="undoMove()">↩️</div>
        <div class="tool-btn" onclick="toggleRulesModal(true)">📖</div>
      </div>
      <div class="topbar-lower">
        <div class="player-badges">
          <div class="role-badge turn-active" id="badge-black">
            <div class="stone-icon black"></div>
            <span id="label-black">黒 (先手)</span>
          </div>
          <div class="role-badge" id="badge-white">
            <div class="stone-icon white"></div>
            <span id="label-white">白 (後手)</span>
          </div>
        </div>
        <div class="diff-badge" id="diff-badge">COM: 中級</div>
      </div>
    </div>

    <div class="table-felt">
      <div class="turn-announcer" id="announcer">黒の番です</div>
      <div class="goban-frame">
        <svg id="goban-svg" viewBox="0 0 360 360">
          <defs>
            <radialGradient id="gradBlack" cx="35%" cy="30%" r="65%">
              <stop offset="0%" stop-color="#555"/>
              <stop offset="60%" stop-color="#181818"/>
              <stop offset="100%" stop-color="#050505"/>
            </radialGradient>
            <radialGradient id="gradWhite" cx="35%" cy="30%" r="65%">
              <stop offset="0%" stop-color="#ffffff"/>
              <stop offset="70%" stop-color="#e2e2e2"/>
              <stop offset="100%" stop-color="#b8b8b8"/>
            </radialGradient>
          </defs>
          <g id="grid-layer"></g>
          <g id="stones-layer"></g>
          <g id="hits-layer"></g>
        </svg>
      </div>
    </div>
  </div>

  <div id="modal-rules" class="modal-overlay">
    <div class="modal-sheet">
      <div class="modal-title">📖 五目並べのあそびかた</div>
      <div style="font-size:0.86rem; line-height:1.6; color:#c9b9aa;">
        <p>黒と白の碁石を交互に打ち、先に縦・横・斜めのいずれかに<b>5つ並べたプレイヤー</b>の勝利となります。</p>
        <br>
        <ul style="padding-left:18px;">
          <li>黒が先手、白が後手です。</li>
          <li>交点をタップすると石を配置できます。</li>
          <li>スマホでの誤タップを防ぐため、1手戻す機能（↩️）も備わっています。</li>
        </ul>
      </div>
      <button class="modal-close-btn" onclick="toggleRulesModal(false)">閉じる</button>
    </div>
  </div>

  <div id="modal-settings" class="modal-overlay">
    <div class="modal-sheet">
      <div class="modal-title">⚙ 設定</div>
      <div class="setting-item">
        <span>対戦モード</span>
        <select id="mode-sel" class="theme-select" onchange="changeMode(this.value)">
          <option value="pve" selected>1人プレイ (vs COM)</option>
          <option value="pvp">2人対戦 (1台で対戦)</option>
        </select>
      </div>
      <div class="setting-item" id="setting-diff">
        <span>COMの強さ</span>
        <select id="diff-sel" class="theme-select" onchange="changeDiff(this.value)">
          <option value="easy">初級</option>
          <option value="medium" selected>中級</option>
          <option value="hard">上級</option>
        </select>
      </div>
      <button class="modal-close-btn" onclick="toggleSettingsModal(false)">閉じる</button>
    </div>
  </div>

  <script>
    let audioCtx = null;
    function getAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }
    window.addEventListener('pointerdown', () => getAudio(), { once: true });

    function playStoneSound() {
      try {
        const ctx = getAudio();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(480, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(140, ctx.currentTime + 0.05);
        gain.gain.setValueAtTime(0.25, ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.05);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(); osc.stop(ctx.currentTime + 0.06);
      } catch(e) {}
    }

    const SIZE = 13;
    const PADDING = 20;
    const STEP = (360 - PADDING * 2) / (SIZE - 1);

    let board = [];
    let currentTurn = 1; // 1: 黒, 2: 白
    let gameMode = 'pve';
    let difficulty = 'medium';
    let isGameOver = false;
    let historyStack = [];
    let winningLine = [];

    window.addEventListener('DOMContentLoaded', () => {
      buildBoardSvg();
      initGame();
    });

    function initGame() {
      board = Array(SIZE).fill(0).map(() => Array(SIZE).fill(0));
      currentTurn = 1;
      isGameOver = false;
      historyStack = [];
      winningLine = [];
      updateUI();
      renderStones();
    }

    function buildBoardSvg() {
      const grid = document.getElementById('grid-layer');
      const hits = document.getElementById('hits-layer');
      grid.innerHTML = ''; hits.innerHTML = '';

      for (let i = 0; i < SIZE; i++) {
        const pos = PADDING + i * STEP;
        // 横線
        const hLine = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        hLine.setAttribute('x1', PADDING); hLine.setAttribute('y1', pos);
        hLine.setAttribute('x2', 360 - PADDING); hLine.setAttribute('y2', pos);
        hLine.setAttribute('class', 'grid-line');
        grid.appendChild(hLine);
        // 縦線
        const vLine = document.createElementNS('http://www.w3.org/2000/svg', 'line');
        vLine.setAttribute('x1', pos); vLine.setAttribute('y1', PADDING);
        vLine.setAttribute('x2', pos); vLine.setAttribute('y2', 360 - PADDING);
        vLine.setAttribute('class', 'grid-line');
        grid.appendChild(vLine);
      }

      // 星（天元・四隅）
      [3, 6, 9].forEach(r => {
        [3, 6, 9].forEach(c => {
          const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
          dot.setAttribute('cx', PADDING + c * STEP);
          dot.setAttribute('cy', PADDING + r * STEP);
          dot.setAttribute('r', 3);
          dot.setAttribute('class', 'star-point');
          grid.appendChild(dot);
        });
      });

      // タップ判定エリア
      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
          const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
          rect.setAttribute('x', PADDING + c * STEP - STEP / 2);
          rect.setAttribute('y', PADDING + r * STEP - STEP / 2);
          rect.setAttribute('width', STEP);
          rect.setAttribute('height', STEP);
          rect.setAttribute('class', 'hit-cell');
          rect.onclick = () => handleCellClick(r, c);
          hits.appendChild(rect);
        }
      }
    }

    function handleCellClick(r, c) {
      if (isGameOver || board[r][c] !== 0) return;
      if (gameMode === 'pve' && currentTurn === 2) return;

      placeStone(r, c, currentTurn);
    }

    function placeStone(r, c, player) {
      historyStack.push({ board: board.map(row => [...row]), turn: currentTurn });
      board[r][c] = player;
      playStoneSound();

      const win = checkWin(r, c, player);
      if (win) {
        isGameOver = true;
        winningLine = win;
        renderStones();
        updateUI();
        setTimeout(() => alert(`🎉 ${player === 1 ? '黒' : '白'} の勝利です！`), 200);
        return;
      }

      currentTurn = player === 1 ? 2 : 1;
      updateUI();
      renderStones();

      if (gameMode === 'pve' && currentTurn === 2 && !isGameOver) {
        setTimeout(handleComTurn, 450);
      }
    }

    function checkWin(r, c, player) {
      const dirs = [[1, 0], [0, 1], [1, 1], [1, -1]];
      for (const [dr, dc] of dirs) {
        let count = 1;
        let line = [{ r, c }];
        // 正方向
        for (let i = 1; i < 5; i++) {
          const nr = r + dr * i, nc = c + dc * i;
          if (nr >= 0 && nr < SIZE && nc >= 0 && nc < SIZE && board[nr][nc] === player) {
            count++; line.push({ r: nr, c: nc });
          } else break;
        }
        // 逆方向
        for (let i = 1; i < 5; i++) {
          const nr = r - dr * i, nc = c - dc * i;
          if (nr >= 0 && nr < SIZE && nc >= 0 && nc < SIZE && board[nr][nc] === player) {
            count++; line.push({ r: nr, c: nc });
          } else break;
        }
        if (count >= 5) return line;
      }
      return null;
    }

    function renderStones() {
      const layer = document.getElementById('stones-layer');
      layer.innerHTML = '';

      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
          const val = board[r][c];
          if (val !== 0) {
            const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
            circle.setAttribute('cx', PADDING + c * STEP);
            circle.setAttribute('cy', PADDING + r * STEP);
            circle.setAttribute('r', STEP * 0.44);
            circle.setAttribute('fill', val === 1 ? 'url(#gradBlack)' : 'url(#gradWhite)');
            circle.setAttribute('class', 'stone');

            if (winningLine.some(pt => pt.r === r && pt.c === c)) {
              circle.classList.add('win-stone');
            }
            layer.appendChild(circle);
          }
        }
      }
    }

    /* COM思考ルーチン */
    function handleComTurn() {
      if (isGameOver) return;
      let bestScore = -99999;
      let bestMove = { r: 6, c: 6 };

      for (let r = 0; r < SIZE; r++) {
        for (let c = 0; c < SIZE; c++) {
          if (board[r][c] === 0) {
            let score = evaluateCell(r, c);
            if (score > bestScore) {
              bestScore = score; bestMove = { r, c };
            }
          }
        }
      }
      placeStone(bestMove.r, bestMove.c, 2);
    }

    function evaluateCell(r, c) {
      // 簡易評価：自分の4連・相手の3〜4連の防御
      let score = 0;
      const dirs = [[1, 0], [0, 1], [1, 1], [1, -1]];
      for (const [dr, dc] of dirs) {
        // 白の連続数
        let myConsec = countDir(r, c, dr, dc, 2);
        // 黒の連続数（阻止）
        let oppConsec = countDir(r, c, dr, dc, 1);

        if (myConsec >= 4) score += 10000;
        else if (oppConsec >= 4) score += 5000;
        else if (myConsec === 3) score += 1000;
        else if (oppConsec === 3) score += 800;
        else score += (myConsec + oppConsec) * 10;
      }
      // 中央重視
      score -= (Math.abs(r - 6) + Math.abs(c - 6)) * 2;
      return score;
    }

    function countDir(r, c, dr, dc, player) {
      let count = 0;
      for (let i = 1; i < 5; i++) {
        const nr = r + dr * i, nc = c + dc * i;
        if (nr >= 0 && nr < SIZE && nc >= 0 && nc < SIZE && board[nr][nc] === player) count++;
        else break;
      }
      for (let i = 1; i < 5; i++) {
        const nr = r - dr * i, nc = c - dc * i;
        if (nr >= 0 && nr < SIZE && nc >= 0 && nc < SIZE && board[nr][nc] === player) count++;
        else break;
      }
      return count;
    }

    function undoMove() {
      if (historyStack.length === 0 || isGameOver) return;
      const steps = (gameMode === 'pve' && historyStack.length >= 2) ? 2 : 1;
      let last;
      for (let i = 0; i < steps; i++) last = historyStack.pop();
      board = last.board;
      currentTurn = last.turn;
      isGameOver = false;
      winningLine = [];
      updateUI();
      renderStones();
    }

    function updateUI() {
      document.getElementById('badge-black').classList.toggle('turn-active', currentTurn === 1 && !isGameOver);
      document.getElementById('badge-white').classList.toggle('turn-active', currentTurn === 2 && !isGameOver);
      document.getElementById('announcer').textContent = (currentTurn === 1 ? '黒' : '白') + ' の番です';

      const diffBadge = document.getElementById('diff-badge');
      if (gameMode === 'pvp') diffBadge.textContent = '2人対戦 (1台で対戦)';
      else diffBadge.textContent = `COM: ${difficulty === 'easy' ? '初級' : (difficulty === 'hard' ? '上級' : '中級')}`;
    }

    function toggleRulesModal(show) { document.getElementById('modal-rules').classList.toggle('active', show); }
    function toggleSettingsModal(show) { document.getElementById('modal-settings').classList.toggle('active', show); }
    function changeMode(val) {
      gameMode = val;
      document.getElementById('setting-diff').style.display = (val === 'pve') ? 'flex' : 'none';
      toggleSettingsModal(false);
      initGame();
    }
    function changeDiff(val) { difficulty = val; toggleSettingsModal(false); initGame(); }
  </script>
</body>
</html>
