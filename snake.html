<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>スネーク (Classic Snake)</title>
  <style>
    :root {
      --bg-desk: #110c08;
      --felt-dark: #122c19;
      --felt-light: #1c4528;
      --board-rim: #362214;
      --board-inner: #180f08;
      --brass-gold: #d4a359;
      --brass-glow: rgba(212, 163, 89, 0.45);
    }
    * {
      box-sizing: border-box; margin: 0; padding: 0;
      user-select: none; -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100%; height: 100%;
      background: var(--bg-desk);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", sans-serif;
      color: #fff;
      overflow-x: hidden; overflow-y: auto;
    }
    .viewport {
      width: 100%; min-height: 100%;
      padding: calc(10px + env(safe-area-inset-top)) 8px calc(60px + env(safe-area-inset-bottom));
      display: flex; flex-direction: column; align-items: center;
      background: radial-gradient(circle at 50% 20%, #2b1a10 0%, var(--bg-desk) 100%);
    }
    .topbar {
      width: 100%; max-width: 440px;
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 8px; padding: 0 4px;
    }
    .score-banner { display: flex; gap: 8px; }
    .badge {
      background: rgba(0, 0, 0, 0.7);
      border: 1.5px solid #442d1c;
      border-radius: 12px;
      padding: 5px 12px;
      font-size: 0.85rem; font-weight: 800; color: #ede2d5;
      display: flex; align-items: center; gap: 6px;
    }
    .val-gold { color: var(--brass-gold); font-size: 1.05rem; }
    .tool-btn {
      background: linear-gradient(145deg, #2c1c12 0%, #1c1109 100%);
      border: 1.5px solid #4d3320;
      color: var(--brass-gold);
      width: 38px; height: 38px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem; cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.7);
    }
    .tool-btn:active { transform: scale(0.92); }
    .table-felt {
      position: relative;
      width: 100%; max-width: 440px;
      background: radial-gradient(circle at 50% 35%, var(--felt-light) 0%, var(--felt-dark) 100%);
      border: 6px solid var(--board-rim);
      border-radius: 20px;
      padding: 12px 8px 16px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.95);
      display: flex; flex-direction: column; align-items: center; gap: 10px;
    }
    /* キャンバスボード */
    .game-board-frame {
      width: 100%; max-width: 340px; aspect-ratio: 1;
      background: var(--board-inner);
      border: 4px solid #583920;
      border-radius: 14px;
      box-shadow: 0 14px 30px rgba(0,0,0,0.85), inset 0 2px 6px rgba(0,0,0,0.9);
      display: flex; align-items: center; justify-content: center;
      position: relative;
      overflow: hidden;
    }
    #snake-canvas {
      width: 100%; height: 100%; display: block;
      border-radius: 8px;
    }
    /* スタート / ゲームオーバー オーバーレイ */
    .screen-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(18, 11, 7, 0.88);
      backdrop-filter: blur(3px);
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      gap: 14px;
      z-index: 10;
      transition: opacity 0.2s ease;
    }
    .screen-overlay.hidden {
      display: none;
    }
    .overlay-title {
      font-size: 1.35rem; font-weight: 900;
      color: var(--brass-gold);
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
      letter-spacing: 2px;
    }
    .overlay-sub {
      font-size: 0.82rem; color: #d5c3b1;
      text-align: center; line-height: 1.5;
    }
    .start-btn {
      background: linear-gradient(180deg, #d4a359 0%, #aa782e 100%);
      color: #140c06; font-size: 1.05rem; font-weight: 900;
      border: 1.5px solid #fff; border-radius: 20px;
      padding: 10px 28px; cursor: pointer;
      box-shadow: 0 6px 16px rgba(0,0,0,0.8), 0 0 12px var(--brass-glow);
      transition: transform 0.1s;
    }
    .start-btn:active { transform: scale(0.94); }

    /* 十字コントローラー */
    .dpad-container {
      display: grid;
      grid-template-columns: repeat(3, 50px);
      grid-template-rows: repeat(3, 50px);
      gap: 6px;
      margin-top: 4px;
    }
    .dpad-btn {
      background: linear-gradient(145deg, #2e1d13 0%, #1a100a 100%);
      border: 1.5px solid #4a3424;
      border-radius: 12px;
      color: var(--brass-gold);
      font-size: 1.4rem; font-weight: 900;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.6);
    }
    .dpad-btn:active { transform: scale(0.92); background: #422a1b; }
    .dpad-up { grid-area: 1 / 2; }
    .dpad-left { grid-area: 2 / 1; }
    .dpad-right { grid-area: 2 / 3; }
    .dpad-down { grid-area: 3 / 2; }

    .modal-overlay {
      display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.82); z-index: 99999;
      align-items: center; justify-content: center;
    }
    .modal-overlay.active { display: flex; }
    .modal-sheet {
      background: #20140c; border: 3px solid #4d3320;
      border-radius: 20px; padding: 22px; width: 88%; max-width: 440px; color: #ede2d5;
    }
    .modal-title {
      text-align: center; color: var(--brass-gold);
      font-size: 1.25rem; font-weight: 800; margin-bottom: 12px;
    }
    .modal-close-btn {
      width: 100%; padding: 12px;
      background: linear-gradient(180deg, #d4a359, #aa782e);
      border: none; border-radius: 12px; color: #140c06;
      font-weight: 900; font-size: 0.95rem; cursor: pointer; margin-top: 14px;
    }
  </style>
</head>
<body>
  <div class="viewport">
    <div class="topbar">
      <div class="score-banner">
        <div class="badge">スコア: <b class="val-gold" id="score-val">0</b></div>
        <div class="badge">最高: <b class="val-gold" id="best-val">0</b></div>
      </div>
      <div style="display:flex; gap:8px;">
        <div class="tool-btn" onclick="resetToTitle()">🔄</div>
        <div class="tool-btn" onclick="toggleRules(true)">📖</div>
      </div>
    </div>

    <div class="table-felt">
      <div class="game-board-frame" id="canvas-container">
        <canvas id="snake-canvas" width="340" height="340"></canvas>

        <!-- スタート＆リトライ用画面 -->
        <div id="game-overlay" class="screen-overlay">
          <div class="overlay-title" id="overlay-title">SNAKE CRAFT</div>
          <div class="overlay-sub" id="overlay-sub">タップまたはボタンで<br>黄金のリンゴを追え！</div>
          <button class="start-btn" id="start-btn" onclick="startGame()">START</button>
        </div>
      </div>

      <!-- スマホ用タッチD-Pad -->
      <div class="dpad-container">
        <div class="dpad-btn dpad-up" onclick="changeDir(0, -1)">▲</div>
        <div class="dpad-btn dpad-left" onclick="changeDir(-1, 0)">◀</div>
        <div class="dpad-btn dpad-right" onclick="changeDir(1, 0)">▶</div>
        <div class="dpad-btn dpad-down" onclick="changeDir(0, 1)">▼</div>
      </div>
    </div>
  </div>

  <div id="modal-rules" class="modal-overlay">
    <div class="modal-sheet">
      <div class="modal-title">📖 スネークのあそびかた</div>
      <div style="font-size:0.86rem; line-height:1.6; color:#c9b9aa;">
        <p>ヘビを操作して真鍮の黄金リンゴを食べさせ、できるだけ長く成長させるクラシックアーケードゲームです。</p>
        <br>
        <ul style="padding-left:18px;">
          <li><b>操作方法</b>：画面下の十字ボタン、画面のスワイプ、またはキーボードの矢印キーで方向転換。</li>
          <li>壁や自分の体に衝突するとゲームオーバーです。</li>
          <li>リンゴを1つ食べるごとに10点獲得し、ヘビが1マス分長くなります！</li>
        </ul>
      </div>
      <button class="modal-close-btn" onclick="toggleRules(false)">閉じる</button>
    </div>
  </div>

  <script>
    let audioCtx = null;
    function getAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }
    window.addEventListener('pointerdown', () => getAudio(), { once: true });

    function playSound(type) {
      try {
        const ctx = getAudio();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        if (type === 'eat') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(580, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.08);
          gain.gain.setValueAtTime(0.2, ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.08);
        } else {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(180, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(60, ctx.currentTime + 0.15);
          gain.gain.setValueAtTime(0.25, ctx.currentTime);
          gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.15);
        }
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(); osc.stop(ctx.currentTime + 0.16);
      } catch(e) {}
    }

    const GRID_COUNT = 17;
    const CELL_SIZE = 20; // 17 * 20 = 340px

    let snake = [];
    let dir = { x: 1, y: 0 };
    let nextDir = { x: 1, y: 0 };
    let apple = { x: 12, y: 8 };
    let score = 0;
    let bestScore = 0;
    let gameLoop = null;
    let isPlaying = false;

    window.addEventListener('DOMContentLoaded', () => {
      loadBestScore();
      setupInitialBoard();
      setupInputs();
    });

    function setupInitialBoard() {
      snake = [
        { x: 6, y: 8 },
        { x: 5, y: 8 },
        { x: 4, y: 8 }
      ];
      dir = { x: 1, y: 0 };
      nextDir = { x: 1, y: 0 };
      score = 0;
      document.getElementById('score-val').textContent = '0';
      apple = { x: 12, y: 8 };
      draw();
    }

    function startGame() {
      document.getElementById('game-overlay').classList.add('hidden');
      setupInitialBoard();
      isPlaying = true;
      if (gameLoop) clearInterval(gameLoop);
      gameLoop = setInterval(update, 125);
    }

    function resetToTitle() {
      if (gameLoop) clearInterval(gameLoop);
      isPlaying = false;
      document.getElementById('overlay-title').textContent = 'SNAKE CRAFT';
      document.getElementById('overlay-sub').innerHTML = 'タップまたはボタンで<br>黄金のリンゴを追え！';
      document.getElementById('start-btn').textContent = 'START';
      document.getElementById('game-overlay').classList.remove('hidden');
      setupInitialBoard();
    }

    function spawnApple() {
      let valid = false;
      while (!valid) {
        apple.x = Math.floor(Math.random() * GRID_COUNT);
        apple.y = Math.floor(Math.random() * GRID_COUNT);
        valid = !snake.some(s => s.x === apple.x && s.y === apple.y);
      }
    }

    function update() {
      if (!isPlaying) return;
      dir = { ...nextDir };
      const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };

      // 壁との衝突判定
      if (head.x < 0 || head.x >= GRID_COUNT || head.y < 0 || head.y >= GRID_COUNT) {
        handleGameOver();
        return;
      }

      // 自分自身の体との衝突判定
      if (snake.some(s => s.x === head.x && s.y === head.y)) {
        handleGameOver();
        return;
      }

      snake.unshift(head);

      // リンゴ捕食判定
      if (head.x === apple.x && head.y === apple.y) {
        score += 10;
        document.getElementById('score-val').textContent = score;
        if (score > bestScore) {
          bestScore = score;
          document.getElementById('best-val').textContent = bestScore;
          saveBestScore();
        }
        playSound('eat');
        spawnApple();
      } else {
        snake.pop();
      }

      draw();
    }

    function draw() {
      const canvas = document.getElementById('snake-canvas');
      const ctx = canvas.getContext('2d');

      // 背景クリア
      ctx.fillStyle = '#160d07';
      ctx.fillRect(0, 0, 340, 340);

      // グリッド線
      ctx.strokeStyle = 'rgba(74, 48, 23, 0.4)';
      ctx.lineWidth = 1;
      for (let i = 0; i <= GRID_COUNT; i++) {
        ctx.beginPath();
        ctx.moveTo(i * CELL_SIZE, 0); ctx.lineTo(i * CELL_SIZE, 340);
        ctx.stroke();
        ctx.beginPath();
        ctx.moveTo(0, i * CELL_SIZE); ctx.lineTo(340, i * CELL_SIZE);
        ctx.stroke();
      }

      // 黄金のリンゴ（真鍮オーブ）
      ctx.save();
      const ax = apple.x * CELL_SIZE + CELL_SIZE / 2;
      const ay = apple.y * CELL_SIZE + CELL_SIZE / 2;
      const appleGrad = ctx.createRadialGradient(ax - 2, ay - 2, 2, ax, ay, 8);
      appleGrad.addColorStop(0, '#fff4cc');
      appleGrad.addColorStop(0.5, '#e5a950');
      appleGrad.addColorStop(1, '#91601d');
      ctx.fillStyle = appleGrad;
      ctx.shadowColor = 'rgba(229, 169, 80, 0.8)';
      ctx.shadowBlur = 8;
      ctx.beginPath();
      ctx.arc(ax, ay, 7.5, 0, Math.PI * 2);
      ctx.fill();
      ctx.restore();

      // ヘビの描画
      snake.forEach((s, idx) => {
        const x = s.x * CELL_SIZE;
        const y = s.y * CELL_SIZE;
        const isHead = (idx === 0);

        ctx.save();
        if (isHead) {
          ctx.fillStyle = '#2ecc71';
          ctx.shadowColor = 'rgba(46, 204, 113, 0.6)';
          ctx.shadowBlur = 6;
        } else {
          ctx.fillStyle = (idx % 2 === 0) ? '#27ae60' : '#1e824c';
        }

        ctx.beginPath();
        ctx.roundRect(x + 1.5, y + 1.5, CELL_SIZE - 3, CELL_SIZE - 3, 5);
        ctx.fill();

        if (isHead) {
          ctx.fillStyle = '#fff';
          ctx.beginPath();
          ctx.arc(x + CELL_SIZE / 2, y + CELL_SIZE / 2, 2.5, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();
      });
    }

    function changeDir(dx, dy) {
      if (!isPlaying) return;
      if (dir.x + dx === 0 && dir.y + dy === 0) return; // 逆走防止
      nextDir = { x: dx, y: dy };
    }

    function setupInputs() {
      window.addEventListener('keydown', (e) => {
        if (!isPlaying && (e.key === ' ' || e.key === 'Enter')) {
          startGame();
          return;
        }
        if (e.key === 'ArrowUp' || e.key === 'w') changeDir(0, -1);
        else if (e.key === 'ArrowDown' || e.key === 's') changeDir(0, 1);
        else if (e.key === 'ArrowLeft' || e.key === 'a') changeDir(-1, 0);
        else if (e.key === 'ArrowRight' || e.key === 'd') changeDir(1, 0);
      });

      let startX = 0, startY = 0;
      const el = document.getElementById('canvas-container');
      el.addEventListener('touchstart', (e) => {
        startX = e.touches[0].clientX;
        startY = e.touches[0].clientY;
      }, { passive: true });
      el.addEventListener('touchend', (e) => {
        const dx = e.changedTouches[0].clientX - startX;
        const dy = e.changedTouches[0].clientY - startY;
        if (Math.abs(dx) > 25 || Math.abs(dy) > 25) {
          if (Math.abs(dx) > Math.abs(dy)) {
            changeDir(dx > 0 ? 1 : -1, 0);
          } else {
            changeDir(0, dy > 0 ? 1 : -1);
          }
        }
      }, { passive: true });
    }

    function handleGameOver() {
      isPlaying = false;
      clearInterval(gameLoop);
      playSound('hit');

      document.getElementById('overlay-title').textContent = 'GAME OVER';
      document.getElementById('overlay-sub').innerHTML = `スコア: <b>${score}</b><br>ハイスコア: <b>${bestScore}</b>`;
      document.getElementById('start-btn').textContent = 'PLAY AGAIN';
      document.getElementById('game-overlay').classList.remove('hidden');
    }

    function loadBestScore() {
      try {
        bestScore = parseInt(localStorage.getItem('snake_best') || '0', 10);
      } catch(e) { bestScore = 0; }
      document.getElementById('best-val').textContent = bestScore;
    }

    function saveBestScore() {
      try { localStorage.setItem('snake_best', bestScore.toString()); } catch(e) {}
    }

    function toggleRules(show) { document.getElementById('modal-rules').classList.toggle('active', show); }
  </script>
</body>
</html>
