<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>倉庫番 (Sokoban Craft Edition)</title>
  <style>
    :root {
      --bg-desk: #110c08;
      --felt-dark: #122c19;
      --felt-light: #1c4528;
      --board-rim: #362214;
      --wood-wall: #422917;
      --wood-floor: #24170e;
      --brass-gold: #d4a359;
      --brass-glow: rgba(212, 163, 89, 0.45);
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100%;
      height: 100%;
      background: var(--bg-desk);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", sans-serif;
      color: #fff;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }
    .viewport {
      width: 100%;
      min-height: 100%;
      padding: calc(12px + env(safe-area-inset-top)) 8px calc(60px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      align-items: center;
      background: radial-gradient(circle at 50% 20%, #2b1a10 0%, var(--bg-desk) 100%);
      position: relative;
    }

    .topbar {
      width: 100%;
      max-width: 440px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 8px;
      padding: 0 4px;
    }
    .topbar-upper {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
    }
    .tool-btn {
      background: linear-gradient(145deg, #2c1c12 0%, #1c1109 100%);
      border: 1.5px solid #4d3320;
      color: var(--brass-gold);
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.7), inset 0 1px 1px rgba(255,255,255,0.15);
      transition: transform 0.12s, border-color 0.12s;
    }
    .tool-btn:hover { border-color: var(--brass-gold); transform: translateY(-2px); }
    .tool-btn:active { transform: scale(0.92); }

    .topbar-lower {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0 2px;
      gap: 6px;
    }
    .stage-badge {
      background: rgba(0, 0, 0, 0.7);
      border: 1.5px solid #442d1c;
      border-radius: 14px;
      padding: 5px 12px;
      font-size: 0.85rem;
      font-weight: 800;
      color: var(--brass-gold);
      display: flex;
      align-items: center;
      gap: 6px;
      box-shadow: inset 0 2px 5px rgba(0,0,0,0.8);
    }
    .stats-group {
      display: flex;
      gap: 8px;
    }
    .stat-badge {
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid #442d1c;
      border-radius: 12px;
      padding: 4px 10px;
      font-size: 0.8rem;
      color: #ede2d5;
      font-weight: 800;
    }
    .stat-val {
      color: var(--brass-gold);
      font-size: 0.95rem;
      margin-left: 2px;
      font-feature-settings: "tnum";
    }

    .table-felt {
      position: relative;
      width: 100%;
      max-width: 440px;
      background: radial-gradient(circle at 50% 35%, var(--felt-light) 0%, var(--felt-dark) 100%);
      border: 6px solid var(--board-rim);
      border-radius: 20px;
      padding: 14px 8px 18px;
      box-shadow: 0 20px 50px rgba(0,0,0,0.95), inset 0 2px 4px rgba(255,255,255,0.1), inset 0 0 35px rgba(0,0,0,0.85);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      touch-action: manipulation;
    }

    /* 倉庫盤面 */
    .warehouse-frame {
      background: #190f09;
      border: 4px solid #4d3320;
      border-radius: 14px;
      padding: 8px;
      box-shadow: 0 12px 28px rgba(0,0,0,0.85), inset 0 2px 6px rgba(0,0,0,0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }
    #warehouse-grid {
      display: grid;
      gap: 1px;
      background: #110905;
      position: relative;
    }

    .cell {
      width: 38px;
      height: 38px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background: var(--wood-floor);
      box-shadow: inset 0 0 3px rgba(0,0,0,0.5);
    }
    @media (max-width: 380px) {
      .cell { width: 33px; height: 33px; }
    }

    /* 壁 */
    .cell.wall {
      background: linear-gradient(135deg, #53341e 0%, #301d10 100%);
      border-top: 2px solid #6b4327;
      border-left: 2px solid #6b4327;
      border-right: 2px solid #1a1009;
      border-bottom: 2px solid #1a1009;
      box-shadow: 0 3px 6px rgba(0,0,0,0.6);
    }
    .cell.wall::after {
      content: '';
      width: 70%;
      height: 70%;
      border: 1px solid rgba(0,0,0,0.4);
      border-radius: 2px;
    }

    /* 空きマス（外周） */
    .cell.void {
      background: transparent;
      box-shadow: none;
    }

    /* 目標地点（真鍮プレートスイッチ） */
    .cell.goal::before {
      content: '★';
      font-size: 15px;
      color: var(--brass-gold);
      position: absolute;
      text-shadow: 0 0 6px var(--brass-glow);
      z-index: 1;
    }

    /* 木箱（通常 & 目標上） */
    .box {
      width: 82%;
      height: 82%;
      background: linear-gradient(145deg, #b0743b 0%, #7d4d21 100%);
      border: 2px solid #583313;
      border-radius: 5px;
      box-shadow: 0 4px 8px rgba(0,0,0,0.65), inset 0 1px 1px rgba(255,255,255,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      z-index: 2;
      transition: all 0.12s ease-out;
    }
    .box::after {
      content: '✖';
      font-size: 16px;
      font-weight: 900;
      color: #4a280e;
      opacity: 0.55;
    }
    .box.on-goal {
      background: linear-gradient(145deg, #2ecc71 0%, #1e824c 100%);
      border-color: #145a32;
      box-shadow: 0 0 10px rgba(46, 204, 113, 0.7), inset 0 1px 1px rgba(255,255,255,0.6);
    }
    .box.on-goal::after {
      color: #0d381e;
      opacity: 0.6;
    }

    /* プレイヤー */
    .player {
      width: 84%;
      height: 84%;
      background: radial-gradient(circle at 35% 30%, #f39c12, #d35400);
      border: 2px solid #f1c40f;
      border-radius: 50%;
      box-shadow: 0 4px 10px rgba(0,0,0,0.7), 0 0 8px rgba(243, 156, 18, 0.6);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      z-index: 3;
      transition: all 0.1s ease-out;
    }

    /* スマホ用タッチ十字キー */
    .dpad-container {
      display: grid;
      grid-template-columns: repeat(3, 48px);
      grid-template-rows: repeat(3, 48px);
      gap: 6px;
      margin-top: 4px;
    }
    .dpad-btn {
      background: linear-gradient(145deg, #2e1d13 0%, #1a100a 100%);
      border: 1.5px solid #4a3424;
      border-radius: 12px;
      color: var(--brass-gold);
      font-size: 1.3rem;
      font-weight: 900;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.6), inset 0 1px 1px rgba(255,255,255,0.15);
      transition: transform 0.08s;
    }
    .dpad-btn:active {
      transform: scale(0.92);
      background: #422a1b;
    }
    .dpad-up { grid-area: 1 / 2; }
    .dpad-left { grid-area: 2 / 1; }
    .dpad-right { grid-area: 2 / 3; }
    .dpad-down { grid-area: 3 / 2; }

    /* モーダル */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.82);
      backdrop-filter: blur(5px);
      z-index: 99999;
      align-items: center;
      justify-content: center;
    }
    .modal-overlay.active { display: flex; }
    .modal-sheet {
      background: #20140c;
      border: 3px solid #4d3320;
      border-radius: 20px;
      padding: 22px;
      width: 88%;
      max-width: 440px;
      box-shadow: 0 25px 60px rgba(0,0,0,0.95);
      color: #ede2d5;
      max-height: 85vh;
      display: flex;
      flex-direction: column;
    }
    .modal-title {
      text-align: center;
      color: var(--brass-gold);
      font-size: 1.25rem;
      font-weight: 800;
      margin-bottom: 14px;
    }
    .modal-body {
      overflow-y: auto;
      font-size: 0.86rem;
      line-height: 1.6;
      color: #c9b9aa;
      margin-bottom: 16px;
      padding-right: 6px;
    }
    .modal-close-btn {
      width: 100%;
      padding: 12px;
      background: linear-gradient(180deg, #d4a359, #aa782e);
      border: none;
      border-radius: 12px;
      color: #140c06;
      font-weight: 900;
      font-size: 0.95rem;
      cursor: pointer;
    }
    .stage-select-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 8px;
      margin-top: 10px;
    }
    .stage-tile {
      background: #2b1a10;
      border: 1.5px solid #4d3320;
      border-radius: 10px;
      padding: 10px 0;
      text-align: center;
      font-weight: 900;
      font-size: 0.9rem;
      cursor: pointer;
      color: #ede2d5;
      transition: all 0.12s;
    }
    .stage-tile:hover {
      border-color: var(--brass-gold);
      transform: translateY(-2px);
    }
    .stage-tile.cleared {
      border-color: #2ecc71;
      color: #2ecc71;
    }
  </style>
</head>
<body>

  <div class="viewport">
    <div class="topbar">
      <div class="topbar-upper">
        <div class="tool-btn" onclick="openStageModal()" title="ステージ選択">🗺️</div>
        <div class="tool-btn" onclick="restartCurrentStage()" title="やり直す">🔄</div>
        <div class="tool-btn" onclick="undoMove()" title="1手戻す">↩️</div>
        <div class="tool-btn" onclick="toggleRulesModal(true)" title="あそびかた">📖</div>
      </div>

      <div class="topbar-lower">
        <div class="stage-badge" id="stat-stage-badge">STAGE 1 / 10</div>
        <div class="stats-group">
          <div class="stat-badge">手数: <span class="stat-val" id="stat-moves">0</span></div>
          <div class="stat-badge">押下: <span class="stat-val" id="stat-pushes">0</span></div>
        </div>
      </div>
    </div>

    <!-- フェルト卓 -->
    <div class="table-felt">
      <div class="warehouse-frame">
        <div id="warehouse-grid"></div>
      </div>

      <!-- スマホ向けタッチ十字ボタン -->
      <div class="dpad-container">
        <div class="dpad-btn dpad-up" onclick="movePlayer(0, -1)">▲</div>
        <div class="dpad-btn dpad-left" onclick="movePlayer(-1, 0)">◀</div>
        <div class="dpad-btn dpad-right" onclick="movePlayer(1, 0)">▶</div>
        <div class="dpad-btn dpad-down" onclick="movePlayer(0, 1)">▼</div>
      </div>
    </div>
  </div>

  <!-- ステージ選択モーダル -->
  <div id="modal-stages" class="modal-overlay">
    <div class="modal-sheet">
      <div class="modal-title">🗺️ ステージ選択</div>
      <div class="modal-body">
        <p style="text-align:center; font-size:0.8rem; margin-bottom:8px;">挑戦したいステージを選んでください</p>
        <div class="stage-select-grid" id="stage-select-grid"></div>
      </div>
      <button class="modal-close-btn" onclick="closeStageModal()">閉じる</button>
    </div>
  </div>

  <!-- ルールモーダル -->
  <div id="modal-rules" class="modal-overlay">
    <div class="modal-sheet">
      <div class="modal-title">📖 倉庫番のあそびかた</div>
      <div class="modal-body">
        <p>すべての木箱を押して、真鍮の★印（目標地点）まで運ぶクラシックパズルです。</p>
        <br>
        <b style="color:var(--brass-gold);">【基本ルール】</b>
        <ul style="padding-left:18px; margin:6px 0;">
          <li>プレイヤーは<b>木箱を押すことだけ</b>ができます（引くことはできません）。</li>
          <li>2個以上の木箱を同時に押すことはできません。</li>
          <li>壁や部屋の隅に木箱を押し込んで動かせなくなったら、右上の🔄でやり直すか、↩️で1手戻しましょう！</li>
          <li>すべての木箱が緑色（★の上）になったらクリアです。</li>
        </ul>
      </div>
      <button class="modal-close-btn" onclick="toggleRulesModal(false)">閉じる</button>
    </div>
  </div>

  <script>
    let audioCtx = null;
    function getAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }
    window.addEventListener('pointerdown', () => getAudio(), { once: true });

    function playStepSound() {
      try {
        const ctx = getAudio();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(220, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(80, ctx.currentTime + 0.04);
        gain.gain.setValueAtTime(0.12, ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.04);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.05);
      } catch(e) {}
    }

    function playPushSound() {
      try {
        const ctx = getAudio();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(140, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(60, ctx.currentTime + 0.08);
        gain.gain.setValueAtTime(0.2, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.08);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.09);
      } catch(e) {}
    }

    function playVictorySound() {
      try {
        const ctx = getAudio();
        [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.08);
          gain.gain.setValueAtTime(0.2, ctx.currentTime + idx * 0.08);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + idx * 0.08 + 0.25);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + idx * 0.08);
          osc.stop(ctx.currentTime + idx * 0.08 + 0.26);
        });
      } catch(e) {}
    }

    /* 全10ステージデータ
       #: 壁, .: 目標(ゴール), $: 木箱, *: ゴール上の木箱, @: プレイヤー, +: ゴール上のプレイヤー, ' ': 床
    */
    const STAGES = [
      [ // Stage 1
        "  #####",
        "###   #",
        "# $ # ##",
        "# #  . #",
        "#    . #",
        "## $#  #",
        " #@ ####",
        " ####"
      ],
      [ // Stage 2
        "######",
        "#    #",
        "# #$ #",
        "# .  #",
        "# .$@#",
        "######"
      ],
      [ // Stage 3
        "  #### ",
        "###  # ",
        "#  $ # ",
        "# #. # ",
        "# #.$# ",
        "#@#  # ",
        "######"
      ],
      [ // Stage 4
        "#######",
        "#  .  #",
        "# $#$ #",         "#  .  #",         "#  @  #",         "#######"       ],       [ // Stage 5         " ###### ",         "##    ##",         "#  $$  #",
        "# ..#  #",
        "# ..#  #",
        "#  @   #",
        "########"
      ],
      [ // Stage 6
        "  ##### ",
        "###   # ",
        "# $ $ # ",         "### . ##",         "  # .  #",         "  #@   #",         "  ######"       ],       [ // Stage 7         "########",         "#   .  #",         "# $$#  #",
        "#   .  #",
        "### #  #",
        "  # @###",
        "  ####"
      ],
      [ // Stage 8
        "  ######",
        "###    #",
        "#   $$ #",         "# ##.# #",         "#  ..# #",         "#   @  #",         "########"       ],       [ // Stage 9         "#######",         "# . . #",         "# $$$ #",
        "#  @  #",
        "# .   #",
        "#######"
      ],
      [ // Stage 10
        "  ##### ",
        "###   ##",
        "# $ #$ #",
        "# . .  #",
        "#  .#$ #",
        "##  @  #",
        " #######"
      ]
    ];

    let currentStageIndex = 0;
    let gridRows = 0;
    let gridCols = 0;
    let mapData = [];
    let playerPos = { r: 0, c: 0 };
    let movesCount = 0;
    let pushesCount = 0;
    let historyStack = [];
    let isStageCleared = false;

    window.addEventListener('DOMContentLoaded', () => {
      loadStage(0);
    });

    // キーボード操作対応
    window.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowUp' || e.key === 'w') movePlayer(0, -1);
      else if (e.key === 'ArrowDown' || e.key === 's') movePlayer(0, 1);
      else if (e.key === 'ArrowLeft' || e.key === 'a') movePlayer(-1, 0);
      else if (e.key === 'ArrowRight' || e.key === 'd') movePlayer(1, 0);
      else if (e.key === 'z') undoMove();
      else if (e.key === 'r') restartCurrentStage();
    });

    // スワイプ操作対応
    let touchStartX = 0;
    let touchStartY = 0;
    const warehouseEl = document.querySelector('.warehouse-frame');
    warehouseEl.addEventListener('touchstart', (e) => {
      touchStartX = e.touches[0].clientX;
      touchStartY = e.touches[0].clientY;
    }, { passive: true });
    warehouseEl.addEventListener('touchend', (e) => {
      const dx = e.changedTouches[0].clientX - touchStartX;
      const dy = e.changedTouches[0].clientY - touchStartY;
      if (Math.abs(dx) > 30 || Math.abs(dy) > 30) {
        if (Math.abs(dx) > Math.abs(dy)) {
          movePlayer(dx > 0 ? 1 : -1, 0);
        } else {
          movePlayer(0, dy > 0 ? 1 : -1);
        }
      }
    }, { passive: true });

    function loadStage(idx) {
      currentStageIndex = idx;
      isStageCleared = false;
      movesCount = 0;
      pushesCount = 0;
      historyStack = [];

      const lines = STAGES[idx];
      gridRows = lines.length;
      gridCols = Math.max(...lines.map(l => l.length));

      mapData = [];
      for (let r = 0; r < gridRows; r++) {
        mapData[r] = [];
        const line = lines[r] || '';
        for (let c = 0; c < gridCols; c++) {
          const char = line[c] || ' ';
          // 内部構造: isWall, isGoal, hasBox
          let cell = { isWall: false, isGoal: false, hasBox: false, isVoid: false };
          if (char === '#') cell.isWall = true;
          else if (char === '.') cell.isGoal = true;
          else if (char === '$') cell.hasBox = true;
          else if (char === '*') { cell.isGoal = true; cell.hasBox = true; }
          else if (char === '@') { playerPos = { r, c }; }
          else if (char === '+') { cell.isGoal = true; playerPos = { r, c }; }
          else if (char === ' ') {
            // 外周空きスペース判定（簡易）
            if (c === 0 || c === gridCols - 1 || r === 0 || r === gridRows - 1) cell.isVoid = true;
          }
          mapData[r][c] = cell;
        }
      }

      updateUI();
      renderGrid();
    }

    function saveState() {
      historyStack.push({
        map: JSON.parse(JSON.stringify(mapData)),
        player: { ...playerPos },
        moves: movesCount,
        pushes: pushesCount
      });
    }

    function undoMove() {
      if (historyStack.length === 0 || isStageCleared) return;
      const last = historyStack.pop();
      mapData = last.map;
      playerPos = last.player;
      movesCount = last.moves;
      pushesCount = last.pushes;
      updateUI();
      renderGrid();
      playStepSound();
    }

    function movePlayer(dc, dr) {
      if (isStageCleared) return;

      const nr = playerPos.r + dr;
      const nc = playerPos.c + dc;
      if (nr < 0 || nr >= gridRows || nc < 0 || nc >= gridCols) return;

      const targetCell = mapData[nr][nc];
      if (targetCell.isWall || targetCell.isVoid) return;

      // 箱を押す場合
      if (targetCell.hasBox) {
        const boxNextR = nr + dr;
        const boxNextC = nc + dc;
        if (boxNextR < 0 || boxNextR >= gridRows || boxNextC < 0 || boxNextC >= gridCols) return;

        const boxNextCell = mapData[boxNextR][boxNextC];
        if (boxNextCell.isWall || boxNextCell.hasBox || boxNextCell.isVoid) return;

        saveState();
        targetCell.hasBox = false;
        boxNextCell.hasBox = true;
        playerPos = { r: nr, c: nc };
        movesCount++;
        pushesCount++;
        playPushSound();
      } else {
        // 通常歩行
        saveState();
        playerPos = { r: nr, c: nc };
        movesCount++;
        playStepSound();
      }

      updateUI();
      renderGrid();
      checkVictory();
    }

    function renderGrid() {
      const gridEl = document.getElementById('warehouse-grid');
      gridEl.innerHTML = '';
      gridEl.style.gridTemplateColumns = `repeat(${gridCols}, 1fr)`;
      gridEl.style.gridTemplateRows = `repeat(${gridRows}, 1fr)`;

      for (let r = 0; r < gridRows; r++) {
        for (let c = 0; c < gridCols; c++) {
          const cell = mapData[r][c];
          const cellEl = document.createElement('div');
          cellEl.className = 'cell';

          if (cell.isVoid) {
            cellEl.classList.add('void');
          } else if (cell.isWall) {
            cellEl.classList.add('wall');
          } else {
            if (cell.isGoal) cellEl.classList.add('goal');

            if (cell.hasBox) {
              const boxEl = document.createElement('div');
              boxEl.className = 'box' + (cell.isGoal ? ' on-goal' : '');
              cellEl.appendChild(boxEl);
            } else if (playerPos.r === r && playerPos.c === c) {
              const pEl = document.createElement('div');
              pEl.className = 'player';
              pEl.textContent = '👷';
              cellEl.appendChild(pEl);
            }
          }
          gridEl.appendChild(cellEl);
        }
      }
    }

    function checkVictory() {
      let allCleared = true;
      for (let r = 0; r < gridRows; r++) {
        for (let c = 0; c < gridCols; c++) {
          const cell = mapData[r][c];
          if (cell.isGoal && !cell.hasBox) {
            allCleared = false;
            break;
          }
        }
      }

      if (allCleared) {
        isStageCleared = true;
        playVictorySound();
        saveClearedStage(currentStageIndex);
        setTimeout(() => {
          alert(`🎉 ステージ ${currentStageIndex + 1} クリア！\n手数: ${movesCount} / 押下: ${pushesCount}`);
          if (currentStageIndex + 1 < STAGES.length) {
            loadStage(currentStageIndex + 1);
          }
        }, 250);
      }
    }

    function updateUI() {
      document.getElementById('stat-stage-badge').textContent = `STAGE ${currentStageIndex + 1} / ${STAGES.length}`;
      document.getElementById('stat-moves').textContent = movesCount;
      document.getElementById('stat-pushes').textContent = pushesCount;
    }

    function restartCurrentStage() {
      loadStage(currentStageIndex);
    }

    function openStageModal() {
      const container = document.getElementById('stage-select-grid');
      container.innerHTML = '';
      const clearedList = getClearedStages();

      STAGES.forEach((_, idx) => {
        const tile = document.createElement('div');
        tile.className = 'stage-tile' + (clearedList.includes(idx) ? ' cleared' : '');
        tile.textContent = `${idx + 1}`;
        tile.onclick = () => {
          closeStageModal();
          loadStage(idx);
        };
        container.appendChild(tile);
      });
      document.getElementById('modal-stages').classList.add('active');
    }
    function closeStageModal() {
      document.getElementById('modal-stages').classList.remove('active');
    }

    function toggleRulesModal(show) {
      document.getElementById('modal-rules').classList.toggle('active', show);
    }

    function getClearedStages() {
      try {
        return JSON.parse(localStorage.getItem('sokoban_cleared')) || [];
      } catch(e) { return []; }
    }
    function saveClearedStage(idx) {
      let list = getClearedStages();
      if (!list.includes(idx)) {
        list.push(idx);
        try { localStorage.setItem('sokoban_cleared', JSON.stringify(list)); } catch(e) {}
      }
    }
  </script>
</body>
</html>
