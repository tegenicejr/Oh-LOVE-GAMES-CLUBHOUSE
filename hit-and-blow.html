<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>ヒット＆ブロー (2人対戦バトル)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #120b07;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: #fff;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    :root {
      --hnb-wood-bevel: rgba(255, 255, 255, 0.08);
      --hnb-brass: #e5a950;
      --hnb-brass-glow: rgba(229, 169, 80, 0.45);
      --color-1p: #3498db;
      --color-2p: #e74c3c;
    }

    .hnb-wrapper {
      width: 100%;
      min-height: 100%;
      padding: calc(20px + env(safe-area-inset-top)) 14px calc(40px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      user-select: none;
      -webkit-user-select: none;
    }

    .hnb-topbar {
      width: 100%;
      max-width: 440px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .hnb-player-indicator {
      background: #25170d;
      border: 2px solid var(--color-1p);
      color: #fff;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.95rem;
      font-weight: 800;
      box-shadow: 0 0 12px rgba(52, 152, 219, 0.4);
      transition: border-color 0.3s, box-shadow 0.3s;
    }
    .hnb-player-indicator.p2-turn {
      border-color: var(--color-2p);
      box-shadow: 0 0 12px rgba(231, 76, 60, 0.4);
    }
    .hnb-tools-group {
      display: flex;
      gap: 10px;
    }
    .hnb-icon-btn {
      background: #3a2b20;
      border: 1.5px solid #5a4535;
      color: var(--hnb-brass);
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.05rem;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    .hnb-table-board {
      width: 100%;
      max-width: 440px;
      background: radial-gradient(circle at 50% 30%, #3e2b1d 0%, #25170d 100%);
      border: 5px solid #1a1009;
      border-radius: 24px;
      padding: 16px 14px 20px;
      box-shadow:
        0 20px 40px rgba(0, 0, 0, 0.9),
        inset 0 2px 4px var(--hnb-wood-bevel),
        inset 0 -3px 8px rgba(0, 0, 0, 0.8);
      position: relative;
    }

    .hnb-secret-container {
      background: #170e08;
      border: 2px solid #0d0704;
      border-radius: 16px;
      padding: 10px 12px;
      display: flex;
      justify-content: center;
      gap: 12px;
      position: relative;
      overflow: hidden;
      box-shadow: inset 0 6px 14px rgba(0,0,0,0.9);
      margin-bottom: 14px;
    }
    .hnb-shutter {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, #533a28 0%, #342216 100%);
      border-bottom: 3px solid #180f08;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: var(--hnb-brass);
      font-weight: 800;
      letter-spacing: 2px;
      font-size: 0.9rem;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
      box-shadow: 0 4px 10px rgba(0,0,0,0.7);
      z-index: 10;
      transition: transform 0.65s cubic-bezier(0.77, 0, 0.175, 1);
    }
    .hnb-shutter.open {
      transform: translateY(-100%);
    }

    .hnb-rack {
      display: flex;
      flex-direction: column-reverse;
      gap: 7px;
      margin-bottom: 14px;
    }
    .hnb-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(0, 0, 0, 0.28);
      border: 1.5px solid transparent;
      padding: 5px 10px;
      border-radius: 12px;
      transition: background 0.2s, border-color 0.2s;
    }
    .hnb-row.active {
      background: rgba(229, 169, 80, 0.12);
      border-color: var(--hnb-brass);
      box-shadow: 0 0 10px rgba(229, 169, 80, 0.2);
    }
    .hnb-turn-num {
      font-size: 0.85rem;
      font-weight: 700;
      color: #8c7664;
      width: 18px;
      text-align: center;
    }
    .hnb-row.active .hnb-turn-num {
      color: var(--hnb-brass);
    }

    .hnb-holes {
      display: flex;
      gap: 10px;
    }
    .hnb-socket {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 60%, #110a06 0%, #050302 100%);
      box-shadow: inset 0 3px 5px rgba(0,0,0,0.9), 0 1px 1px rgba(255,255,255,0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }

    .hnb-sphere {
      width: 30px;
      height: 30px;
      border-radius: 50%;
      box-shadow: 0 4px 8px rgba(0,0,0,0.6), inset -2px -2px 5px rgba(0,0,0,0.5), inset 2px 2px 4px rgba(255,255,255,0.6);
      display: none;
    }

    .c-red { background: radial-gradient(circle at 35% 30%, #ff7675 0%, #d63031 70%, #851313 100%); }
    .c-blue { background: radial-gradient(circle at 35% 30%, #74b9ff 0%, #0984e3 70%, #0c4c80 100%); }
    .c-green { background: radial-gradient(circle at 35% 30%, #55efc4 0%, #00b894 70%, #036854 100%); }
    .c-yellow { background: radial-gradient(circle at 35% 30%, #ffeaa7 0%, #fdcb6e 70%, #c48b11 100%); }
    .c-white { background: radial-gradient(circle at 35% 30%, #ffffff 0%, #dfe6e9 70%, #7d8b94 100%); }
    .c-purple { background: radial-gradient(circle at 35% 30%, #d980fa 0%, #8854d0 70%, #482180 100%); }

    .hnb-pins-grid {
      display: grid;
      grid-template-columns: repeat(2, 11px);
      grid-template-rows: repeat(2, 11px);
      gap: 4px;
      padding: 3px;
      background: #150d08;
      border-radius: 6px;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.8);
    }
    .hnb-pin {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: #090503;
    }
    .hnb-pin.hit {
      background: radial-gradient(circle at 35% 35%, #ff4d4d, #b30000);
      box-shadow: 0 0 6px rgba(255, 60, 60, 0.9);
    }
    .hnb-pin.blow {
      background: radial-gradient(circle at 35% 35%, #ffffff, #a4b0be);
      box-shadow: 0 0 5px rgba(255, 255, 255, 0.7);
    }

    .hnb-tray {
      display: flex;
      justify-content: space-around;
      background: #1d130c;
      border: 2px solid #2f1f13;
      padding: 10px 12px;
      border-radius: 30px;
      box-shadow: inset 0 4px 8px rgba(0,0,0,0.9);
      margin-top: 10px;
    }
    .hnb-tray .hnb-sphere {
      display: block;
      width: 36px;
      height: 36px;
      cursor: pointer;
    }
    .hnb-tray .hnb-sphere:active {
      transform: scale(0.9);
    }

    .hnb-bottom-ctrl {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }
    .hnb-action-btn {
      flex: 1;
      padding: 13px;
      font-size: 0.95rem;
      font-weight: 800;
      border: none;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 5px 12px rgba(0,0,0,0.5);
    }
    .btn-del {
      background: #463426;
      color: #e1d3c7;
      border: 1px solid #5a4332;
    }
    .btn-submit {
      background: linear-gradient(180deg, #f39c12 0%, #d35400 100%);
      color: #fff;
      border: 1px solid #e67e22;
    }
    .btn-submit:disabled {
      background: #382c23;
      color: #6a5749;
      border: 1px solid #291f19;
      cursor: not-allowed;
      box-shadow: none;
    }

    /* モーダル */
    .hnb-modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.85);
      backdrop-filter: blur(5px);
      z-index: 99999;
      align-items: center;
      justify-content: center;
    }
    .hnb-modal-overlay.active {
      display: flex;
    }
    .hnb-modal-window {
      background: #2b1f16;
      border: 3px solid #533e2d;
      border-radius: 20px;
      padding: 24px;
      width: 90%;
      max-width: 360px;
      text-align: center;
      color: #f7ede2;
      box-shadow: 0 20px 45px rgba(0,0,0,0.85);
    }
    .dice-container {
      display: flex;
      justify-content: center;
      gap: 30px;
      margin: 20px 0;
    }
    .dice-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
    }
    .dice-box span {
      font-size: 0.9rem;
      font-weight: 700;
    }
    .dice {
      width: 60px;
      height: 60px;
      background: #f7ede2;
      color: #120b07;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      font-weight: 900;
      box-shadow: 0 4px 10px rgba(0,0,0,0.4);
    }
    .dice.rolling {
      animation: diceRoll 0.1s infinite;
    }
    @keyframes diceRoll {
      0% { transform: rotate(0deg); }
      50% { transform: rotate(8deg) scale(1.05); }
      100% { transform: rotate(-8deg); }
    }
    .hnb-modal-btn {
      width: 100%;
      padding: 12px;
      background: var(--hnb-brass);
      border: none;
      border-radius: 12px;
      color: #2b1f16;
      font-weight: 800;
      font-size: 1rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="hnb-wrapper">
    <div class="hnb-topbar">
      <div id="hnb-player-indicator" class="hnb-player-indicator">1Pの推理番</div>
      <div class="hnb-tools-group">
        <div class="hnb-icon-btn" onclick="hnbRestartGame()" title="最初から">🔄</div>
      </div>
    </div>

    <div class="hnb-table-board">
      <div class="hnb-secret-container">
        <div id="hnb-shutter" class="hnb-shutter">
          <span>🔒</span><span id="hnb-shutter-text">TARGET CODE</span>
        </div>
        <div class="hnb-socket"><div id="hnb-sec-0" class="hnb-sphere"></div></div>
        <div class="hnb-socket"><div id="hnb-sec-1" class="hnb-sphere"></div></div>
        <div class="hnb-socket"><div id="hnb-sec-2" class="hnb-sphere"></div></div>
        <div class="hnb-socket"><div id="hnb-sec-3" class="hnb-sphere"></div></div>
      </div>

      <div id="hnb-rack" class="hnb-rack"></div>

      <div class="hnb-tray">
        <div class="hnb-sphere c-red" onclick="hnbInsertPeg(1)"></div>
        <div class="hnb-sphere c-blue" onclick="hnbInsertPeg(2)"></div>
        <div class="hnb-sphere c-green" onclick="hnbInsertPeg(3)"></div>
        <div class="hnb-sphere c-yellow" onclick="hnbInsertPeg(4)"></div>
        <div class="hnb-sphere c-white" onclick="hnbInsertPeg(5)"></div>
        <div class="hnb-sphere c-purple" onclick="hnbInsertPeg(6)"></div>
      </div>

      <div class="hnb-bottom-ctrl">
        <button class="hnb-action-btn btn-del" onclick="hnbDeleteLastPeg()">取り消し</button>
        <button id="hnb-btn-check" class="hnb-action-btn btn-submit" onclick="hnbCheckAttempt()" disabled>決定 (CHECK)</button>
      </div>
    </div>
  </div>

  <!-- ダイスロール（先攻後攻決定）モーダル -->
  <div id="hnb-dice-modal" class="hnb-modal-overlay">
    <div class="hnb-modal-window">
      <h3 style="color:var(--hnb-brass)">🎲 先攻・後攻の決定</h3>
      <p style="font-size:0.85rem; color:#d8c8bc; margin-top:6px;">出目が大きい方が先攻です</p>
      
      <div class="dice-container">
        <div class="dice-box">
          <span style="color:var(--color-1p)">1P</span>
          <div id="dice-1p" class="dice">?</div>
        </div>
        <div class="dice-box">
          <span style="color:var(--color-2p)">2P</span>
          <div id="dice-2p" class="dice">?</div>
        </div>
      </div>

      <p id="dice-result-msg" style="font-weight:700; min-height:1.4em; margin-bottom:14px;"></p>
      <button id="btn-roll-dice" class="hnb-modal-btn" onclick="startDiceRoll()">ダイスを振る</button>
      <button id="btn-start-battle" class="hnb-modal-btn" style="display:none;" onclick="closeDiceModalAndStart()">バトル開始！</button>
    </div>
  </div>

  <script>
    let hnbAudioCtx = null;
    function getAudioCtx() {
      if (!hnbAudioCtx) hnbAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (hnbAudioCtx.state === 'suspended') hnbAudioCtx.resume();
      return hnbAudioCtx;
    }
    window.addEventListener('pointerdown', () => getAudioCtx(), { once: true });

    function playSound(type) {
      try {
        const ctx = getAudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        if (type === 'drop') {
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(450, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(70, ctx.currentTime + 0.06);
          gain.gain.setValueAtTime(0.25, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.06);
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(); osc.stop(ctx.currentTime + 0.07);
        } else if (type === 'hit') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(987.77, ctx.currentTime);
          gain.gain.setValueAtTime(0.2, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.09);
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(); osc.stop(ctx.currentTime + 0.1);
        } else if (type === 'blow') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(659.25, ctx.currentTime);
          gain.gain.setValueAtTime(0.18, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.09);
          osc.connect(gain); gain.connect(ctx.destination);
          osc.start(); osc.stop(ctx.currentTime + 0.1);
        }
      } catch (e) {}
    }

    const MAX_TURNS = 8;
    const COLOR_CLASSES = ['', 'c-red', 'c-blue', 'c-green', 'c-yellow', 'c-white', 'c-purple'];
    
    // システムが生成したターゲット暗号（2人とも同じ暗号を当てるスピード勝負、またはそれぞれ別の暗号）
    // ここでは「相手の暗号を当てる」設定として、各プレイヤー用に1つずつシステムが自動生成
    let targetCodes = [[], []]; // [1Pが解くターゲット, 2Pが解くターゲット]
    let playerHistories = [[], []]; // [1Pの履歴, 2Pの履歴]
    let activePlayer = 0; // 0: 1P, 1: 2P
    let currentInput = [0, 0, 0, 0];
    let isFinished = false;

    window.addEventListener('DOMContentLoaded', () => {
      openDiceModal();
    });

    function generateCode() {
      const candidates = [1, 2, 3, 4, 5, 6].sort(() => Math.random() - 0.5);
      return candidates.slice(0, 4);
    }

    function openDiceModal() {
      document.getElementById('hnb-dice-modal').classList.add('active');
      document.getElementById('dice-1p').textContent = '?';
      document.getElementById('dice-2p').textContent = '?';
      document.getElementById('dice-result-msg').textContent = '';
      document.getElementById('btn-roll-dice').style.display = 'block';
      document.getElementById('btn-start-battle').style.display = 'none';
    }

    function startDiceRoll() {
      const d1 = document.getElementById('dice-1p');
      const d2 = document.getElementById('dice-2p');
      const btn = document.getElementById('btn-roll-dice');
      btn.disabled = true;

      d1.classList.add('rolling');
      d2.classList.add('rolling');

      setTimeout(() => {
        let v1 = Math.floor(Math.random() * 6) + 1;
        let v2 = Math.floor(Math.random() * 6) + 1;
        while (v1 === v2) {
          v2 = Math.floor(Math.random() * 6) + 1; // 同点は自動振り直し
        }

        d1.classList.remove('rolling');
        d2.classList.remove('rolling');
        d1.textContent = v1;
        d2.textContent = v2;

        activePlayer = v1 > v2 ? 0 : 1;
        const msg = document.getElementById('dice-result-msg');
        msg.textContent = `${activePlayer === 0 ? '1P' : '2P'} の先攻でスタート！`;
        msg.style.color = activePlayer === 0 ? 'var(--color-1p)' : 'var(--color-2p)';

        btn.style.display = 'none';
        const startBtn = document.getElementById('btn-start-battle');
        startBtn.style.display = 'block';
        startBtn.disabled = false;
      }, 700);
    }

    function closeDiceModalAndStart() {
      document.getElementById('hnb-dice-modal').classList.remove('active');
      initBattle();
    }

    function initBattle() {
      isFinished = false;
      targetCodes = [generateCode(), generateCode()];
      playerHistories = [[], []];
      currentInput = [0, 0, 0, 0];

      const shutter = document.getElementById('hnb-shutter');
      shutter.classList.remove('open');

      renderBoardForCurrentPlayer();
    }

    function renderBoardForCurrentPlayer() {
      const pName = activePlayer === 0 ? '1P' : '2P';
      const indicator = document.getElementById('hnb-player-indicator');
      indicator.textContent = `${pName}の推理番 (残り${MAX_TURNS - playerHistories[activePlayer].length}手)`;
      indicator.className = `hnb-player-indicator ${activePlayer === 1 ? 'p2-turn' : ''}`;

      document.getElementById('hnb-shutter-text').textContent = `${pName}のターゲット暗号`;

      // 暗号玉をセット（シャッターの奥）
      const secret = targetCodes[activePlayer];
      for (let i = 0; i < 4; i++) {
        const el = document.getElementById('hnb-sec-' + i);
        el.className = 'hnb-sphere ' + COLOR_CLASSES[secret[i]];
        el.style.display = 'block';
      }

      // ラック再描画（現在のプレイヤーの履歴を表示）
      buildRack(playerHistories[activePlayer]);
      currentInput = [0, 0, 0, 0];
      refreshInputRow();
    }

    function buildRack(history) {
      const rackEl = document.getElementById('hnb-rack');
      rackEl.innerHTML = '';
      for (let r = 0; r < MAX_TURNS; r++) {
        const isCurrent = r === history.length;
        const row = document.createElement('div');
        row.className = 'hnb-row' + (isCurrent ? ' active' : '');
        row.id = `hnb-r-${r}`;

        const hist = history[r];
        row.innerHTML = `
          <span class="hnb-turn-num">${r + 1}</span>
          <div class="hnb-holes">
            ${[0, 1, 2, 3].map(col => `
              <div class="hnb-socket" onclick="clickSlot(${col})">
                <div id="hnb-sp-${r}-${col}" class="hnb-sphere ${hist ? COLOR_CLASSES[hist.input[col]] : ''}" style="${hist ? 'display:block;' : ''}"></div>
              </div>
            `).join('')}
          </div>
          <div class="hnb-pins-grid" id="hnb-pins-${r}">
            ${[0, 1, 2, 3].map(i => {
              let pinClass = '';
              if (hist) {
                if (i < hist.hits) pinClass = 'hit';
                else if (i < hist.hits + hist.blows) pinClass = 'blow';
              }
              return `<div class="hnb-pin ${pinClass}"></div>`;
            }).join('')}
          </div>
        `;
        rackEl.appendChild(row);
      }
    }

    function hnbInsertPeg(color) {
      if (isFinished) return;
      if (currentInput.includes(color)) return; // 重複なしルール
      const idx = currentInput.indexOf(0);
      if (idx !== -1) {
        currentInput[idx] = color;
        playSound('drop');
        refreshInputRow();
      }
    }

    function clickSlot(col) {
      if (isFinished) return;
      if (currentInput[col] !== 0) {
        currentInput[col] = 0;
        playSound('drop');
        refreshInputRow();
      }
    }

    function hnbDeleteLastPeg() {
      if (isFinished) return;
      for (let i = 3; i >= 0; i--) {
        if (currentInput[i] !== 0) {
          currentInput[i] = 0;
          playSound('drop');
          refreshInputRow();
          break;
        }
      }
    }

    function refreshInputRow() {
      const turn = playerHistories[activePlayer].length;
      if (turn >= MAX_TURNS) return;

      for (let col = 0; col < 4; col++) {
        const sp = document.getElementById(`hnb-sp-${turn}-${col}`);
        if (!sp) continue;
        const color = currentInput[col];
        if (color > 0) {
          sp.className = 'hnb-sphere ' + COLOR_CLASSES[color];
          sp.style.display = 'block';
        } else {
          sp.style.display = 'none';
        }
      }
      const ready = currentInput.every(c => c > 0);
      document.getElementById('hnb-btn-check').disabled = !ready || isFinished;
    }

    function hnbCheckAttempt() {
      if (isFinished) return;

      const secret = targetCodes[activePlayer];
      let hits = 0;
      let blows = 0;
      for (let i = 0; i < 4; i++) {
        if (currentInput[i] === secret[i]) hits++;
        else if (secret.includes(currentInput[i])) blows++;
      }

      const turn = playerHistories[activePlayer].length;
      const pins = document.getElementById(`hnb-pins-${turn}`).querySelectorAll('.hnb-pin');
      
      let p = 0;
      for (let i = 0; i < hits; i++) {
        const pin = pins[p++];
        setTimeout(() => { pin.className = 'hnb-pin hit'; playSound('hit'); }, i * 140);
      }
      for (let i = 0; i < blows; i++) {
        const pin = pins[p++];
        setTimeout(() => { pin.className = 'hnb-pin blow'; playSound('blow'); }, (hits + i) * 140);
      }

      playerHistories[activePlayer].push({ input: [...currentInput], hits, blows });
      document.getElementById('hnb-btn-check').disabled = true;

      const totalDelay = (hits + blows) * 140 + 600;

      setTimeout(() => {
        if (hits === 4) {
          isFinished = true;
          document.getElementById('hnb-shutter').classList.add('open');
          setTimeout(() => alert(`🎉 勝負あり！\n${activePlayer === 0 ? '1P' : '2P'}の勝利です！`), 250);
          return;
        }

        if (playerHistories[0].length >= MAX_TURNS && playerHistories[1].length >= MAX_TURNS) {
          isFinished = true;
          document.getElementById('hnb-shutter').classList.add('open');
          setTimeout(() => alert('規定ターン終了！引き分けです！'), 250);
          return;
        }

        // 次のプレイヤーへ交代
        activePlayer = activePlayer === 0 ? 1 : 0;
        renderBoardForCurrentPlayer();
      }, totalDelay);
    }

    function hnbRestartGame() {
      openDiceModal();
    }
  </script>
</body>
</html>
