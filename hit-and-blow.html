<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ヒット＆ブロー (Hit & Blow)</title>
  <style>
    /* =========================================
       ベースリセット・フォント設定
    ========================================= */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background-color: #120b07;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: #fff;
    }

    /* =========================================
       ヒット＆ブロー 8ターン版
    ========================================= */
    :root {
      --hnb-board-wood: #2c1e14;
      --hnb-board-edge: #180f09;
      --hnb-slot-bg: #140d08;
      --hnb-wood-bevel: rgba(255, 255, 255, 0.08);
    }

    .hnb-wrapper {
      width: 100%;
      min-height: 100vh;
      padding: 40px 16px 60px;
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      user-select: none;
      -webkit-user-select: none;
    }

    /* 上部ヘッダー・設定 */
    .hnb-topbar {
      width: 100%;
      max-width: 440px;
      display: flex;
      justify-content: flex-end;
      margin-bottom: 10px;
      gap: 10px;
    }
    .hnb-icon-btn {
      background: #3a2b20;
      border: 1.5px solid #5a4535;
      color: #e5a950;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.1rem;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      transition: transform 0.15s, background 0.15s;
    }
    .hnb-icon-btn:hover {
      transform: scale(1.1);
      background: #4a382a;
      color: #fff;
    }

    /* メインウッドボード */
    .hnb-table-board {
      width: 100%;
      max-width: 430px;
      background: radial-gradient(circle at 50% 30%, #3e2b1d 0%, #25170d 100%);
      border: 6px solid #1a1009;
      border-radius: 26px;
      padding: 20px 16px 22px;
      box-shadow:
        0 25px 50px rgba(0, 0, 0, 0.9),
        inset 0 2px 4px var(--hnb-wood-bevel),
        inset 0 -3px 8px rgba(0, 0, 0, 0.8);
      position: relative;
    }

    /* 上部：隠し正解エリア & スライド木製バイザー */
    .hnb-secret-container {
      background: #170e08;
      border: 2px solid #0d0704;
      border-radius: 16px;
      padding: 10px 14px;
      display: flex;
      justify-content: center;
      gap: 14px;
      position: relative;
      overflow: hidden;
      box-shadow: inset 0 6px 14px rgba(0,0,0,0.9);
      margin-bottom: 16px;
    }
    .hnb-shutter {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(180deg, #533a28 0%, #342216 100%);
      border-bottom: 3px solid #180f08;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: #e5a950;
      font-weight: 800;
      letter-spacing: 3px;
      font-size: 0.95rem;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
      box-shadow: 0 4px 10px rgba(0,0,0,0.7);
      z-index: 10;
      transition: transform 0.65s cubic-bezier(0.77, 0, 0.175, 1);
    }
    .hnb-shutter.no-anim {
      transition: none !important;
    }
    .hnb-shutter.open {
      transform: translateY(-100%);
    }

    /* 8ターン分の履歴ラック (下から上へ進行) */
    .hnb-rack {
      display: flex;
      flex-direction: column-reverse;
      gap: 8px;
      margin-bottom: 16px;
    }
    .hnb-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(0, 0, 0, 0.28);
      border: 1.5px solid transparent;
      padding: 6px 12px;
      border-radius: 14px;
      transition: background 0.2s, border-color 0.2s, transform 0.2s;
    }
    .hnb-row.active {
      background: rgba(229, 169, 80, 0.12);
      border-color: #e5a950;
      box-shadow: 0 0 12px rgba(229, 169, 80, 0.2);
      transform: scale(1.02);
    }
    .hnb-turn-num {
      font-size: 0.85rem;
      font-weight: 700;
      color: #8c7664;
      width: 20px;
      text-align: center;
    }
    .hnb-row.active .hnb-turn-num {
      color: #e5a950;
    }

    /* ペグソケット穴 */
    .hnb-holes {
      display: flex;
      gap: 12px;
    }
    .hnb-socket {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 60%, #110a06 0%, #050302 100%);
      box-shadow:
        inset 0 3px 6px rgba(0,0,0,0.9),
        0 1px 1px rgba(255,255,255,0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      position: relative;
    }

    /* 球体マーブルペグ */
    .hnb-sphere {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      box-shadow:
        0 5px 10px rgba(0,0,0,0.6),
        inset -2px -3px 6px rgba(0,0,0,0.5),
        inset 2px 2px 5px rgba(255,255,255,0.6);
      transition: transform 0.18s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      display: none;
    }
    .hnb-socket:hover .hnb-sphere {
      transform: scale(1.08);
    }

    /* 6色パレット */
    .c-red { background: radial-gradient(circle at 35% 30%, #ff7675 0%, #d63031 70%, #851313 100%); }
    .c-blue { background: radial-gradient(circle at 35% 30%, #74b9ff 0%, #0984e3 70%, #0c4c80 100%); }
    .c-green { background: radial-gradient(circle at 35% 30%, #55efc4 0%, #00b894 70%, #036854 100%); }
    .c-yellow { background: radial-gradient(circle at 35% 30%, #ffeaa7 0%, #fdcb6e 70%, #c48b11 100%); }
    .c-white { background: radial-gradient(circle at 35% 30%, #ffffff 0%, #dfe6e9 70%, #7d8b94 100%); }
    .c-purple { background: radial-gradient(circle at 35% 30%, #d980fa 0%, #8854d0 70%, #482180 100%); }

    /* 判定ピンエリア (Hit & Blow) */
    .hnb-pins-grid {
      display: grid;
      grid-template-columns: repeat(2, 12px);
      grid-template-rows: repeat(2, 12px);
      gap: 5px;
      padding: 3px;
      background: #150d08;
      border-radius: 8px;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.8);
    }
    .hnb-pin {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #090503;
      box-shadow: inset 0 1px 2px rgba(0,0,0,0.9);
    }
    .hnb-pin.hit {
      background: radial-gradient(circle at 35% 35%, #ff4d4d, #b30000);
      box-shadow: 0 0 7px rgba(255, 60, 60, 0.9), inset 1px 1px 2px rgba(255,255,255,0.6);
    }
    .hnb-pin.blow {
      background: radial-gradient(circle at 35% 35%, #ffffff, #a4b0be);
      box-shadow: 0 0 6px rgba(255, 255, 255, 0.7), inset 1px 1px 2px #fff;
    }

    /* 下部ペグ選択トレイ */
    .hnb-tray {
      display: flex;
      justify-content: space-around;
      background: #1d130c;
      border: 2px solid #2f1f13;
      padding: 12px 14px;
      border-radius: 36px;
      box-shadow:
        inset 0 4px 10px rgba(0,0,0,0.9),
        0 2px 4px rgba(255,255,255,0.06);
      margin-top: 12px;
    }
    .hnb-tray .hnb-sphere {
      display: block;
      width: 38px;
      height: 38px;
      cursor: pointer;
      transition: transform 0.18s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    .hnb-tray .hnb-sphere:hover {
      transform: translateY(-6px) scale(1.18);
    }
    .hnb-tray .hnb-sphere:active {
      transform: scale(0.92);
    }

    /* 操作アクションボタン */
    .hnb-bottom-ctrl {
      display: flex;
      gap: 12px;
      margin-top: 14px;
    }
    .hnb-action-btn {
      flex: 1;
      padding: 12px;
      font-size: 0.95rem;
      font-weight: 800;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      font-family: inherit;
      box-shadow: 0 6px 14px rgba(0,0,0,0.5);
      transition: all 0.15s;
    }
    .btn-del {
      background: #463426;
      color: #e1d3c7;
      border: 1px solid #5a4332;
    }
    .btn-del:hover {
      background: #574130;
      color: #fff;
    }
    .btn-submit {
      background: linear-gradient(180deg, #f39c12 0%, #d35400 100%);
      color: #fff;
      text-shadow: 0 1px 3px rgba(0,0,0,0.5);
      border: 1px solid #e67e22;
    }
    .btn-submit:disabled {
      background: #382c23;
      color: #6a5749;
      border: 1px solid #291f19;
      cursor: not-allowed;
      box-shadow: none;
      text-shadow: none;
    }

    /* 設定モーダル */
    .hnb-modal-overlay {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.75);
      backdrop-filter: blur(4px);
      z-index: 99999;
      align-items: center;
      justify-content: center;
    }
    .hnb-modal-overlay.active {
      display: flex;
    }
    .hnb-modal-window {
      background: #2b1f16;
      border: 3px solid #533e2d;
      border-radius: 20px;
      padding: 24px;
      width: 88%;
      max-width: 360px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.8);
      text-align: center;
      color: #f7ede2;
    }
    .hnb-modal-window h3 {
      margin-top: 0;
      font-size: 1.3rem;
      color: #e5a950;
    }
    .hnb-setting-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 0;
      border-bottom: 1px solid #3d2c20;
      font-size: 0.95rem;
    }
    .hnb-switch {
      position: relative;
      display: inline-block;
      width: 50px;
      height: 26px;
    }
    .hnb-switch input { opacity: 0; width: 0; height: 0; }
    .hnb-slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: #443224;
      transition: .3s;
      border-radius: 26px;
    }
    .hnb-slider:before {
      position: absolute;
      content: "";
      height: 20px;
      width: 20px;
      left: 3px;
      bottom: 3px;
      background-color: #fff;
      transition: .3s;
      border-radius: 50%;
    }
    input:checked + .hnb-slider {
      background-color: #e5a950;
    }
    input:checked + .hnb-slider:before {
      transform: translateX(24px);
    }
    .hnb-modal-close {
      margin-top: 20px;
      width: 100%;
      padding: 10px;
      background: #e5a950;
      border: none;
      border-radius: 12px;
      color: #2b1f16;
      font-weight: 800;
      font-size: 1rem;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="hnb-wrapper">
    <!-- 右上ツールバー -->
    <div class="hnb-topbar">
      <div class="hnb-icon-btn" onclick="hnbGiveUpAndReveal()" title="正解を見る（ギブアップ）">👁️</div>
      <div class="hnb-icon-btn" onclick="hnbRestartGame()" title="もう一度遊ぶ">🔄</div>
      <div class="hnb-icon-btn" onclick="hnbToggleModal(true)" title="ゲーム設定">⚙️</div>
    </div>

    <!-- 木製ゲーム盤面 -->
    <div class="hnb-table-board">
      <!-- 正解エリア（木製シャッター） -->
      <div class="hnb-secret-container">
        <div id="hnb-shutter" class="hnb-shutter">
          <span>🔒</span><span>SECRET CODE</span>
        </div>
        <div class="hnb-socket"><div id="hnb-sec-0" class="hnb-sphere"></div></div>
        <div class="hnb-socket"><div id="hnb-sec-1" class="hnb-sphere"></div></div>
        <div class="hnb-socket"><div id="hnb-sec-2" class="hnb-sphere"></div></div>
        <div class="hnb-socket"><div id="hnb-sec-3" class="hnb-sphere"></div></div>
      </div>

      <!-- 8ターン分のラック -->
      <div id="hnb-rack" class="hnb-rack"></div>

      <!-- ペグ選択トレイ (1:赤, 2:青, 3:緑, 4:黄, 5:白, 6:紫) -->
      <div class="hnb-tray">
        <div class="hnb-sphere c-red" onclick="hnbInsertPeg(1)"></div>
        <div class="hnb-sphere c-blue" onclick="hnbInsertPeg(2)"></div>
        <div class="hnb-sphere c-green" onclick="hnbInsertPeg(3)"></div>
        <div class="hnb-sphere c-yellow" onclick="hnbInsertPeg(4)"></div>
        <div class="hnb-sphere c-white" onclick="hnbInsertPeg(5)"></div>
        <div class="hnb-sphere c-purple" onclick="hnbInsertPeg(6)"></div>
      </div>

      <!-- 操作ボタン -->
      <div class="hnb-bottom-ctrl">
        <button class="hnb-action-btn btn-del" onclick="hnbDeleteLastPeg()">取り消し</button>
        <button id="hnb-btn-check" class="hnb-action-btn btn-submit" onclick="hnbCheckAttempt()" disabled>決定 (CHECK)</button>
      </div>
    </div>
  </div>

  <!-- 設定モーダル -->
  <div id="hnb-settings-modal" class="hnb-modal-overlay">
    <div class="hnb-modal-window">
      <h3>⚙️ ゲーム設定</h3>
      <div class="hnb-setting-row">
        <span>正解の色の重複を許可</span>
        <label class="hnb-switch">
          <input type="checkbox" id="hnb-allow-duplicates-toggle" onchange="hnbToggleDuplicateSetting(this.checked)">
          <span class="hnb-slider"></span>
        </label>
      </div>
      <p style="font-size:0.75rem; color:#bfa693; margin-top:8px; text-align:left;">
        ※ONにすると「赤・赤・青・緑」のように同じ色が複数入る上級者ルールになります。
      </p>
      <button class="hnb-modal-close" onclick="hnbToggleModal(false)">閉じる</button>
    </div>
  </div>

  <script>
    /* =========================================
       サウンド合成エンジン (Web Audio API)
    ========================================= */
    let hnbAudioCtx = null;

    function hnbGetAudioContext() {
      if (!hnbAudioCtx) {
        hnbAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (hnbAudioCtx.state === 'suspended') {
        hnbAudioCtx.resume();
      }
      return hnbAudioCtx;
    }

    function hnbPlayPegDropSound() {
      try {
        const ctx = hnbGetAudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(450, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(70, ctx.currentTime + 0.06);
        gain.gain.setValueAtTime(0.25, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.06);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.07);
      } catch (e) {}
    }

    function hnbPlayPinSound(isHit) {
      try {
        const ctx = hnbGetAudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'sine';
        const freq = isHit ? 987.77 : 659.25;
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        gain.gain.setValueAtTime(0.18, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.09);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.1);
      } catch (e) {}
    }

    function hnbPlayVictorySound() {
      try {
        const ctx = hnbGetAudioContext();
        const notes = [523.25, 659.25, 783.99, 1046.50];
        notes.forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.12);
          gain.gain.setValueAtTime(0.2, ctx.currentTime + idx * 0.12);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + idx * 0.12 + 0.35);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + idx * 0.12);
          osc.stop(ctx.currentTime + idx * 0.12 + 0.36);
        });
      } catch (e) {}
    }

    function hnbPlayGiveUpSound() {
      try {
        const ctx = hnbGetAudioContext();
        const notes = [440, 392, 349.23];
        notes.forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, ctx.currentTime + idx * 0.12);
          gain.gain.setValueAtTime(0.18, ctx.currentTime + idx * 0.12);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + idx * 0.12 + 0.25);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + idx * 0.12);
          osc.stop(ctx.currentTime + idx * 0.12 + 0.26);
        });
      } catch (e) {}
    }

    /* =========================================
       ゲームロジック (MAX_TURNS = 8)
    ========================================= */
    const MAX_TURNS = 8;
    const COLOR_CLASSES = ['', 'c-red', 'c-blue', 'c-green', 'c-yellow', 'c-white', 'c-purple'];
    let hnbAllowDuplicates = false;
    let hnbSecretCode = [];
    let hnbTurn = 0;
    let hnbCurrentInput = [0, 0, 0, 0];
    let hnbIsFinished = false;

    // ページ読み込み時にゲーム初期化
    window.addEventListener('DOMContentLoaded', () => {
      hnbInitGame();
    });

    // キーボードショートカット (1~6: ペグ配置, Backspace: 1つ削除, Enter: 判定)
    window.addEventListener('keydown', (e) => {
      // モーダル表示中はキー無効
      const modal = document.getElementById('hnb-settings-modal');
      if (modal && modal.classList.contains('active')) return;

      if (e.key >= '1' && e.key <= '6') {
        hnbInsertPeg(parseInt(e.key, 10));
      } else if (e.key === 'Backspace') {
        hnbDeleteLastPeg();
      } else if (e.key === 'Enter') {
        const btn = document.getElementById('hnb-btn-check');
        if (btn && !btn.disabled) hnbCheckAttempt();
      }
    });

    function hnbInitGame() {
      hnbIsFinished = false;
      hnbTurn = 0;
      hnbCurrentInput = [0, 0, 0, 0];

      // 【チラ見え防止対策 1】シャッターを即座に閉じる
      const shutter = document.getElementById('hnb-shutter');
      shutter.classList.add('no-anim');
      shutter.classList.remove('open');
      shutter.offsetHeight; // リフロー強制

      // 【チラ見え防止対策 2】正解ペグを即座に非表示
      for (let i = 0; i < 4; i++) {
        const secSphere = document.getElementById('hnb-sec-' + i);
        secSphere.style.display = 'none';
        secSphere.className = 'hnb-sphere';
      }

      // 正解コード生成
      hnbSecretCode = [];
      if (hnbAllowDuplicates) {
        for (let i = 0; i < 4; i++) {
          hnbSecretCode.push(Math.floor(Math.random() * 6) + 1);
        }
      } else {
        const candidates = [1, 2, 3, 4, 5, 6].sort(() => Math.random() - 0.5);
        hnbSecretCode = candidates.slice(0, 4);
      }

      // シャッターが完全に覆われた後に正解ペグを裏側でセット
      setTimeout(() => {
        for (let i = 0; i < 4; i++) {
          const secSphere = document.getElementById('hnb-sec-' + i);
          secSphere.className = 'hnb-sphere ' + COLOR_CLASSES[hnbSecretCode[i]];
          secSphere.style.display = 'block';
        }
        shutter.classList.remove('no-anim');
      }, 50);

      // 8行分ラック構築
      const rackEl = document.getElementById('hnb-rack');
      rackEl.innerHTML = '';
      for (let r = 0; r < MAX_TURNS; r++) {
        const row = document.createElement('div');
        row.className = 'hnb-row' + (r === 0 ? ' active' : '');
        row.id = `hnb-r-${r}`;
        row.innerHTML = `
          <span class="hnb-turn-num">${r + 1}</span>
          <div class="hnb-holes">
            ${[0, 1, 2, 3].map(col => `
              <div class="hnb-socket" onclick="hnbClickSlot(${r},${col})">
                <div id="hnb-sp-${r}-${col}" class="hnb-sphere"></div>
              </div>
            `).join('')}
          </div>
          <div class="hnb-pins-grid" id="hnb-pins-${r}">
            <div class="hnb-pin"></div>
            <div class="hnb-pin"></div>
            <div class="hnb-pin"></div>
            <div class="hnb-pin"></div>
          </div>
        `;
        rackEl.appendChild(row);
      }

      hnbRefreshCurrentRow();
    }

    function hnbGiveUpAndReveal() {
      if (hnbIsFinished) {
        document.getElementById('hnb-shutter').classList.add('open');
        return;
      }

      const ok = confirm('正解を表示してギブアップしますか？');
      if (!ok) return;

      hnbIsFinished = true;
      hnbPlayGiveUpSound();
      document.getElementById('hnb-shutter').classList.add('open');
      document.getElementById('hnb-btn-check').disabled = true;

      const activeRow = document.getElementById(`hnb-r-${hnbTurn}`);
      if (activeRow) activeRow.classList.remove('active');
    }

    function hnbInsertPeg(colorIdx) {
      if (hnbIsFinished) return;
      const nextSlot = hnbCurrentInput.findIndex(val => val === 0);
      if (nextSlot !== -1) {
        hnbCurrentInput[nextSlot] = colorIdx;
        hnbPlayPegDropSound();
        hnbRefreshCurrentRow();
      }
    }

    function hnbClickSlot(rowIdx, colIdx) {
      if (hnbIsFinished || rowIdx !== hnbTurn) return;
      if (hnbCurrentInput[colIdx] !== 0) {
        hnbCurrentInput[colIdx] = 0;
        hnbPlayPegDropSound();
        hnbRefreshCurrentRow();
      }
    }

    function hnbDeleteLastPeg() {
      if (hnbIsFinished) return;
      for (let i = 3; i >= 0; i--) {
        if (hnbCurrentInput[i] !== 0) {
          hnbCurrentInput[i] = 0;
          hnbPlayPegDropSound();
          hnbRefreshCurrentRow();
          break;
        }
      }
    }

    function hnbRefreshCurrentRow() {
      for (let col = 0; col < 4; col++) {
        const sphere = document.getElementById(`hnb-sp-${hnbTurn}-${col}`);
        const color = hnbCurrentInput[col];
        if (color > 0) {
          sphere.className = 'hnb-sphere ' + COLOR_CLASSES[color];
          sphere.style.display = 'block';
        } else {
          sphere.style.display = 'none';
        }
      }
      const isReady = hnbCurrentInput.every(c => c > 0);
      document.getElementById('hnb-btn-check').disabled = !isReady || hnbIsFinished;
    }

    function hnbCheckAttempt() {
      if (hnbIsFinished) return;

      let hits = 0;
      let blows = 0;
      const secretCopy = [...hnbSecretCode];
      const inputCopy = [...hnbCurrentInput];

      // 1. 完全一致 (Hit)
      for (let i = 0; i < 4; i++) {
        if (inputCopy[i] === secretCopy[i]) {
          hits++;
          secretCopy[i] = null;
          inputCopy[i] = null;
        }
      }

      // 2. 色のみ一致 (Blow)
      for (let i = 0; i < 4; i++) {
        if (inputCopy[i] !== null) {
          const foundIdx = secretCopy.indexOf(inputCopy[i]);
          if (foundIdx !== -1) {
            blows++;
            secretCopy[foundIdx] = null;
          }
        }
      }

      const pinsContainer = document.getElementById(`hnb-pins-${hnbTurn}`);
      const pinEls = pinsContainer.querySelectorAll('.hnb-pin');
      let pIdx = 0;

      for (let i = 0; i < hits; i++) {
        const el = pinEls[pIdx++];
        setTimeout(() => {
          el.className = 'hnb-pin hit';
          hnbPlayPinSound(true);
        }, i * 140);
      }
      for (let i = 0; i < blows; i++) {
        const el = pinEls[pIdx++];
        setTimeout(() => {
          el.className = 'hnb-pin blow';
          hnbPlayPinSound(false);
        }, (hits + i) * 140);
      }

      const totalDelay = (hits + blows) * 140 + 200;

      // 勝利判定
      if (hits === 4) {
        hnbIsFinished = true;
        setTimeout(() => {
          hnbPlayVictorySound();
          document.getElementById('hnb-shutter').classList.add('open');
        }, totalDelay);
        return;
      }

      // 次のターンへ
      setTimeout(() => {
        document.getElementById(`hnb-r-${hnbTurn}`).classList.remove('active');
        hnbTurn++;

        if (hnbTurn >= MAX_TURNS) {
          hnbIsFinished = true;
          document.getElementById('hnb-shutter').classList.add('open');
          return;
        }

        hnbCurrentInput = [0, 0, 0, 0];
        document.getElementById(`hnb-r-${hnbTurn}`).classList.add('active');
        hnbRefreshCurrentRow();
      }, totalDelay);
    }

    function hnbRestartGame() {
      hnbInitGame();
    }

    function hnbToggleModal(show) {
      document.getElementById('hnb-settings-modal').classList.toggle('active', show);
    }

    function hnbToggleDuplicateSetting(enabled) {
      hnbAllowDuplicates = enabled;
    }
  </script>
</body>
</html>
