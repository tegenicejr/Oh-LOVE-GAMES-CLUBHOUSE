<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>HIT & BLOW - Master Edition</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      background-color: #120b07;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      color: #fff;
      overflow-x: hidden;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
    }

    :root {
      --hnb-wood-bevel: rgba(255, 255, 255, 0.08);
      --hnb-brass: #e5a950;
      --hnb-brass-glow: rgba(229, 169, 80, 0.45);
      --c-p1: #3498db;
      --c-p2: #e74c3c;
    }

    .hnb-wrapper {
      width: 100%;
      min-height: 100%;
      padding: calc(16px + env(safe-area-inset-top)) 14px calc(30px + env(safe-area-inset-bottom));
      display: flex;
      flex-direction: column;
      align-items: center;
      position: relative;
      user-select: none;
      -webkit-user-select: none;
    }

    /* 上部ステータス */
    .hnb-topbar {
      width: 100%;
      max-width: 440px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .hnb-player-indicator {
      background: #25170d;
      border: 2px solid var(--hnb-brass);
      color: #fff;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 0.9rem;
      font-weight: 800;
      box-shadow: 0 0 12px var(--hnb-brass-glow);
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .hnb-icon-btn {
      background: #3a2b20;
      border: 1.5px solid #5a4535;
      color: var(--hnb-brass);
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1rem;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
    }

    /* ゲーム盤 */
    .hnb-table-board {
      width: 100%;
      max-width: 440px;
      background: radial-gradient(circle at 50% 30%, #3e2b1d 0%, #25170d 100%);
      border: 5px solid #1a1009;
      border-radius: 22px;
      padding: 14px 12px 18px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.9), inset 0 2px 4px var(--hnb-wood-bevel);
      position: relative;
    }

    /* 暗号シャッター */
    .hnb-secret-container {
      background: #170e08;
      border: 2px solid #0d0704;
      border-radius: 14px;
      padding: 10px;
      display: flex;
      justify-content: center;
      gap: 12px;
      position: relative;
      overflow: hidden;
      margin-bottom: 12px;
    }
    .hnb-shutter {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(180deg, #533a28 0%, #342216 100%);
      border-bottom: 3px solid #180f08;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      color: var(--hnb-brass);
      font-weight: 800;
      letter-spacing: 2px;
      font-size: 0.85rem;
      z-index: 10;
      transition: transform 0.65s cubic-bezier(0.77, 0, 0.175, 1);
    }
    .hnb-shutter.open { transform: translateY(-100%); }

    /* ラック・ピン */
    .hnb-rack {
      display: flex;
      flex-direction: column-reverse;
      gap: 6px;
      margin-bottom: 12px;
    }
    .hnb-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(0, 0, 0, 0.3);
      border: 1.5px solid transparent;
      padding: 5px 8px;
      border-radius: 10px;
    }
    .hnb-row.active {
      background: rgba(229, 169, 80, 0.12);
      border-color: var(--hnb-brass);
      box-shadow: 0 0 8px rgba(229, 169, 80, 0.3);
    }
    .hnb-turn-badge {
      font-size: 0.72rem;
      font-weight: 800;
      padding: 3px 6px;
      border-radius: 6px;
      background: #25170d;
      color: #9e8979;
      min-width: 58px;
      text-align: center;
      white-space: nowrap;
    }
    .hnb-row.active .hnb-turn-badge {
      color: var(--hnb-brass);
      border: 1px solid var(--hnb-brass);
    }

    .hnb-holes { display: flex; gap: 8px; }
    .hnb-socket {
      width: 34px; height: 34px;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 60%, #110a06 0%, #050302 100%);
      box-shadow: inset 0 3px 5px rgba(0,0,0,0.9);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .hnb-sphere {
      width: 28px; height: 28px;
      border-radius: 50%;
      box-shadow: 0 3px 6px rgba(0,0,0,0.6), inset -2px -2px 4px rgba(0,0,0,0.5), inset 2px 2px 3px rgba(255,255,255,0.6);
      display: none;
    }
    .c-red { background: radial-gradient(circle at 35% 30%, #ff7675, #d63031 70%, #851313); }
    .c-blue { background: radial-gradient(circle at 35% 30%, #74b9ff, #0984e3 70%, #0c4c80); }
    .c-green { background: radial-gradient(circle at 35% 30%, #55efc4, #00b894 70%, #036854); }
    .c-yellow { background: radial-gradient(circle at 35% 30%, #ffeaa7, #fdcb6e 70%, #c48b11); }
    .c-white { background: radial-gradient(circle at 35% 30%, #ffffff, #dfe6e9 70%, #7d8b94); }
    .c-purple { background: radial-gradient(circle at 35% 30%, #d980fa, #8854d0 70%, #482180); }

    .hnb-pins-grid {
      display: grid;
      grid-template-columns: repeat(2, 10px);
      grid-template-rows: repeat(2, 10px);
      gap: 4px;
      padding: 3px;
      background: #150d08;
      border-radius: 6px;
    }
    .hnb-pin { width: 10px; height: 10px; border-radius: 50%; background: #090503; }
    .hnb-pin.hit { background: #ff4d4d; box-shadow: 0 0 6px #ff3c3c; }
    .hnb-pin.blow { background: #ffffff; box-shadow: 0 0 5px #fff; }

    /* トレイ & 操作ボタン */
    .hnb-tray {
      display: flex;
      justify-content: space-around;
      background: #1d130c;
      border: 2px solid #2f1f13;
      padding: 8px 10px;
      border-radius: 24px;
      margin-top: 8px;
    }
    .hnb-tray .hnb-sphere { display: block; width: 34px; height: 34px; cursor: pointer; }
    .hnb-bottom-ctrl { display: flex; gap: 10px; margin-top: 12px; }
    .hnb-action-btn {
      flex: 1; padding: 12px; font-size: 0.95rem; font-weight: 800; border: none; border-radius: 12px; cursor: pointer;
    }
    .btn-del { background: #463426; color: #e1d3c7; border: 1px solid #5a4332; }
    .btn-submit {
      background: linear-gradient(180deg, #f39c12, #d35400); color: #fff; border: 1px solid #e67e22;
    }
    .btn-submit:disabled { background: #382c23; color: #6a5749; border: 1px solid #291f19; cursor: not-allowed; }

    /* モーダル共通 */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(10, 6, 4, 0.88);
      backdrop-filter: blur(6px);
      z-index: 10000;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .modal-card {
      background: radial-gradient(circle at 50% 20%, #3a271a, #20130a);
      border: 3px solid #634732;
      border-radius: 24px;
      padding: 24px 20px;
      width: 90%;
      max-width: 420px;
      color: #f7ede2;
      box-shadow: 0 25px 60px rgba(0,0,0,0.95);
      position: relative;
    }

    /* スタート画面ビジュアル演出 */
    .title-logo {
      text-align: center;
      font-size: 1.65rem;
      font-weight: 900;
      letter-spacing: 3px;
      color: var(--hnb-brass);
      text-shadow: 0 3px 10px rgba(0,0,0,0.9);
      margin-bottom: 2px;
    }
    .title-sub {
      text-align: center;
      font-size: 0.8rem;
      letter-spacing: 1px;
      color: #c9b09f;
      margin-bottom: 14px;
    }
    .title-spheres-tray {
      display: flex;
      justify-content: center;
      gap: 10px;
      background: #170d07;
      border: 1.5px solid #3d2b1f;
      padding: 10px 14px;
      border-radius: 24px;
      box-shadow: inset 0 3px 8px rgba(0,0,0,0.8);
      margin-bottom: 20px;
    }
    .title-spheres-tray .hnb-sphere {
      display: block;
      width: 32px;
      height: 32px;
    }

    .mode-tab-group {
      display: flex;
      gap: 10px;
      background: #170d07;
      padding: 4px;
      border-radius: 12px;
      margin-bottom: 18px;
    }
    .mode-tab-btn {
      flex: 1;
      padding: 9px 0;
      background: transparent;
      border: none;
      color: #a89485;
      font-size: 0.88rem;
      font-weight: 800;
      border-radius: 9px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .mode-tab-btn.active {
      background: #4a3424;
      color: #fff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.5);
    }
    .menu-group {
      background: rgba(0,0,0,0.3);
      border: 1px solid #4a3525;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 20px;
    }
    .menu-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 0;
      font-size: 0.86rem;
    }
    .menu-select {
      background: #180e08;
      border: 1.5px solid var(--hnb-brass);
      color: #fff;
      padding: 6px 12px;
      border-radius: 8px;
      font-weight: 700;
      font-size: 0.85rem;
      outline: none;
    }
    .btn-main-start {
      width: 100%;
      padding: 14px;
      background: linear-gradient(180deg, #e5a950, #c48227);
      border: none;
      border-radius: 14px;
      color: #1b1007;
      font-size: 1.05rem;
      font-weight: 900;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(229, 169, 80, 0.4);
    }

    /* 白ダイス */
    .dice-grid {
      display: flex;
      justify-content: center;
      gap: 28px;
      margin: 20px 0;
    }
    .dice-card {
      background: #180e08;
      border: 1.5px solid #483323;
      border-radius: 14px;
      padding: 12px 16px;
      text-align: center;
    }
    .dice-name { font-size: 0.85rem; font-weight: 800; margin-bottom: 10px; }
    
    .dice-white-face {
      width: 66px;
      height: 66px;
      background: #fdfdfd;
      border-radius: 12px;
      box-shadow: inset 0 2px 4px rgba(255,255,255,0.8), 0 6px 14px rgba(0,0,0,0.6);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      padding: 6px;
      margin: 0 auto;
    }
    .dice-white-face.rolling { animation: diceWiggle 0.1s infinite; }

    .pip {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: #1b1b1b;
      margin: auto;
      visibility: hidden;
    }
    .pip-center-red {
      width: 22px;
      height: 22px;
      background: #d63031 !important;
    }

    @keyframes diceWiggle {
      0% { transform: rotate(-8deg) scale(1.05); }
      50% { transform: rotate(8deg); }
      100% { transform: rotate(-8deg); }
    }
  </style>
</head>
<body>

  <div class="hnb-wrapper">
    <div class="hnb-topbar">
      <div id="hnb-current-turn-label" class="hnb-player-indicator">推理番 (残り8手)</div>
      <div class="hnb-tools-group">
        <div class="hnb-icon-btn" onclick="hnbReturnToTitle()" title="タイトルに戻る">🏠</div>
      </div>
    </div>

    <!-- ゲーム盤 -->
    <div class="hnb-table-board">
      <div class="hnb-secret-container">
        <div id="hnb-shutter" class="hnb-shutter">
          <span>🔒</span><span>SECRET CODE</span>
        </div>
        <div class="hnb-socket"><div id="hnb-sec-0" class="hnb-sphere"></div></div>
        <div class="hnb-socket"><div id="hnb-sec-1" class="hnb-sphere"></div></div>
        <div class="hnb-socket"><div id="hnb-sec-2" class="hnb-sphere"></div></div>
        <div class="hnb-socket"><div id="hnb-sec-3" class="hnb-sphere"></div></div>
      </div>

      <div id="hnb-rack" class="hnb-rack"></div>

      <div class="hnb-tray">
        <div class="hnb-sphere c-red" onclick="hnbInputColor(1)"></div>
        <div class="hnb-sphere c-blue" onclick="hnbInputColor(2)"></div>
        <div class="hnb-sphere c-green" onclick="hnbInputColor(3)"></div>
        <div class="hnb-sphere c-yellow" onclick="hnbInputColor(4)"></div>
        <div class="hnb-sphere c-white" onclick="hnbInputColor(5)"></div>
        <div class="hnb-sphere c-purple" onclick="hnbInputColor(6)"></div>
      </div>

      <div class="hnb-bottom-ctrl">
        <button class="hnb-action-btn btn-del" onclick="hnbDeleteColor()">取り消し</button>
        <button id="hnb-submit-btn" class="hnb-action-btn btn-submit" onclick="hnbCheckAttempt()" disabled>決定 (CHECK)</button>
      </div>
    </div>
  </div>

  <!-- 🏛️ スタート画面（モード選択） -->
  <div id="modal-start-menu" class="modal-overlay">
    <div class="modal-card">
      <div class="title-logo">HIT & BLOW</div>
      <div class="title-sub">推理と暗号のボードゲーム</div>

      <!-- 6色の球体オーブ装飾 -->
      <div class="title-spheres-tray">
        <div class="hnb-sphere c-red"></div>
        <div class="hnb-sphere c-blue"></div>
        <div class="hnb-sphere c-green"></div>
        <div class="hnb-sphere c-yellow"></div>
        <div class="hnb-sphere c-white"></div>
        <div class="hnb-sphere c-purple"></div>
      </div>

      <div class="mode-tab-group">
        <button id="tab-single" class="mode-tab-btn active" onclick="switchStartMode('single')">● ひとりで遊ぶ</button>
        <button id="tab-multi" class="mode-tab-btn" onclick="switchStartMode('multi')">○ みんなで遊ぶ</button>
      </div>

      <!-- ひとりで遊ぶ -->
      <div id="view-single" class="menu-group">
        <div class="menu-row">
          <span>あなた（プレイヤー）</span>
          <b>1人</b>
        </div>
        <div class="menu-row">
          <span>相手 (CPU) の人数</span>
          <select id="single-cpu-select" class="menu-select" onchange="toggleCpuDifficultyRow()">
            <option value="0" selected>なし (0人)</option>
            <option value="1">1人</option>
          </select>
        </div>
        <div class="menu-row" id="row-cpu-diff" style="display:none;">
          <span>CPUの難易度</span>
          <select id="single-cpu-diff" class="menu-select">
            <option value="easy">初級</option>
            <option value="normal" selected>中級</option>
            <option value="hard">上級</option>
          </select>
        </div>
        <div class="menu-row">
          <span>色の重複ルール</span>
          <select id="single-duplicate-select" class="menu-select">
            <option value="false" selected>重複なし</option>
            <option value="true">複数色あり（重複あり）</option>
          </select>
        </div>
      </div>

      <!-- みんなで遊ぶ (2人対戦) -->
      <div id="view-multi" class="menu-group" style="display:none;">
        <div class="menu-row">
          <span>遊ぶ人数 (プレイヤー)</span>
          <b>2人 (1台で対戦)</b>
        </div>
        <div class="menu-row">
          <span>色の重複ルール</span>
          <select id="multi-duplicate-select" class="menu-select">
            <option value="false" selected>重複なし</option>
            <option value="true">複数色あり（重複あり）</option>
          </select>
        </div>
      </div>

      <button class="btn-main-start" onclick="hnbConfirmSettings()">ゲーム開始</button>
    </div>
  </div>

  <!-- 🎲 手番順ダイス決定モーダル（相手がいる場合のみ） -->
  <div id="modal-dice-order" class="modal-overlay" style="display:none;">
    <div class="modal-card" style="text-align:center;">
      <h3 style="color:var(--hnb-brass); margin-bottom:4px;">🎲 先攻・手番の決定</h3>
      <p style="font-size:0.8rem; color:#c7b5a5;">出目が大きい方が先攻です</p>

      <div class="dice-grid">
        <div class="dice-card">
          <div class="dice-name" style="color:var(--c-p1)">1P</div>
          <div class="dice-white-face" id="dice-face-0">
            <div class="pip"></div><div class="pip"></div><div class="pip"></div>
            <div class="pip"></div><div class="pip"></div><div class="pip"></div>
            <div class="pip"></div><div class="pip"></div><div class="pip"></div>
          </div>
        </div>
        <div class="dice-card">
          <div class="dice-name" id="dice-opponent-name" style="color:var(--c-p2)">相手</div>
          <div class="dice-white-face" id="dice-face-1">
            <div class="pip"></div><div class="pip"></div><div class="pip"></div>
            <div class="pip"></div><div class="pip"></div><div class="pip"></div>
            <div class="pip"></div><div class="pip"></div><div class="pip"></div>
          </div>
        </div>
      </div>

      <p id="dice-order-msg" style="font-weight:700; min-height:1.4em; color:var(--hnb-brass); margin-bottom:14px; font-size:0.9rem;"></p>
      <button id="btn-roll-exec" class="btn-main-start" onclick="hnbExecuteDiceRoll()">ダイスを振る</button>
      <button id="btn-start-match" class="btn-main-start" style="display:none;" onclick="hnbStartActualMatch()">対戦開始！</button>
    </div>
  </div>

  <script>
    let audioCtx = null;
    function getAudioCtx() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }
    window.addEventListener('pointerdown', () => getAudioCtx(), { once: true });

    function playTone(freq, type = 'sine', duration = 0.08) {
      try {
        const ctx = getAudioCtx();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, ctx.currentTime);
        gain.gain.setValueAtTime(0.15, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + duration);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(); osc.stop(ctx.currentTime + duration);
      } catch (e) {}
    }

    const COLOR_CLASSES = ['', 'c-red', 'c-blue', 'c-green', 'c-yellow', 'c-white', 'c-purple'];
    const MAX_TOTAL_TURNS = 8;

    let startMode = 'single';
    let allowDuplicates = false;
    let participants = [];
    let turnOrder = [0];
    let currentOrderIdx = 0;
    let globalTurnCount = 0;

    let secretTargetCode = [];
    let currentInput = [0, 0, 0, 0];
    let isGameOver = false;

    let cpuDifficulty = 'normal';
    let cpuCandidatesPool = [];

    window.addEventListener('DOMContentLoaded', () => {
      document.getElementById('modal-start-menu').style.display = 'flex';
    });

    function switchStartMode(mode) {
      startMode = mode;
      const singleTab = document.getElementById('tab-single');
      const multiTab = document.getElementById('tab-multi');
      const singleView = document.getElementById('view-single');
      const multiView = document.getElementById('view-multi');

      if (mode === 'single') {
        singleTab.classList.add('active');
        singleTab.textContent = '● ひとりで遊ぶ';
        multiTab.classList.remove('active');
        multiTab.textContent = '○ みんなで遊ぶ';
        singleView.style.display = 'block';
        multiView.style.display = 'none';
      } else {
        multiTab.classList.add('active');
        multiTab.textContent = '● みんなで遊ぶ';
        singleTab.classList.remove('active');
        singleTab.textContent = '○ ひとりで遊ぶ';
        multiView.style.display = 'block';
        singleView.style.display = 'none';
      }
    }

    function toggleCpuDifficultyRow() {
      const val = document.getElementById('single-cpu-select').value;
      document.getElementById('row-cpu-diff').style.display = (val === '1') ? 'flex' : 'none';
    }

    function hnbConfirmSettings() {
      participants = [];
      if (startMode === 'single') {
        allowDuplicates = (document.getElementById('single-duplicate-select').value === 'true');
        const cpuCount = parseInt(document.getElementById('single-cpu-select').value, 10);
        participants.push({ id: 'P1', name: '1P', isCpu: false, badgeClass: 'var(--c-p1)' });
        if (cpuCount === 1) {
          cpuDifficulty = document.getElementById('single-cpu-diff').value;
          const diffLabel = { easy: '初級', normal: '中級', hard: '上級' }[cpuDifficulty];
          participants.push({ id: 'CPU', name: `CPU (${diffLabel})`, isCpu: true, badgeClass: 'var(--c-p2)' });
        }
      } else {
        allowDuplicates = (document.getElementById('multi-duplicate-select').value === 'true');
        participants.push({ id: 'P1', name: '1P', isCpu: false, badgeClass: 'var(--c-p1)' });
        participants.push({ id: 'P2', name: '2P', isCpu: false, badgeClass: 'var(--c-p2)' });
      }

      document.getElementById('modal-start-menu').style.display = 'none';

      if (participants.length > 1) {
        setupDiceScreen();
      } else {
        turnOrder = [0];
        hnbStartActualMatch();
      }
    }

    /* 白ダイス面描画 (1の中央のみ赤丸、3と5の中央は通常の黒丸) */
    function renderDiceFace(faceEl, num) {
      const pips = faceEl.querySelectorAll('.pip');
      pips.forEach(p => { 
        p.style.visibility = 'hidden';
        p.classList.remove('pip-center-red');
      });

      if (num === 1) {
        pips[4].classList.add('pip-center-red');
        pips[4].style.visibility = 'visible';
      } else if (num === 2) {
        pips[0].style.visibility = 'visible';
        pips[8].style.visibility = 'visible';
      } else if (num === 3) {
        pips[0].style.visibility = 'visible';
        pips[4].style.visibility = 'visible';
        pips[8].style.visibility = 'visible';
      } else if (num === 4) {
        pips[0].style.visibility = 'visible';
        pips[2].style.visibility = 'visible';
        pips[6].style.visibility = 'visible';
        pips[8].style.visibility = 'visible';
      } else if (num === 5) {
        pips[0].style.visibility = 'visible';
        pips[2].style.visibility = 'visible';
        pips[4].style.visibility = 'visible';
        pips[6].style.visibility = 'visible';
        pips[8].style.visibility = 'visible';
      } else if (num === 6) {
        pips[0].style.visibility = 'visible';
        pips[2].style.visibility = 'visible';
        pips[3].style.visibility = 'visible';
        pips[5].style.visibility = 'visible';
        pips[6].style.visibility = 'visible';
        pips[8].style.visibility = 'visible';
      }
    }

    function setupDiceScreen() {
      const modal = document.getElementById('modal-dice-order');
      modal.style.display = 'flex';

      document.getElementById('dice-opponent-name').textContent = participants[1].name;
      document.getElementById('dice-opponent-name').style.color = participants[1].badgeClass;

      renderDiceFace(document.getElementById('dice-face-0'), 1);
      renderDiceFace(document.getElementById('dice-face-1'), 1);

      document.getElementById('dice-order-msg').textContent = '';
      document.getElementById('btn-roll-exec').style.display = 'block';
      document.getElementById('btn-start-match').style.display = 'none';
    }

    function hnbExecuteDiceRoll() {
      const btn = document.getElementById('btn-roll-exec');
      btn.disabled = true;

      const f0 = document.getElementById('dice-face-0');
      const f1 = document.getElementById('dice-face-1');
      f0.classList.add('rolling');
      f1.classList.add('rolling');

      setTimeout(() => {
        let r0 = Math.floor(Math.random() * 6) + 1;
        let r1 = Math.floor(Math.random() * 6) + 1;
        while (r0 === r1) {
          r1 = Math.floor(Math.random() * 6) + 1;
        }

        f0.classList.remove('rolling');
        f1.classList.remove('rolling');
        renderDiceFace(f0, r0);
        renderDiceFace(f1, r1);

        if (r0 > r1) {
          turnOrder = [0, 1];
        } else {
          turnOrder = [1, 0];
        }

        const first = participants[turnOrder[0]];
        const msg = document.getElementById('dice-order-msg');
        msg.textContent = `🎯 先攻は 【${first.name}】 に決定しました！`;

        btn.style.display = 'none';
        btn.disabled = false;
        document.getElementById('btn-start-match').style.display = 'block';
      }, 700);
    }

    function hnbStartActualMatch() {
      document.getElementById('modal-dice-order').style.display = 'none';

      if (allowDuplicates) {
        // 重複あり暗号の生成
        secretTargetCode = [
          Math.floor(Math.random() * 6) + 1,
          Math.floor(Math.random() * 6) + 1,
          Math.floor(Math.random() * 6) + 1,
          Math.floor(Math.random() * 6) + 1
        ];
      } else {
        // 重複なし暗号の生成
        const colors = [1, 2, 3, 4, 5, 6].sort(() => Math.random() - 0.5);
        secretTargetCode = colors.slice(0, 4);
      }

      initCpuCandidates();

      const shutter = document.getElementById('hnb-shutter');
      shutter.classList.remove('open');

      for (let i = 0; i < 4; i++) {
        const sec = document.getElementById('hnb-sec-' + i);
        sec.className = 'hnb-sphere ' + COLOR_CLASSES[secretTargetCode[i]];
        sec.style.display = 'block';
      }

      currentOrderIdx = 0;
      globalTurnCount = 0;
      isGameOver = false;

      buildEmptyRack();
      startTurn();
    }

    function initCpuCandidates() {
      cpuCandidatesPool = [];
      const c = [1, 2, 3, 4, 5, 6];
      for (let i = 0; i < 6; i++) {
        for (let j = 0; j < 6; j++) {
          if (!allowDuplicates && j === i) continue;
          for (let k = 0; k < 6; k++) {
            if (!allowDuplicates && (k === i || k === j)) continue;
            for (let l = 0; l < 6; l++) {
              if (!allowDuplicates && (l === i || l === j || l === k)) continue;
              cpuCandidatesPool.push([c[i], c[j], c[k], c[l]]);
            }
          }
        }
      }
    }

    function buildEmptyRack() {
      const rack = document.getElementById('hnb-rack');
      rack.innerHTML = '';
      for (let r = 0; r < MAX_TOTAL_TURNS; r++) {
        const row = document.createElement('div');
        row.className = 'hnb-row';
        row.id = `hnb-row-${r}`;
        row.innerHTML = `
          <div class="hnb-turn-badge" id="badge-${r}">#${r + 1}</div>
          <div class="hnb-holes">
            ${[0, 1, 2, 3].map(col => `
              <div class="hnb-socket" onclick="hnbClickSlot(${r},${col})">
                <div id="sp-${r}-${col}" class="hnb-sphere"></div>
              </div>
            `).join('')}
          </div>
          <div class="hnb-pins-grid" id="pins-${r}">
            <div class="hnb-pin"></div><div class="hnb-pin"></div>
            <div class="hnb-pin"></div><div class="hnb-pin"></div>
          </div>
        `;
        rack.appendChild(row);
      }
    }

    function startTurn() {
      if (isGameOver) return;

      const actor = participants[turnOrder[currentOrderIdx]];
      const remaining = MAX_TOTAL_TURNS - globalTurnCount;
      const label = document.getElementById('hnb-current-turn-label');

      if (participants.length > 1) {
        label.textContent = `${actor.name} の推理番 (残${remaining}手)`;
        label.style.borderColor = actor.badgeClass;
      } else {
        label.textContent = `推理番 (残り${remaining}手)`;
        label.style.borderColor = 'var(--hnb-brass)';
      }

      const prevActive = document.querySelector('.hnb-row.active');
      if (prevActive) prevActive.classList.remove('active');

      if (globalTurnCount >= MAX_TOTAL_TURNS) {
        hnbEndGame(null, '規定の8ターンが終了しました！ゲーム終了です。');
        return;
      }

      const currentRow = document.getElementById(`hnb-row-${globalTurnCount}`);
      if (currentRow) {
        currentRow.classList.add('active');
        const badge = document.getElementById(`badge-${globalTurnCount}`);
        // 相手がいる場合のみ「#1: 1P」表示。0人(ソロ)なら「#1」のまま固定
        if (participants.length > 1) {
          badge.textContent = `${globalTurnCount + 1}: ${actor.name}`;
          badge.style.color = actor.badgeClass;
        } else {
          badge.textContent = `#${globalTurnCount + 1}`;
          badge.style.color = 'var(--hnb-brass)';
        }
      }

      currentInput = [0, 0, 0, 0];
      refreshCurrentInputRow();

      if (actor.isCpu) {
        document.getElementById('hnb-submit-btn').disabled = true;
        setTimeout(() => { executeCpuLogic(actor); }, 900);
      }
    }

    function executeCpuLogic(cpuActor) {
      if (isGameOver) return;

      let pick = [];
      if (cpuDifficulty === 'easy') {
        if (allowDuplicates) {
          pick = [
            Math.floor(Math.random() * 6) + 1,
            Math.floor(Math.random() * 6) + 1,
            Math.floor(Math.random() * 6) + 1,
            Math.floor(Math.random() * 6) + 1
          ];
        } else {
          const pool = [1, 2, 3, 4, 5, 6].sort(() => Math.random() - 0.5);
          pick = pool.slice(0, 4);
        }
      } else if (cpuDifficulty === 'hard') {
        pick = cpuCandidatesPool[0] || [1, 2, 3, 4];
      } else {
        pick = cpuCandidatesPool[Math.floor(Math.random() * cpuCandidatesPool.length)] || [1, 2, 3, 4];
      }

      currentInput = [...pick];
      refreshCurrentInputRow();
      playTone(500, 'triangle');

      setTimeout(() => { hnbCheckAttempt(); }, 700);
    }

    /* 重複なし設定時でも同じ色を複数並べられるよう入力制限を解除 */
    function hnbInputColor(c) {
      const actor = participants[turnOrder[currentOrderIdx]];
      if (isGameOver || actor.isCpu) return;

      const empty = currentInput.indexOf(0);
      if (empty !== -1) {
        currentInput[empty] = c;
        playTone(400, 'triangle', 0.05);
        refreshCurrentInputRow();
      }
    }

    function hnbClickSlot(rowIdx, colIdx) {
      const actor = participants[turnOrder[currentOrderIdx]];
      if (isGameOver || actor.isCpu || rowIdx !== globalTurnCount) return;
      if (currentInput[colIdx] !== 0) {
        currentInput[colIdx] = 0;
        playTone(350, 'triangle', 0.05);
        refreshCurrentInputRow();
      }
    }

    function hnbDeleteColor() {
      const actor = participants[turnOrder[currentOrderIdx]];
      if (isGameOver || actor.isCpu) return;
      for (let i = 3; i >= 0; i--) {
        if (currentInput[i] !== 0) {
          currentInput[i] = 0;
          playTone(320, 'triangle', 0.05);
          refreshCurrentInputRow();
          break;
        }
      }
    }

    function refreshCurrentInputRow() {
      if (globalTurnCount >= MAX_TOTAL_TURNS) return;
      for (let col = 0; col < 4; col++) {
        const sp = document.getElementById(`sp-${globalTurnCount}-${col}`);
        if (!sp) continue;
        const c = currentInput[col];
        if (c > 0) {
          sp.className = 'hnb-sphere ' + COLOR_CLASSES[c];
          sp.style.display = 'block';
        } else {
          sp.style.display = 'none';
        }
      }
      const ready = currentInput.every(v => v > 0);
      const actor = participants[turnOrder[currentOrderIdx]];
      document.getElementById('hnb-submit-btn').disabled = !ready || actor.isCpu || isGameOver;
    }

    /* 正式なHit & Blow判定ロジック (重複色あり・なし両対応) */
    function computeScore(guess, secret) {
      let hits = 0;
      let blows = 0;
      const secretRemainder = [];
      const guessRemainder = [];

      for (let i = 0; i < 4; i++) {
        if (guess[i] === secret[i]) {
          hits++;
        } else {
          secretRemainder.push(secret[i]);
          guessRemainder.push(guess[i]);
        }
      }

      for (let i = 0; i < guessRemainder.length; i++) {
        const idx = secretRemainder.indexOf(guessRemainder[i]);
        if (idx !== -1) {
          blows++;
          secretRemainder.splice(idx, 1);
        }
      }

      return { hits, blows };
    }

    function hnbCheckAttempt() {
      if (isGameOver) return;

      const actor = participants[turnOrder[currentOrderIdx]];
      const { hits, blows } = computeScore(currentInput, secretTargetCode);

      const pinEls = document.getElementById(`pins-${globalTurnCount}`).querySelectorAll('.hnb-pin');
      let pIdx = 0;
      for (let i = 0; i < hits; i++) {
        const pin = pinEls[pIdx++];
        setTimeout(() => { pin.className = 'hnb-pin hit'; playTone(987, 'sine', 0.09); }, i * 130);
      }
      for (let i = 0; i < blows; i++) {
        const pin = pinEls[pIdx++];
        setTimeout(() => { pin.className = 'hnb-pin blow'; playTone(659, 'sine', 0.09); }, (hits + i) * 130);
      }

      if (actor.isCpu) {
        filterCpuCandidates(currentInput, hits, blows);
      }

      const totalDelay = (hits + blows) * 130 + 400;

      setTimeout(() => {
        if (hits === 4) {
          const winMsg = participants.length > 1 
            ? `🎉 4 HIT！完全的中！\n【${actor.name}】の勝利です！`
            : `🎉 4 HIT！完全的中！お見事です！`;
          hnbEndGame(actor, winMsg);
          return;
        }

        globalTurnCount++;
        currentOrderIdx = (currentOrderIdx + 1) % turnOrder.length;
        startTurn();
      }, totalDelay);
    }

    function filterCpuCandidates(guess, targetHits, targetBlows) {
      cpuCandidatesPool = cpuCandidatesPool.filter(cand => {
        const { hits, blows } = computeScore(cand, guess);
        return hits === targetHits && blows === targetBlows;
      });
    }

    function hnbEndGame(winner, message) {
      isGameOver = true;
      document.getElementById('hnb-shutter').classList.add('open');
      playTone(523, 'triangle', 0.2);
      setTimeout(() => alert(message), 250);
    }

    function hnbReturnToTitle() {
      if (confirm('ゲームを終了してタイトル画面に戻りますか？')) {
        location.reload();
      }
    }
  </script>
