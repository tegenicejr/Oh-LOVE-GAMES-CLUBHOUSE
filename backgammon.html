<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>バックギャモン (Backgammon)</title>
  <style>
    :root {
      --bg-desk: #110c08;
      --felt-dark: #122c19;
      --felt-light: #1c4528;
      --board-rim: #362214;
      --brass-gold: #d4a359;
      --brass-glow: rgba(212, 163, 89, 0.45);
    }
    * {
      box-sizing: border-box; margin: 0; padding: 0;
      user-select: none; -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    html, body {
      width: 100%; height: 100%;
      background: var(--bg-desk);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Hiragino Sans", sans-serif;
      color: #fff;
      overflow-x: hidden; overflow-y: auto;
    }
    .viewport {
      width: 100%; min-height: 100%;
      padding: calc(8px + env(safe-area-inset-top)) 4px calc(60px + env(safe-area-inset-bottom));
      display: flex; flex-direction: column; align-items: center;
      background: radial-gradient(circle at 50% 20%, #2b1a10 0%, var(--bg-desk) 100%);
    }
    .topbar {
      width: 100%; max-width: 380px;
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 6px; padding: 0 4px;
    }
    .badge-bar { display: flex; gap: 6px; align-items: center; }
    .bg-badge {
      background: rgba(0,0,0,0.7);
      border: 1.5px solid #442d1c;
      border-radius: 12px;
      padding: 4px 10px;
      font-size: 0.8rem; font-weight: 800; color: #ede2d5;
      display: flex; align-items: center; gap: 5px;
    }
    .bg-badge.turn-active {
      border-color: var(--brass-gold);
      box-shadow: 0 0 10px var(--brass-glow);
    }
    .checker-icon { width: 13px; height: 13px; border-radius: 50%; }
    .checker-icon.white { background: radial-gradient(circle at 35% 30%, #fff, #bbb); border: 1px solid #fff; }
    .checker-icon.red { background: radial-gradient(circle at 35% 30%, #ff7675, #c0392b); border: 1px solid #ff9f43; }
    .tool-btn {
      background: linear-gradient(145deg, #2c1c12 0%, #1c1109 100%);
      border: 1.5px solid #4d3320; color: var(--brass-gold);
      width: 34px; height: 34px; border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-size: 0.95rem; cursor: pointer;
    }
    .table-felt {
      position: relative;
      width: 100%; max-width: 380px;
      background: radial-gradient(circle at 50% 35%, var(--felt-light) 0%, var(--felt-dark) 100%);
      border: 5px solid var(--board-rim);
      border-radius: 16px;
      padding: 10px 4px 14px;
      box-shadow: 0 16px 40px rgba(0,0,0,0.95);
      display: flex; flex-direction: column; align-items: center; gap: 8px;
    }
    .turn-announcer {
      font-size: 0.88rem; font-weight: 800; color: #ede2d5; min-height: 20px; text-align: center;
    }
    /* バックギャモンボード：スマホの画面幅に合わせて完全フィット */
    .bg-board-frame {
      width: 100%; aspect-ratio: 1.25;
      background: #190f09;
      border: 3px solid #583920;
      border-radius: 12px;
      box-shadow: 0 10px 24px rgba(0,0,0,0.85);
      position: relative;
      overflow: hidden;
    }
    #bg-svg { width: 100%; height: 100%; display: block; }
    .pt-tri-dark { fill: #4a2810; }
    .pt-tri-light { fill: #cba36b; }
    .pt-tri.highlight { fill: #2ecc71 !important; opacity: 0.85; filter: drop-shadow(0 0 6px #2ecc71); }
    .bar-highlight { fill: rgba(46, 204, 113, 0.4) !important; stroke: #2ecc71; stroke-width: 2; }
    .pt-hit { fill: transparent; cursor: pointer; }
    .bar-line { fill: #2c160c; stroke: #583920; stroke-width: 1.5; }
    .bear-off-zone { fill: #120b06; stroke: #422814; stroke-width: 1; }
    .bear-off-zone.highlight { stroke: #2ecc71; stroke-width: 2; fill: rgba(46,204,113,0.3); }

    .controls-bar {
      display: flex; justify-content: space-between; align-items: center;
      width: 100%; padding: 0 4px;
    }
    .dice-container { display: flex; gap: 6px; align-items: center; }
    .bg-die {
      width: 34px; height: 34px;
      background: linear-gradient(145deg, #fff 0%, #eee 70%, #ccc 100%);
      border-radius: 7px; border: 1.5px solid #999;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.1rem; font-weight: 900; color: #222;
      box-shadow: 0 3px 6px rgba(0,0,0,0.6);
    }
    .bg-die.used { opacity: 0.25; border-color: #555; }
    .roll-btn {
      background: linear-gradient(180deg, #d4a359, #aa782e);
      border: none; border-radius: 12px;
      color: #140c06; font-weight: 900; font-size: 0.9rem;
      padding: 8px 16px; cursor: pointer;
    }
    .roll-btn:disabled { background: #3a2e26; color: #635245; cursor: not-allowed; }
    .modal-overlay {
      display: none; position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.82); z-index: 99999;
      align-items: center; justify-content: center;
    }
    .modal-overlay.active { display: flex; }
    .modal-sheet {
      background: #20140c; border: 3px solid #4d3320;
      border-radius: 20px; padding: 22px; width: 88%; max-width: 440px; color: #ede2d5;
    }
  </style>
</head>
<body>
  <div class="viewport">
    <div class="topbar">
      <div class="badge-bar">
        <div class="bg-badge turn-active" id="badge-w">
          <div class="checker-icon white"></div>
          <span id="name-w">白: 残<b id="rem-w">15</b></span>
        </div>
        <div class="bg-badge" id="badge-r">
          <div class="checker-icon red"></div>
          <span id="name-r">赤: 残<b id="rem-r">15</b></span>
        </div>
      </div>
      <div style="display:flex; gap:8px;">
        <div class="tool-btn" onclick="initGame()">🔄</div>
        <div class="tool-btn" onclick="toggleRules(true)">📖</div>
      </div>
    </div>

    <div class="table-felt">
      <div class="turn-announcer" id="announcer">白の手番：サイコロを振ってください</div>

      <div class="bg-board-frame">
        <svg id="bg-svg" viewBox="0 0 380 300">
          <defs>
            <radialGradient id="chkWhite" cx="35%" cy="30%" r="65%">
              <stop offset="0%" stop-color="#ffffff"/>
              <stop offset="70%" stop-color="#e0e0e0"/>
              <stop offset="100%" stop-color="#b0b0b0"/>
            </radialGradient>
            <radialGradient id="chkRed" cx="35%" cy="30%" r="65%">
              <stop offset="0%" stop-color="#ff7675"/>
              <stop offset="70%" stop-color="#d63031"/>
              <stop offset="100%" stop-color="#7e1212"/>
            </radialGradient>
          </defs>
          <g id="board-bg-layer"></g>
          <g id="triangles-layer"></g>
          <g id="checkers-layer"></g>
          <g id="hits-layer"></g>
        </svg>
      </div>

      <div class="controls-bar">
        <div class="dice-container" id="dice-box">
          <div class="bg-die" id="die-1">-</div>
          <div class="bg-die" id="die-2">-</div>
        </div>
        <button class="roll-btn" id="btn-roll" onclick="rollDice()">サイコロを振る</button>
      </div>
    </div>
  </div>

  <div id="modal-rules" class="modal-overlay">
    <div class="modal-sheet">
      <h3 style="color:var(--brass-gold); text-align:center; margin-bottom:12px;">📖 バックギャモンのあそびかた</h3>
      <div style="font-size:0.84rem; line-height:1.6; color:#c9b9aa;">
        <p>サイコロを振って自分の15枚の駒をすべて右端（ベアオフ）から脱出させる伝統ゲームです。</p>
        <br>
        <ul style="padding-left:18px;">
          <li><b>白は反時計回り</b>（0→23）、<b>赤は時計回り</b>（23→0）に進みます。</li>
          <li>相手の駒が1枚だけのマスに止まると<b>ヒット（中央バーへ送還）</b>できます。</li>
          <li><b>バーに駒がある場合</b>、まずバーの駒を最優先で復活させなければ他の駒は動かせません。</li>
          <li>すべての駒を自分のインナー（ゴール側6マス）に集めたら、右端から脱出（ベアオフ）できます！</li>
        </ul>
      </div>
      <button class="roll-btn" style="width:100%; margin-top:14px;" onclick="toggleRules(false)">閉じる</button>
    </div>
  </div>

  <script>
    let audioCtx = null;
    function getAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }
    window.addEventListener('pointerdown', () => getAudio(), { once: true });

    function playSound(f1, f2) {
      try {
        const ctx = getAudio();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.frequency.setValueAtTime(f1, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(f2, ctx.currentTime + 0.05);
        gain.gain.setValueAtTime(0.2, ctx.currentTime);
        gain.gain.linearRampToValueAtTime(0.01, ctx.currentTime + 0.05);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(); osc.stop(ctx.currentTime + 0.06);
      } catch(e) {}
    }

    let points = Array(24).fill(null).map(() => ({ player: null, count: 0 }));
    let bar = { W: 0, R: 0 };
    let off = { W: 0, R: 0 };
    let currentTurn = 'W'; // 'W' or 'R'
    let dice = [];
    let movesLeft = [];
    let selectedFrom = null;
    let isComThinking = false;

    window.addEventListener('DOMContentLoaded', () => {
      buildSvgBoard();
      initGame();
    });

    function initGame() {
      points = Array(24).fill(null).map(() => ({ player: null, count: 0 }));
      bar = { W: 0, R: 0 };
      off = { W: 0, R: 0 };
      currentTurn = 'W';
      dice = [];
      movesLeft = [];
      selectedFrom = null;
      isComThinking = false;

      // 正式初期配置
      setPt(0, 'W', 2);  setPt(11, 'W', 5); setPt(16, 'W', 3); setPt(18, 'W', 5);
      setPt(23, 'R', 2); setPt(12, 'R', 5); setPt(7, 'R', 3);  setPt(5, 'R', 5);

      document.getElementById('btn-roll').disabled = false;
      document.getElementById('die-1').textContent = '-';
      document.getElementById('die-2').textContent = '-';
      document.getElementById('die-1').classList.remove('used');
      document.getElementById('die-2').classList.remove('used');

      updateUI();
      renderCheckers();
    }

    function setPt(i, p, c) { points[i] = { player: p, count: c }; }

    function buildSvgBoard() {
      const bg = document.getElementById('board-bg-layer');
      const tri = document.getElementById('triangles-layer');
      const hits = document.getElementById('hits-layer');
      bg.innerHTML = ''; tri.innerHTML = ''; hits.innerHTML = '';

      // 中央バー (viewBox 380×300 中、X: 175〜199)
      const barRect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      barRect.setAttribute('x', 175); barRect.setAttribute('y', 0);
      barRect.setAttribute('width', 24); barRect.setAttribute('height', 300);
      barRect.setAttribute('class', 'bar-line');
      barRect.setAttribute('id', 'bar-svg-rect');
      bg.appendChild(barRect);

      // 右端ベアオフ受皿 (X: 356〜380)
      const offRect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      offRect.setAttribute('x', 356); offRect.setAttribute('y', 0);
      offRect.setAttribute('width', 24); offRect.setAttribute('height', 300);
      offRect.setAttribute('class', 'bear-off-zone');
      offRect.setAttribute('id', 'off-svg-zone');
      offRect.onclick = () => handleBearOffClick();
      bg.appendChild(offRect);

      // 24本の三角形
      for (let i = 0; i < 24; i++) {
        const coords = getTriangleCoords(i);
        const poly = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
        poly.setAttribute('points', coords);
        poly.setAttribute('class', `pt-tri ${i % 2 === 0 ? 'pt-tri-dark' : 'pt-tri-light'}`);
        poly.setAttribute('id', `tri-${i}`);
        tri.appendChild(poly);

        // タップ判定
        const hit = document.createElementNS('http://www.w3.org/2000/svg', 'polygon');
        hit.setAttribute('points', coords);
        hit.setAttribute('class', 'pt-hit');
        hit.onclick = () => handlePointClick(i);
        hits.appendChild(hit);
      }

      // バータップ判定
      const barHit = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
      barHit.setAttribute('x', 175); barHit.setAttribute('y', 0);
      barHit.setAttribute('width', 24); barHit.setAttribute('height', 300);
      barHit.setAttribute('class', 'pt-hit');
      barHit.onclick = () => handleBarClick();
      hits.appendChild(barHit);
    }

    function getTriangleCoords(i) {
      let col = 0;
      let isTop = i < 12;
      if (isTop) col = (i < 6) ? (11 - i) : (12 - i);
      else col = (i < 18) ? (i - 12) : (i - 11);

      let x = col * 26 + (col >= 6 ? 36 : 6);
      let yBase = isTop ? 0 : 300;
      let yTip = isTop ? 120 : 180;
      return `${x},${yBase} ${x+24},${yBase} ${x+12},${yTip}`;
    }

    function rollDice() {
      if (movesLeft.length > 0 || isComThinking || currentTurn !== 'W') return;
      playSound(340, 100);

      const d1 = Math.floor(Math.random() * 6) + 1;
      const d2 = Math.floor(Math.random() * 6) + 1;
      dice = [d1, d2];
      movesLeft = (d1 === d2) ? [d1, d1, d1, d1] : [d1, d2];

      document.getElementById('die-1').textContent = d1;
      document.getElementById('die-2').textContent = d2;
      document.getElementById('die-1').classList.remove('used');
      document.getElementById('die-2').classList.remove('used');
      document.getElementById('btn-roll').disabled = true;

      document.getElementById('announcer').textContent =
        `白の出目 [${movesLeft.join(', ')}]：駒を選んでください`;

      if (!hasAnyLegalMoves('W')) {
        setTimeout(() => {
          alert('白は動かせる駒がありません。パスします。');
          endTurn();
        }, 500);
      }
    }

    function handleBarClick() {
      if (movesLeft.length === 0 || currentTurn !== 'W' || isComThinking) return;
      if (bar.W > 0) {
        selectedFrom = 'bar';
        highlightLegalMovesFor('bar');
      }
    }

    function handlePointClick(idx) {
      if (movesLeft.length === 0 || currentTurn !== 'W' || isComThinking) return;

      if (bar.W > 0 && selectedFrom !== 'bar') {
        alert('バーに駒があります！まずバーから復帰させてください。');
        selectedFrom = 'bar';
        highlightLegalMovesFor('bar');
        return;
      }

      if (selectedFrom === null) {
        if (points[idx].player === 'W' && points[idx].count > 0) {
          selectedFrom = idx;
          highlightLegalMovesFor(idx);
        }
      } else {
        if (selectedFrom === idx) {
          selectedFrom = null;
          clearHighlights();
        } else {
          const moved = tryExecuteMove(selectedFrom, idx, 'W');
          if (!moved) {
            if (points[idx].player === 'W' && points[idx].count > 0 && bar.W === 0) {
              selectedFrom = idx;
              highlightLegalMovesFor(idx);
            }
          }
        }
      }
    }

    function handleBearOffClick() {
      if (movesLeft.length === 0 || currentTurn !== 'W' || isComThinking || selectedFrom === null) return;
      tryExecuteBearOff(selectedFrom, 'W');
    }

    function tryExecuteMove(from, to, player) {
      const opp = player === 'W' ? 'R' : 'W';
      const dest = points[to];

      if (dest.player === opp && dest.count >= 2) return false;

      let dist = 0;
      if (from === 'bar') {
        dist = player === 'W' ? (to + 1) : (24 - to);
      } else {
        dist = player === 'W' ? (to - from) : (from - to);
      }

      const moveIdx = movesLeft.indexOf(dist);
      if (moveIdx === -1) return false;

      movesLeft.splice(moveIdx, 1);

      if (from === 'bar') {
        bar[player]--;
      } else {
        points[from].count--;
        if (points[from].count === 0) points[from].player = null;
      }

      if (dest.player === opp && dest.count === 1) {
        bar[opp]++;
        dest.player = player;
        dest.count = 1;
        playSound(550, 150);
      } else {
        dest.player = player;
        dest.count++;
        playSound(420, 220);
      }

      selectedFrom = null;
      clearHighlights();
      renderCheckers();
      updateUI();

      checkTurnOrVictory();
      return true;
    }

    function tryExecuteBearOff(from, player) {
      if (from === 'bar') return false;
      if (!canBearOff(player)) return false;

      const dist = player === 'W' ? (24 - from) : (from + 1);

      let moveIdx = movesLeft.indexOf(dist);
      if (moveIdx === -1) {
        const hasLarger = movesLeft.some(d => d > dist);
        if (hasLarger) {
          const isFurthest = player === 'W' ?
            points.slice(18, from).every(pt => pt.player !== 'W') :
            points.slice(from + 1, 6).every(pt => pt.player !== 'R');

          if (isFurthest) {
            const maxDie = Math.max(...movesLeft);
            moveIdx = movesLeft.indexOf(maxDie);
          }
        }
      }

      if (moveIdx !== -1) {
        movesLeft.splice(moveIdx, 1);
        points[from].count--;
        if (points[from].count === 0) points[from].player = null;
        off[player]++;
        playSound(600, 300);

        selectedFrom = null;
        clearHighlights();
        renderCheckers();
        updateUI();

        if (off[player] === 15) {
          setTimeout(() => alert(`🎉 ${player === 'W' ? '白' : '赤'}の勝利！全駒を脱出させました！`), 200);
          return true;
        }

        checkTurnOrVictory();
        return true;
      }
      return false;
    }

    function canBearOff(player) {
      if (bar[player] > 0) return false;
      if (player === 'W') {
        return points.slice(0, 18).every(pt => pt.player !== 'W');
      } else {
        return points.slice(6, 24).every(pt => pt.player !== 'R');
      }
    }

    function hasAnyLegalMoves(player) {
      if (movesLeft.length === 0) return false;
      const opp = player === 'W' ? 'R' : 'W';

      if (bar[player] > 0) {
        return movesLeft.some(die => {
          const target = player === 'W' ? (die - 1) : (24 - die);
          return (points[target].player !== opp || points[target].count < 2);
        });
      }

      for (let i = 0; i < 24; i++) {
        if (points[i].player === player) {
          for (const die of movesLeft) {
            const target = player === 'W' ? (i + die) : (i - die);
            if (target >= 0 && target <= 23) {
              if (points[target].player !== opp || points[target].count < 2) return true;
            } else if (canBearOff(player)) {
              return true;
            }
          }
        }
      }
      return false;
    }

    function checkTurnOrVictory() {
      if (movesLeft.length === 0 || !hasAnyLegalMoves(currentTurn)) {
        endTurn();
      }
    }

    function endTurn() {
      currentTurn = (currentTurn === 'W') ? 'R' : 'W';
      movesLeft = [];
      selectedFrom = null;
      clearHighlights();

      document.getElementById('die-1').classList.add('used');
      document.getElementById('die-2').classList.add('used');
      updateUI();

      if (currentTurn === 'R') {
        document.getElementById('btn-roll').disabled = true;
        setTimeout(handleComTurn, 600);
      } else {
        isComThinking = false;
        document.getElementById('btn-roll').disabled = false;
        document.getElementById('announcer').textContent = '白の手番：サイコロを振ってください';
      }
    }

    /* COM思考ルーチン (赤) */
    function handleComTurn() {
      if (currentTurn !== 'R') return;
      isComThinking = true;

      playSound(340, 100);
      const d1 = Math.floor(Math.random() * 6) + 1;
      const d2 = Math.floor(Math.random() * 6) + 1;
      dice = [d1, d2];
      movesLeft = (d1 === d2) ? [d1, d1, d1, d1] : [d1, d2];

      document.getElementById('die-1').textContent = d1;
      document.getElementById('die-2').textContent = d2;
      document.getElementById('die-1').classList.remove('used');
      document.getElementById('die-2').classList.remove('used');
      document.getElementById('announcer').textContent = `COM(赤)の出目 [${movesLeft.join(', ')}]：思考中...`;

      // COMの行動実行ループ
      const executeNextComMove = () => {
        if (currentTurn !== 'R') return;

        if (movesLeft.length === 0 || !hasAnyLegalMoves('R')) {
          endTurn();
          return;
        }

        let acted = false;
        if (bar.R > 0) {
          for (const d of movesLeft) {
            const target = 24 - d;
            if (points[target].player !== 'W' || points[target].count < 2) {
              tryExecuteMove('bar', target, 'R');
              acted = true;
              break;
            }
          }
        } else {
          if (canBearOff('R')) {
            for (let i = 0; i <= 5; i++) {
              if (points[i].player === 'R') {
                if (tryExecuteBearOff(i, 'R')) { acted = true; break; }
              }
            }
          }
          if (!acted) {
            let candidateMoves = [];
            for (let i = 23; i >= 0; i--) {
              if (points[i].player === 'R') {
                for (const d of movesLeft) {
                  const target = i - d;
                  if (target >= 0 && (points[target].player !== 'W' || points[target].count < 2)) {
                    const isHit = (points[target].player === 'W' && points[target].count === 1);
                    candidateMoves.push({ from: i, to: target, isHit });
                  }
                }
              }
            }
            if (candidateMoves.length > 0) {
              candidateMoves.sort((a, b) => (b.isHit ? 1 : 0) - (a.isHit ? 1 : 0));
              tryExecuteMove(candidateMoves[0].from, candidateMoves[0].to, 'R');
              acted = true;
            }
          }
        }

        if (acted && movesLeft.length > 0 && hasAnyLegalMoves('R')) {
          setTimeout(executeNextComMove, 500);
        } else {
          endTurn();
        }
      };

      setTimeout(executeNextComMove, 550);
    }

    function highlightLegalMovesFor(from) {
      clearHighlights();
      const opp = 'R';

      if (from === 'bar') {
        document.getElementById('bar-svg-rect').classList.add('bar-highlight');
        movesLeft.forEach(d => {
          const target = d - 1;
          if (points[target].player !== opp || points[target].count < 2) {
            document.getElementById(`tri-${target}`).classList.add('highlight');
          }
        });
        return;
      }

      movesLeft.forEach(d => {
        const target = from + d;
        if (target <= 23) {
          if (points[target].player !== opp || points[target].count < 2) {
            document.getElementById(`tri-${target}`).classList.add('highlight');
          }
        } else if (canBearOff('W')) {
          document.getElementById('off-svg-zone').classList.add('highlight');
        }
      });
    }

    function clearHighlights() {
      document.querySelectorAll('.pt-tri').forEach(t => t.classList.remove('highlight'));
      document.getElementById('bar-svg-rect').classList.remove('bar-highlight');
      document.getElementById('off-svg-zone').classList.remove('highlight');
    }

    function renderCheckers() {
      const layer = document.getElementById('checkers-layer');
      layer.innerHTML = '';

      for (let i = 0; i < 24; i++) {
        const pt = points[i];
        if (pt.count > 0) {
          const isTop = i < 12;
          let col = isTop ? ((i < 6) ? (11 - i) : (12 - i)) : ((i < 18) ? (i - 12) : (i - 11));
          let x = col * 26 + (col >= 6 ? 36 : 6) + 12;

          const showCount = Math.min(pt.count, 5);
          for (let c = 0; c < showCount; c++) {
            let y = isTop ? (12 + c * 18) : (288 - c * 18);
            const circ = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
            circ.setAttribute('cx', x); circ.setAttribute('cy', y);
            circ.setAttribute('r', 8.5);
            circ.setAttribute('fill', pt.player === 'W' ? 'url(#chkWhite)' : 'url(#chkRed)');
            circ.setAttribute('stroke', pt.player === 'W' ? '#fff' : '#ff9f43');
            layer.appendChild(circ);
          }
          if (pt.count > 5) {
            const txt = document.createElementNS('http://www.w3.org/2000/svg', 'text');
            txt.setAttribute('x', x); txt.setAttribute('y', isTop ? 106 : 194);
            txt.setAttribute('fill', '#fff'); txt.setAttribute('font-size', '9');
            txt.setAttribute('font-weight', '900'); txt.setAttribute('text-anchor', 'middle');
            txt.textContent = pt.count;
            layer.appendChild(txt);
          }
        }
      }

      if (bar.W > 0) {
        for (let c = 0; c < Math.min(bar.W, 4); c++) {
          const circ = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
          circ.setAttribute('cx', 187); circ.setAttribute('cy', 105 - c * 18);
          circ.setAttribute('r', 8.5); circ.setAttribute('fill', 'url(#chkWhite)');
          layer.appendChild(circ);
        }
      }
      if (bar.R > 0) {
        for (let c = 0; c < Math.min(bar.R, 4); c++) {
          const circ = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
          circ.setAttribute('cx', 187); circ.setAttribute('cy', 195 + c * 18);
          circ.setAttribute('r', 8.5); circ.setAttribute('fill', 'url(#chkRed)');
          layer.appendChild(circ);
        }
      }
    }

    function updateUI() {
      document.getElementById('badge-w').classList.toggle('turn-active', currentTurn === 'W');
      document.getElementById('badge-r').classList.toggle('turn-active', currentTurn === 'R');
      document.getElementById('rem-w').textContent = 15 - off.W;
      document.getElementById('rem-r').textContent = 15 - off.R;
    }

    function toggleRules(show) { document.getElementById('modal-rules').classList.toggle('active', show); }
  </script>
</body>
</html>
